<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOD — Calendário Comercial (dia a dia)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF;
    --paper:#FFFFFF;
    --ink:#1C2A22;
    --ink-soft:#4C5A51;
    --green-deep:#1B5E20;
    --green-mid:#3D8361;
    --green-pale:#E7F0E9;
    --gold:#C0873A;
    --gold-pale:#F7ECDC;
    --muted:#B7C0B9;
    --muted-pale:#F3F3EF;
    --line:#E1DED3;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px 20px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{margin-bottom:24px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--green-mid);font-weight:600;margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,4.5vw,38px);
    line-height:1.08;margin:0 0 8px;color:var(--green-deep);letter-spacing:-0.01em;
  }
  .sub{font-size:14.5px;color:var(--ink-soft);max-width:600px;line-height:1.5;}

  nav.tabs{display:flex;gap:8px;margin:22px 0 20px;flex-wrap:wrap;}
  .tab-btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:9px 18px;
    border-radius:999px;border:1px solid var(--line);background:var(--paper);
    color:var(--ink-soft);cursor:pointer;transition:all .15s ease;
  }
  .tab-btn:hover{border-color:var(--green-mid);color:var(--green-deep);}
  .tab-btn.active{background:var(--green-deep);border-color:var(--green-deep);color:#fff;}
  .tab-btn:disabled{opacity:.35;cursor:not-allowed;}
  .tab-btn:disabled:hover{border-color:var(--line);color:var(--ink-soft);}

  .exec-panel{margin-bottom:22px;}

  .exec-banner{
    background:linear-gradient(135deg, var(--green-deep), var(--green-mid));
    border-radius:var(--radius);
    padding:20px 24px;
    margin-bottom:12px;
  }
  .exec-banner-label{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:6px;
  }
  .exec-banner-phrase{
    font-family:'Fraunces',serif;font-weight:600;font-size:clamp(19px,3vw,26px);
    line-height:1.2;color:#fff;letter-spacing:-0.01em;
  }

  .exec-stats-row{
    display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:10px;
  }
  .exec-stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .exec-num{font-family:'Fraunces',serif;font-size:24px;font-weight:600;color:var(--green-deep);line-height:1;}
  .exec-label{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--ink-soft);margin-top:4px;
  }

  .month-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .month-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--green-deep);}
  .month-note{font-size:13px;color:var(--ink-soft);font-style:italic;}

  .weeks{display:flex;flex-direction:column;gap:10px;}

  .week-card{
    background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--muted);
    border-radius:var(--radius);padding:14px 18px;
  }
  .week-card.has-content{border-left-color:var(--green-mid);}
  .week-card.has-label{border-left-color:var(--gold);}
  .week-card.muted{border-left-color:var(--muted);}

  .wc-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .wc-week{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    color:var(--green-mid);letter-spacing:.04em;
  }
  .wc-range{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}

  .wc-empty{font-size:12.5px;color:var(--ink-soft);font-style:italic;}

  /* chip = dia com rótulo mas sem ação de papel nenhuma */
  .wc-chip{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#8A5A17;
    background:var(--gold-pale);border:1px solid #EBD8B8;border-radius:999px;padding:3px 10px;
    margin:0 6px 8px 0;
  }
  .wc-chip::before{content:"✦";font-size:10px;}

  /* dia com pelo menos uma ação preenchida */
  .day-block{margin-top:4px;}
  .day-block + .day-block{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
  .day-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .day-num{
    font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;color:var(--green-deep);
    background:var(--green-pale);padding:2px 8px;border-radius:6px;
  }
  .day-label{font-size:14px;font-weight:700;color:var(--ink);}
  .day-label.flag{color:#8A5A17;}

  .roles{display:grid;grid-template-columns:1fr;gap:5px;}
  .role-row{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:12.5px;line-height:1.4;}
  .role-tag{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;color:var(--ink-soft);padding-top:1px;
  }
  .role-text{color:var(--ink);}

  @media (max-width:600px){ .role-row{grid-template-columns:64px 1fr;} }

  footer{margin-top:30px;font-size:11.5px;color:var(--ink-soft);text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">HOD · Comercial</div>
    <h1>Calendário Comercial</h1>
    <div class="sub">Modelo dia a dia — uma linha por data, com Marketing, SDR, Closer e Gestão. Só os dias com algo registrado aparecem nos cards.</div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div class="exec-panel" id="execPanel"></div>

  <div class="month-meta">
    <div class="month-title" id="monthTitle"></div>
    <div class="month-note" id="monthNote"></div>
  </div>

  <div class="weeks" id="weeks"></div>

  <footer>Ferramenta de acompanhamento interno — HOD (Home Office Digital) · gerado a partir da planilha-base dia a dia</footer>
</div>

<script>
// Fonte: uma linha por dia do calendário (Mês, Semana, Dia, Data Comercial,
// Ação Marketing, Ação SDR, Ação Closer, Ação Gestão). Dias sem nenhum
// conteúdo em nenhuma coluna simplesmente não aparecem no card da semana.
const RAW_DAYS = [
["Set","S1",1,null,null,null,null,"Day OFF para Closers e SDRs."],
["Set","S1",2,null,"Disparo por template de whatsapp. Priorizando status Tentativa de Contato.","Revisão da qualificação dos leads em aberto no CRM.","Revisão da qualificação dos leads em aberto no CRM.","Kickoff do mês com o time. Alinhamento de meta e reflexão sobre mês anterior."],
["Set","S1",3,null,"Reunião com Henrico - Gestão de tráfego","Priorizar volume de qualificação, não leads frios.","Priorizar leads \u201cquase fechando\u201d do mês anterior; menor pressão de fechamento imediato.",null],
["Set","S1",4,null,null,null,null,null],
["Set","S1",5,null,null,null,null,null],
["Set","S2",6,null,null,null,null,null],
["Set","S2",7,"FERIADO NACIONAL",null,null,null,null],
["Set","S2",8,null,null,"Ação de higienização da base de CRM",null,null],
["Set","S2",9,"Double Date",null,null,null,"Avaliar possibilidade de aplicação de condição especial para fechamento nesse dia."],
["Set","S2",10,null,"Reunião com Henrico - Gestão de tráfego",null,null,null],
["Set","S2",11,null,null,null,null,"Reunião Lideranças"],
["Set","S2",12,null,null,null,null,null],
["Set","S3",13,null,null,null,null,null],
["Set","S3",14,null,null,null,null,null],
["Set","S3",15,"Dia do Cliente",null,"Ação de higienização da base de CRM",null,null],
["Set","S3",16,null,null,null,null,"Reunião geral - Avaliação dos resultados do mês até aqui. O que deu certo e o que precisa ser ajustado. Premiação referente ao mês de agosto."],
["Set","S3",17,null,"Reunião com Henrico - Gestão de tráfego",null,null,null],
["Set","S3",18,null,null,null,null,"Reunião Lideranças"],
["Set","S3",19,null,null,null,null,null],
["Set","S4",20,null,null,null,null,null],
["Set","S4",21,null,null,null,null,null],
["Set","S4",22,null,null,"Ação de higienização da base de CRM",null,null],
["Set","S4",23,null,null,null,null,null],
["Set","S4",24,null,"Reunião com Henrico - Gestão de tráfego",null,null,null],
["Set","S4",25,null,null,null,null,"Reunião Lideranças"],
["Set","S4",26,null,null,null,null,null],
["Set","S5",27,null,null,null,null,null],
["Set","S5",28,null,null,null,null,null],
["Set","S5",29,null,null,"Ação de higienização da base de CRM",null,null],
["Set","S5",30,null,null,null,null,null],

["Out","S1",1,null,null,null,null,null],
["Out","S1",2,null,null,null,null,null],
["Out","S1",3,null,null,null,null,null],
["Out","S2",4,null,null,null,null,null],
["Out","S2",5,null,null,null,null,null],
["Out","S2",6,null,null,null,null,null],
["Out","S2",7,null,null,null,null,null],
["Out","S2",8,null,null,null,null,null],
["Out","S2",9,null,null,null,null,null],
["Out","S2",10,"Double Date",null,null,null,null],
["Out","S3",11,null,null,null,null,null],
["Out","S3",12,"FERIADO NACIONAL",null,null,null,null],
["Out","S3",13,null,null,null,null,null],
["Out","S3",14,null,null,null,null,null],
["Out","S3",15,null,null,null,null,null],
["Out","S3",16,null,null,null,null,null],
["Out","S3",17,null,null,null,null,null],
["Out","S4",18,null,null,null,null,null],
["Out","S4",19,null,null,null,null,null],
["Out","S4",20,null,null,null,null,null],
["Out","S4",21,null,null,null,null,null],
["Out","S4",22,null,null,null,null,null],
["Out","S4",23,null,null,null,null,null],
["Out","S4",24,null,null,null,null,null],
["Out","S5",25,null,null,null,null,null],
["Out","S5",26,null,null,null,null,null],
["Out","S5",27,null,null,null,null,null],
["Out","S5",28,null,null,null,null,null],
["Out","S5",29,null,null,null,null,null],
["Out","S5",30,null,null,null,null,null],
["Out","S5",31,"Hallowen",null,null,null,"Festa Hallowen"],
];

const MONTH_NAMES = {Set:"Setembro", Out:"Outubro", Nov:"Novembro", Dez:"Dezembro"};
const ALL_MONTHS = ["Set","Out","Nov","Dez"];

// Painel Executivo — começa com a frase motivacional do mês.
// Meses sem frase definida simplesmente não mostram o banner.
const FRASES_MOTIVACIONAIS = {
  Set: "VAMOS FAZER DE SETEMBRO, O MELHOR MÊS DAS NOSSAS VIDAS.",
};

// Agrupa RAW_DAYS em { mes: { weeks: [ {semana, dias:[...]} ] } }
function buildData(){
  const byMonth = {};
  RAW_DAYS.forEach(r => {
    const [mes, semana, dia, dataComercial, marketing, sdr, closer, gestao] = r;
    if(!byMonth[mes]) byMonth[mes] = {};
    if(!byMonth[mes][semana]) byMonth[mes][semana] = [];
    byMonth[mes][semana].push({dia, dataComercial, marketing, sdr, closer, gestao});
  });
  const data = {};
  Object.keys(byMonth).forEach(mes => {
    const weeksObj = byMonth[mes];
    const weekKeys = Object.keys(weeksObj).sort((a,b) => weeksObj[a][0].dia - weeksObj[b][0].dia);
    data[mes] = {
      weeks: weekKeys.map(sk => ({ semana: sk, dias: weeksObj[sk] }))
    };
  });
  return data;
}

const DATA = buildData();
const MONTHS = ALL_MONTHS.filter(m => DATA[m]);
let current = MONTHS[0];

function hasAnyRole(d){ return d.marketing || d.sdr || d.closer || d.gestao; }
function hasAnything(d){ return d.dataComercial || hasAnyRole(d); }

function buildTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  ALL_MONTHS.forEach(m => {
    const available = !!DATA[m];
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (m===current ? ' active' : '');
    btn.textContent = m + (available ? '' : ' (sem dados)');
    btn.disabled = !available;
    if(available) btn.onclick = () => { current = m; render(); };
    tabs.appendChild(btn);
  });
}

function computeStats(monthData){
  let diasComConteudo = 0, datasComerciais = 0, semanasSemRegistro = 0, totalDias = 0;
  monthData.weeks.forEach(w => {
    let weekHasContent = false;
    w.dias.forEach(d => {
      totalDias += 1;
      if(hasAnything(d)) { diasComConteudo += 1; weekHasContent = true; }
      if(d.dataComercial) datasComerciais += 1;
    });
    if(!weekHasContent) semanasSemRegistro += 1;
  });
  return { diasComConteudo, datasComerciais, semanasSemRegistro, totalSemanas: monthData.weeks.length, totalDias };
}

function renderExecPanel(){
  const s = computeStats(DATA[current]);
  const panel = document.getElementById('execPanel');
  const cards = [
    { num: `${s.diasComConteudo}/${s.totalDias}`, text: "Dias com registro" },
    { num: s.datasComerciais, text: "Datas comerciais marcadas" },
    { num: `${s.semanasSemRegistro}/${s.totalSemanas}`, text: "Semanas ainda sem registro" },
  ];

  const frase = FRASES_MOTIVACIONAIS[current];
  const bannerHtml = frase ? `
    <div class="exec-banner">
      <div class="exec-banner-label">Painel Executivo · ${MONTH_NAMES[current]}</div>
      <div class="exec-banner-phrase">${frase}</div>
    </div>
  ` : '';

  panel.innerHTML = bannerHtml + `
    <div class="exec-stats-row">
      ${cards.map(c => `
        <div class="exec-stat">
          <div class="exec-num">${c.num}</div>
          <div class="exec-label">${c.text}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function dayBlockHtml(d){
  const isFlagOnly = d.dataComercial && !hasAnyRole(d);
  if(isFlagOnly) return null; // vira chip, não bloco

  const roles = [
    {tag:"Marketing", text:d.marketing},
    {tag:"SDR", text:d.sdr},
    {tag:"Closer", text:d.closer},
    {tag:"Gestão", text:d.gestao},
  ].filter(r => r.text);

  const label = d.dataComercial
    ? `<span class="day-label flag">${d.dataComercial}</span>`
    : '';

  return `
    <div class="day-block">
      <div class="day-head">
        <span class="day-num">${String(d.dia).padStart(2,'0')}</span>
        ${label}
      </div>
      <div class="roles">
        ${roles.map(r => `<div class="role-row"><div class="role-tag">${r.tag}</div><div class="role-text">${r.text}</div></div>`).join('')}
      </div>
    </div>`;
}

function render(){
  buildTabs();
  renderExecPanel();
  document.getElementById('monthTitle').textContent = MONTH_NAMES[current] + ' 2026';
  document.getElementById('monthNote').textContent = 'Modelo dia a dia — validação estrutural';

  const weeksEl = document.getElementById('weeks');
  weeksEl.innerHTML = '';

  DATA[current].weeks.forEach(w => {
    const activeDays = w.dias.filter(hasAnything);
    const chips = activeDays.filter(d => d.dataComercial && !hasAnyRole(d));
    const blocks = activeDays.map(dayBlockHtml).filter(Boolean);

    const card = document.createElement('div');
    let cls = 'week-card';
    if(blocks.length) cls += ' has-content';
    else if(chips.length) cls += ' has-label';
    else cls += ' muted';
    card.className = cls;

    const first = w.dias[0].dia, last = w.dias[w.dias.length-1].dia;
    const chipHtml = chips.map(d => `<span class="wc-chip">${String(d.dia).padStart(2,'0')} · ${d.dataComercial}</span>`).join('');
    const bodyHtml = activeDays.length
      ? (chipHtml + blocks.join(''))
      : `<div class="wc-empty">Nenhum registro ainda para esses dias.</div>`;

    card.innerHTML = `
      <div class="wc-top">
        <span class="wc-week">${w.semana}</span>
        <span class="wc-range">dias ${String(first).padStart(2,'0')}–${String(last).padStart(2,'0')}</span>
      </div>
      ${bodyHtml}
    `;
    weeksEl.appendChild(card);
  });
}

render();
</script>
</body>
</html>
