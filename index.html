oz4QkiBlzVdNx/G45SFtI/aZ+D6b5E907tL6VUHwvbpV16RbejUb89xUxYh57tmASL4GIXHrugjWjm4q+eyUOVsnRhKyWFVcX9YHsAWC00v/CAGLQYQQ6IcAPCAiC9psyDJKt3EoX4d2flI/8lSA19/V0KoJnMZx1X1N2jx0pd+tp4q/tfS07FcifVEB4zEAT4jI9KidSjwmHc/YPECaY8x9ylFkjbkhIvMSnl0O7eNv5hf1kXEu5cvmoIOFqv/p5l4VnbuGtOloRRd62BPcmA5klCRuybUhh2H+jPCaGMao4DJ0pZvG5vXVkDtlRF//D/gVKg3LfEQnAAAAAElFTkSuQmCC\" alt=\"Home Office Digital\">\n    <div class=\"hodtop-ttl\"><h1>Performance Closers<\/h1><small id=\"hod-periodo\"><\/small><\/div>\n  <\/div>\n  <div class=\"hodtop-acts\"><div id=\"hod-fonte\" style=\"max-width:420px\"><\/div><\/div>\n<\/div><\/div>\n\n<main>\n\n  <div class=\"abas\" role=\"tablist\" style=\"margin-top:4px\">\n    <button type=\"button\" role=\"tab\" aria-selected=\"true\" data-aba=\"closer\" id=\"tab-closer\">Closers · por mês<\/button>\n    <button type=\"button\" role=\"tab\" aria-selected=\"false\" data-aba=\"mes\" id=\"tab-mes\">Time · mês a mês<\/button>\n  <\/div>\n\n  <div id=\"aba-closer\" role=\"tabpanel\" aria-labelledby=\"tab-closer\">\n    <div class=\"ind-top\" style=\"margin-top:22px\"><label for=\"closer-mes\" class=\"sub\">Mês<\/label><div class=\"seg\" role=\"group\" aria-label=\"Mês\" id=\"closer-mes\"><button type=\"button\" data-mes=\"Setembro\" aria-pressed=\"false\">Setembro<\/button><button type=\"button\" data-mes=\"Outubro\" aria-pressed=\"true\">Outubro (até 31/10)<\/button><\/div><\/div>\n    <p class=\"aviso-sec\" id=\"closer-aviso\"><\/p>\n    <section>\n      <div class=\"sec-head\"><h2>Dados diários<\/h2><span class=\"sub\">números por dia, conforme o filtro<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\" style=\"align-items:flex-end\">\n          <div class=\"seg\" role=\"group\" aria-label=\"Tipo de visão\" id=\"dia-modo\">\n            <button type=\"button\" data-modo=\"dia\" aria-pressed=\"true\">Closers lado a lado<\/button>\n            <button type=\"button\" data-modo=\"closer\" aria-pressed=\"false\">Um closer ao longo dos dias<\/button>\n          <\/div>\n          <div class=\"filtros-dia\" id=\"dia-filtros\"><\/div>\n        <\/div>\n        <div class=\"tabela-box\" style=\"border:0\"><table id=\"dia-tabela\" class=\"tab-dia\"><\/table><\/div>\n        <p class=\"nota\" id=\"dia-nota\"><\/p>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2 id=\"closer-titulo\">Visão geral do time<\/h2><span class=\"sub\" id=\"closer-sub\"><\/span><\/div>\n      <div class=\"kpis\" id=\"closer-kpis\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparativo dos closers<\/h2><span class=\"sub\">ordem alfabética · indicador = distância da média dos closers<\/span><\/div>\n      <div class=\"tabela-box\"><table id=\"closer-tabela\"><\/table><\/div>\n      <div class=\"legenda\">\n        <span><span class=\"chip acima\">+12%<\/span> acima da média<\/span>\n        <span><span class=\"chip perto\">−4%<\/span> próximo da média (até ±10%)<\/span>\n        <span><span class=\"chip abaixo\">−25%<\/span> abaixo da média<\/span>\n      <\/div>\n      <p class=\"nota\">Média dos closers = média simples dos resultados individuais do mês selecionado (ticket médio e % Follow só entre closers com vendas). Total do time = soma para reuniões, vendas, faturamento e Follow; conversão, ticket e % Follow do total são calculados sobre os somatórios.<\/p>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparação com a média dos closers<\/h2><span class=\"sub\">a linha tracejada marca a média<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\"><div class=\"seg\" role=\"group\" aria-label=\"Métrica\" id=\"closer-seg\"><\/div><div class=\"ref\" id=\"closer-ref\"><\/div><\/div>\n        <div class=\"barras\" id=\"closer-barras\"><\/div>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Detalhamento individual<\/h2><\/div>\n      <div class=\"ind-top\"><label for=\"closer-sel\" class=\"sub\">Closer<\/label><select id=\"closer-sel\"><\/select><\/div>\n      <div class=\"ind-grid\" id=\"closer-grid\"><\/div>\n      <p class=\"compl\" id=\"closer-compl\"><\/p>\n    <\/section>\n  <\/div>\n  <section>\n  <details class=\"atencao\">\n    <summary>Pontos de atenção nos dados (clique para expandir)<\/summary>\n    <ul>\n      <li><strong>O mês em andamento<\/strong> fica fora da média mensal e do total do período; volumes (reuniões, vendas, faturamento) não são comparados com meses fechados, só a taxa de conversão e o % de Follow.<\/li><li><strong>A partir de novembro/26<\/strong> reuniões, vendas e vendas de Follow vêm do que cada closer preenche na planilha dele neste site, e o faturamento vem da planilha CONTROLE COMISSÃO do Diego. Leads enviados para Follow não são preenchidos no site, por isso aparecem como —. Maio a outubro continuam com os números da planilha antiga.<\/li>\n      <li><strong>Túlio tem R$ 2.148,73 de faturamento em outubro<\/strong>, mas a aba dele foi desconsiderada. Fica fora da visão por closer (R$ 348.357,55) e dentro da visão mensal, que soma todos os closers da aba Vendas (R$ 354.096,68). Por isso o ticket médio de outubro é R$ 2.977,41 na visão por closer e R$ 3.026,47 na visão mensal.<\/li>\n      <li><strong>Closers em outubro:<\/strong> abas de Misael e Túlio desconsideradas, conforme orientação; 7 closers na média. Dias sem preenchimento contados como zero; quando o subtotal da semana diverge dos dias, valem os dias somados. Último dia lançado varia por closer: Alvaro até 22/10; Larissa, Luigi e Paulo até 30/10; Leandro, Eduardo e Rodrigo até 31/10. Fonte única desde 15/10: planilha Acompanhamento_HOD.xlsx (abas por closer e aba Vendas).<\/li>\n      <li><strong>Subtotais semanais desatualizados nas abas de outubro.<\/strong> Os subtotais das semanas a partir de 12/10 e a linha de total do mês não incluem todos os dias lançados. O dashboard soma os dias: 1090 agendadas, 526 realizadas, 117 vendas, 118 leads em Follow e 59 vendas de Follow. A aba Closers Geral Outubro bate com a soma das abas em todos os dias, exceto nas vendas de Follow de 19/10 (2 na aba geral, 1 nas abas individuais); valem as abas individuais.<\/li>\n      <li><strong>Setembro: 111 vendas no consolidado × 107 nas abas por closer.<\/strong> A diferença está em 24/09 (8 vendas na GERAL SET, 4 nas abas individuais), ainda não atribuída a nenhum closer. A visão por closer de setembro usa as abas individuais da versão anterior.<\/li>\n      <li><strong>Coluna H com 0,01 e 0,02 em setembro:<\/strong> leitura padrão “0,01 = 1 venda”, com base na correção feita nos lançamentos de Eduardo. Outubro não tem esse tipo de lançamento.<\/li>\n      <li><strong>Faturamento de setembro:<\/strong> a visão mensal soma todos os closers do dashboard financeiro (R$ 290.949,71, inclui Rafael com R$ 4.299,93); a visão por closer soma só os 9 closers com aba (R$ 286.649,78). Na versão atualizada, Larissa ganhou R$ 1.795,20 em setembro em relação à versão anterior. Maio a agosto seguem o critério da visão mensal.<\/li>\n      <li><strong>Alvaro<\/strong> tem lançamentos só até 04/09 e R$ 0 como closer em setembro. Ticket médio e % Follow não existem para quem não teve vendas, então essas médias usam só os closers com venda.<\/li>\n    <\/ul>\n    <div class=\"leitura\">\n      <span>Leitura da coluna H:<\/span>\n      <div class=\"seg\" role=\"group\" aria-label=\"Leitura das vendas de Follow\">\n        <button type=\"button\" data-l=\"B\" aria-pressed=\"true\">0,01 = 1 venda<\/button>\n        <button type=\"button\" data-l=\"A\" aria-pressed=\"false\">Como exibido na planilha (0,01 = 0)<\/button>\n      <\/div>\n      <span class=\"sub\" id=\"leituraInfo\"><\/span>\n    <\/div>\n  <\/details>\n  <\/section>\n  <div id=\"aba-mes\" role=\"tabpanel\" aria-labelledby=\"tab-mes\" hidden>\n    <section>\n      <div class=\"sec-head\"><h2 id=\"h-fech\"><\/h2><span class=\"sub\">meses fechados<\/span><\/div>\n      <div class=\"kpis\" id=\"mes-kpis\"><\/div>\n    <\/section>\n    <section id=\"sec-parcial\">\n      <div class=\"sec-head\"><h2 id=\"h-parc\"><\/h2><span class=\"sub\" id=\"s-parc\"><\/span><\/div>\n      <div class=\"kpis\" id=\"mes-kpis-out\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparativo mensal<\/h2><span class=\"sub\">indicador ao lado de cada valor = distância da média mensal do período<\/span><\/div>\n      <div class=\"tabela-box\"><table id=\"mes-tabela\"><\/table><\/div>\n      <div class=\"legenda\">\n        <span><span class=\"chip acima\">+12%<\/span> acima da média<\/span>\n        <span><span class=\"chip perto\">−4%<\/span> próximo da média (até ±10%)<\/span>\n        <span><span class=\"chip abaixo\">−25%<\/span> abaixo da média<\/span>\n      <\/div>\n      <p class=\"nota\">Média mensal = média simples dos meses fechados; o mês em andamento não entra na média nem no total. Total do período = soma para reuniões, vendas e faturamento; conversão e ticket do total são calculados sobre os somatórios. Vendas de Follow começaram em setembro.<\/p>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparação com a média mensal<\/h2><span class=\"sub\">a linha tracejada marca a média<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\"><div class=\"seg\" role=\"group\" aria-label=\"Métrica\" id=\"mes-seg\"><\/div><div class=\"ref\" id=\"mes-ref\"><\/div><\/div>\n        <div class=\"barras\" id=\"mes-barras\"><\/div>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Detalhamento mensal<\/h2><\/div>\n      <div class=\"ind-top\"><label for=\"mes-sel\" class=\"sub\">Mês<\/label><select id=\"mes-sel\"><\/select><\/div>\n      <div class=\"ind-grid\" id=\"mes-grid\"><\/div>\n      <p class=\"compl\" id=\"mes-compl\"><\/p>\n    <\/section>\n  <\/div>\n\n<\/main>\n<footer>Valores recalculados a partir das linhas diárias; dias sem preenchimento considerados como zero. Vendas = coluna VENDAS; Vendas de Follow = coluna VENDA FOLLOW; leads enviados para Follow (coluna FOLLOW) aparecem só como dado complementar.<\/footer>\n\n<script>\nconst MESES = __HOD_MESES__;\nconst CLOSERS = __HOD_CLOSERS__;\nconst AVISOS = {\n  Setembro: '<strong>Base: abas individuais de setembro (versão anterior da planilha).<\/strong> Somam 107 vendas, contra 111 no consolidado do mês — diferença de 4 vendas em 24/09, ainda não atribuída a nenhum closer. Faturamento: 9 closers com aba.',\n  Outubro: '<strong>Outubro: reuniões, vendas e faturamento de 01 a 31/10.<\/strong> 7 closers (Misael e Túlio desconsiderados); faturamento soma só os 7 closers com aba.'\n};\nconst HX = __HOD_EXTRA__;\nObject.assign(AVISOS, HX.avisos || {});\nconst FECH = MESES.filter(m=>!m.parcial), PARC = MESES.find(m=>m.parcial) || null;\nconst ab3 = n => n.slice(0,3).toLowerCase();\nconst RNG = FECH.length ? (FECH.length>1 ? ab3(FECH[0].nome)+'–'+ab3(FECH[FECH.length-1].nome) : ab3(FECH[0].nome)) : '';\nconst MES_KEYS = Object.keys(CLOSERS);\n\nconst st = { leitura:'B' };\n\nconst fmtInt = n => n.toLocaleString('pt-BR',{maximumFractionDigits:0});\nconst fmtDec = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});\nconst fmtR = n => 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst fmtPct = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';\n\nconst METRICAS = [\n  {k:'ag',     nome:'Reuniões agendadas', curto:'Agendadas',  fmt:fmtInt, mfmt:fmtDec},\n  {k:'real',   nome:'Reuniões realizadas',curto:'Realizadas', fmt:fmtInt, mfmt:fmtDec},\n  {k:'vendas', nome:'Vendas realizadas',  curto:'Vendas',     fmt:fmtInt, mfmt:fmtDec},\n  {k:'conv',   nome:'Taxa de conversão',  curto:'Conversão',  fmt:fmtPct, mfmt:fmtPct, taxa:true},\n  {k:'fat',    nome:'Faturamento',        curto:'Faturamento',fmt:fmtR,   mfmt:fmtR},\n  {k:'ticket', nome:'Ticket médio',       curto:'Ticket médio', fmt:fmtR, mfmt:fmtR, taxa:true},\n  {k:'vf',     nome:'Vendas de Follow',   curto:'Vendas Follow', fmt:fmtInt, mfmt:fmtDec},\n  {k:'pvf',    nome:'% de vendas de Follow', curto:'% Follow', fmt:fmtPct, mfmt:fmtPct, taxa:true},\n];\nconst GRAF = [['vendas','Vendas'],['conv','Conversão'],['fat','Faturamento'],['ticket','Ticket médio'],['real','Reuniões realizadas']];\n\nfunction enrich(r){\n  const vf = r.vfA===null ? null : (st.leitura==='A' ? r.vfA : r.vfB);\n  return {...r, vf,\n    conv: r.real ? r.vendas/r.real*100 : null,\n    ticket: (r.fat!==null && r.vendas && !r.semTicket) ? r.fat/r.vendas : null,\n    pvf: (vf!==null && r.vendas) ? vf/r.vendas*100 : null};\n}\nfunction calc(rows){\n  const cl = rows.map(enrich);\n  const base = cl.filter(c=>!c.parcial);\n  const media={}, n={};\n  METRICAS.forEach(m=>{\n    const vals = base.map(c=>c[m.k]).filter(v=>v!==null);\n    n[m.k]=vals.length;\n    media[m.k] = vals.length>1 ? vals.reduce((a,b)=>a+b,0)/vals.length : null;\n  });\n  return {cl, media, n, t: totais(base)};\n}\nfunction totais(rows){\n  const t={ag:0,real:0,vendas:0,fat:0,vf:0,follow:0,vendasF:0,semFat:false};\n  rows.forEach(c=>{['ag','real','vendas'].forEach(k=>t[k]+=c[k]); if(c.fat===null) t.semFat=true; else t.fat+=c.fat; if(c.semTicket) t.semTicket=true;\n    if(c.vf!==null){t.vf+=c.vf;t.follow+=c.follow;t.vendasF+=c.vendas;}});\n  t.conv=t.real? t.vendas/t.real*100 : null;\n  if(t.semFat){t.fat=null;t.ticket=null;} else t.ticket=(t.vendas && !t.semTicket)? t.fat/t.vendas : null;\n  t.pvf=t.vendasF? t.vf/t.vendasF*100 : null;\n  return t;\n}\n\nfunction chip(v, m){\n  if(v===null || m===null || !m) return '';\n  const d=v/m-1, r=Math.round(d*100);\n  const cls = Math.abs(d)<=0.10 ? 'perto' : (r>0?'acima':'abaixo');\n  return `<span class=\"chip ${cls}\">${(r>0?'+':r<0?'−':'')+Math.abs(r)}%<\/span>`;\n}\n// mês parcial: só taxas são comparáveis com a média de meses fechados\nconst chipRow = (c,m,med) => (c.parcial && !m.taxa) ? '' : chip(c[m.k],med);\nconst nd = '<span class=\"sub\">sem dado<\/span>';\nfunction kpiHTML(cards){ return cards.map(([r,v,d,dest])=>`<div class=\"kpi${dest?' dest':''}\"><div class=\"rot\">${r}<\/div><div class=\"val\">${v}<\/div>${d?`<div class=\"det\">${d}<\/div>`:''}<\/div>`).join(''); }\nconst opt = (v,f) => v===null ? '—' : f(v);\n\nconst VIEWS = {\n  mes: {\n    rows: ()=>MESES, rotulo:'Mês', mediaLbl:'MÉDIA MENSAL', totalLbl:'TOTAL '+RNG.toUpperCase(), mediaRef:'Média mensal ('+RNG+')',\n    sel: (FECH[FECH.length-1]||MESES[0]).nome, metrica:'vendas',\n    label: c => c.parcial ? `${c.nome} <span class=\"sub\">(em andamento)<\/span>` : c.nome,\n    kpis(D){ const t=D.t, nf=MESES.filter(m=>!m.parcial).length; return [\n      ['Reuniões agendadas', fmtInt(t.ag), `média de ${fmtDec(t.ag/nf)} por mês`],\n      ['Reuniões realizadas', fmtInt(t.real), `${(t.ag?fmtPct(t.real/t.ag*100):'—')} das agendadas`],\n      ['Vendas realizadas', fmtInt(t.vendas), `média de ${fmtDec(t.vendas/nf)} por mês`],\n      ['Taxa de conversão', fmtPct(t.conv), 'vendas ÷ reuniões realizadas', true],\n      ['Faturamento', fmtR(t.fat), `média de ${fmtR(t.fat/nf)} por mês`, true],\n      ['Ticket médio', fmtR(t.ticket), 'faturamento ÷ vendas'],\n      ['Vendas de Follow', fmtInt(t.vf), 'acompanhamento desde setembro'+(t.follow?` · ${fmtInt(t.follow)} leads enviados para Follow`:'')],\n      ['% de vendas de Follow', fmtPct(t.pvf), `sobre ${fmtInt(t.vendasF)} vendas dos meses com Follow`],\n    ];},\n    nMedia(){ return ''; },\n    semMedia: 'sem média de comparação ainda',\n  },\n  closer: {\n    rows: ()=>CLOSERS[VIEWS.closer.mes], rotulo:'Closer', mediaLbl:'MÉDIA DOS CLOSERS', totalLbl:'TOTAL DO TIME', mediaRef:'Média dos closers',\n    mes:MES_KEYS[MES_KEYS.length-1], sel: null, metrica:'vendas',\n    label: c => c.nome,\n    kpis(D){ const t=D.t, nc=D.cl.length; return [\n      ['Reuniões agendadas', fmtInt(t.ag), ''],\n      ['Reuniões realizadas', fmtInt(t.real), `${(t.ag?fmtPct(t.real/t.ag*100):'—')} das agendadas`],\n      ['Vendas realizadas', fmtInt(t.vendas), (HX.live||[]).includes(VIEWS.closer.mes)?'preenchido pelos closers no site':'soma das abas individuais'],\n      ['Taxa de conversão', opt(t.conv,fmtPct), 'vendas ÷ reuniões realizadas', true],\n      ['Faturamento', t.fat===null?'Sem dado':fmtR(t.fat), t.fat===null?'aguardando dashboard financeiro de outubro':(t.semTicket?`${nc} closers com aba · só até 06/10`:`${nc} closers com aba`), true],\n      ['Ticket médio', t.ticket===null?'—':fmtR(t.ticket), t.semTicket?'não calculado: faturamento até 06/10, vendas até 14/10':'faturamento ÷ vendas'],\n      ['Vendas de Follow', fmtInt(t.vf), t.follow?`${fmtInt(t.follow)} leads enviados para Follow`:'preenchido na planilha de cada closer'],\n      ['% de vendas de Follow', opt(t.pvf,fmtPct), 'vendas de Follow ÷ vendas'],\n    ];},\n    nMedia(m,D){ return D.media[m.k]!==null && D.n[m.k]<D.cl.length ? ` <span class=\"sub\">(${D.n[m.k]})<\/span>` : ''; },\n    semMedia: 'sem dado',\n  }\n};\n\nfunction renderView(id){\n  const V=VIEWS[id], D=calc(V.rows()), $=s=>document.getElementById(`${id}-${s}`);\n  if(V.sel===null || !D.cl.find(c=>c.nome===V.sel)) V.sel = D.cl[0].nome;\n  const fv=(m,v)=> v===null ? '<span class=\"sub\">—<\/span>' : m.fmt(v);\n  $('kpis').innerHTML = kpiHTML(V.kpis(D));\n  if(id==='mes'){ const sp=document.getElementById('sec-parcial'); if(sp) sp.hidden=!PARC; }\n  if(id==='mes' && PARC){\n    const o = enrich(PARC);\n    $('kpis-out').innerHTML = kpiHTML([\n      ['Reuniões agendadas', fmtInt(o.ag), ''],\n      ['Reuniões realizadas', fmtInt(o.real), o.ag?`${fmtPct(o.real/o.ag*100)} das agendadas`:''],\n      ['Vendas realizadas', fmtInt(o.vendas), ''],\n      ['Taxa de conversão', opt(o.conv,fmtPct), D.media.conv!==null?`média ${RNG}: ${fmtPct(D.media.conv)} ${chip(o.conv,D.media.conv)}`:'', true],\n      ['Faturamento', opt(o.fat,fmtR), 'planilha do Diego, todos os closers', true],\n      ['Ticket médio', opt(o.ticket,fmtR), D.media.ticket!==null?`média ${RNG}: ${fmtR(D.media.ticket)} ${chip(o.ticket,D.media.ticket)}`:''],\n      ['Vendas de Follow', o.vf===null?'—':fmtInt(o.vf), o.follow?`${fmtInt(o.follow)} leads enviados para Follow`:''],\n      ['% de vendas de Follow', opt(o.pvf,fmtPct), D.media.pvf!==null?`média ${RNG}: ${fmtPct(D.media.pvf)} ${chip(o.pvf,D.media.pvf)}`:''],\n    ]);\n  }\n  const t=D.t;\n  const tot={ag:fmtInt(t.ag),real:fmtInt(t.real),vendas:fmtInt(t.vendas),conv:opt(t.conv,fmtPct),fat:opt(t.fat,fmtR),ticket:opt(t.ticket,fmtR),\n    vf: id==='closer'?fmtInt(t.vf):'—', pvf: id==='closer'?opt(t.pvf,fmtPct):'—'};\n  $('tabela').innerHTML = `<thead><tr><th>${V.rotulo}<\/th>${METRICAS.map(m=>`<th>${m.curto}<\/th>`).join('')}<\/tr><\/thead><tbody>`+\n    D.cl.map(c=>`<tr${c.parcial?' style=\"font-style:italic\"':''}><td><span class=\"n\">${V.label(c)}<\/span><\/td>${METRICAS.map(m=>`<td>${fv(m,c[m.k])}${chipRow(c,m,D.media[m.k])}<\/td>`).join('')}<\/tr>`).join('')+\n    `<tr class=\"media\"><td>${V.mediaLbl}<\/td>${METRICAS.map(m=>`<td>${D.media[m.k]===null?'—':m.mfmt(D.media[m.k])}${V.nMedia(m,D)}<\/td>`).join('')}<\/tr>`+\n    `<tr class=\"total\"><td>${V.totalLbl}<\/td>${METRICAS.map(m=>`<td>${tot[m.k]}<\/td>`).join('')}<\/tr><\/tbody>`;\n  // Barras\n  $('seg').innerHTML = GRAF.map(([k,l])=>`<button type=\"button\" data-m=\"${k}\" aria-pressed=\"${V.metrica===k}\">${l}<\/button>`).join('');\n  const m=METRICAS.find(x=>x.k===V.metrica), med=D.media[m.k];\n  if(med===null){\n    $('ref').innerHTML=''; $('barras').innerHTML = `<p class=\"sub\">${m.nome}: sem dado neste período.<\/p>`;\n  } else {\n    const max=Math.max(...D.cl.map(c=>c[m.k]??0), med)*1.06||1, pm=med/max*100;\n    $('ref').innerHTML = `${V.mediaRef}: <strong>${m.mfmt(med)}<\/strong>${V.nMedia(m,D)}`;\n    $('barras').innerHTML = `<div class=\"eixo-m\"><div><\/div><div class=\"t\"><span style=\"left:${pm}%\">média ${m.mfmt(med)}<\/span><\/div><div><\/div><\/div>`+\n      D.cl.map(c=>{const v=c[m.k]; const op=c.parcial?'opacity:.45;':'';\n        return `<div class=\"linha-b\"><div>${V.label(c)}<\/div>\n        <div class=\"trilho\" role=\"img\" aria-label=\"${c.nome}: ${v===null?'sem dado':m.fmt(v)}\"><div class=\"b\" style=\"${op}width:${(v??0)/max*100}%\"><\/div><div class=\"m\" style=\"left:${pm}%\"><\/div><\/div>\n        <div class=\"v\"><span>${v===null?'sem dado':m.fmt(v)}<\/span>${chipRow(c,m,med)}<\/div><\/div>`;}).join('');\n  }\n  // Detalhe\n  const sel=$('sel');\n  sel.innerHTML = D.cl.map(r=>`<option${r.nome===V.sel?' selected':''}>${r.nome}<\/option>`).join('');\n  const c=D.cl.find(x=>x.nome===V.sel);\n  $('grid').innerHTML = METRICAS.map(m=>{\n    const v=c[m.k], med=D.media[m.k], comp = v!==null && med!==null && !(c.parcial && !m.taxa);\n    const mx=Math.max(v??0,med??0)||1;\n    const txt = comp ? 'média '+m.mfmt(med) : (v===null ? (m.k==='fat'||m.k==='ticket' ? (m.k==='ticket' && c.semTicket ? 'não calculado: faturamento até 06/10' : m.k==='ticket' && c.fat ? 'faturamento sem venda lançada' : 'sem vendas no período') : m.k==='conv' ? 'sem reuniões realizadas' : m.k==='pvf' ? 'sem vendas no período' : V.semMedia) : (c.parcial && !m.taxa ? 'mês em andamento' : 'sem média de comparação ainda'));\n    return `<div class=\"tile\"><div class=\"rot\">${m.nome}<\/div><div class=\"val\">${v===null?'—':m.fmt(v)}<\/div>\n      <div class=\"cmp\">${comp?chip(v,med):''}<span>${txt}<\/span><\/div>\n      ${comp?`<div class=\"mini\" aria-hidden=\"true\"><div class=\"c\" style=\"width:${v/mx*100}%\"><\/div><div class=\"md\" style=\"width:${med/mx*100}%\"><\/div><\/div>`:''}<\/div>`;\n  }).join('');\n  const quem = id==='mes'?'mês':'closer';\n  $('compl').innerHTML = (c.follow===null ? '' : `Dado complementar — leads enviados para Follow: <strong>${fmtInt(c.follow)}<\/strong>. `) +\n    `Barras: verde = ${quem}, cinza = média.` + (c.vfA!==null && c.vfA!==c.vfB ? ` Vendas de Follow: ${c.vfB} na leitura “0,01 = 1 venda” e ${c.vfA} na leitura como exibida.` : '');\n  if(id==='closer'){\n    document.querySelectorAll('#closer-mes button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mes===V.mes));\n    document.getElementById('closer-aviso').innerHTML = AVISOS[V.mes]||'';\n    document.getElementById('closer-titulo').textContent = `Visão geral do time em ${V.mes.toLowerCase()}`;\n    document.getElementById('closer-sub').textContent = `${D.cl.length} closers` + ((HX.subs||{})[V.mes] || (V.mes==='Outubro'?' · dados até 31/10':V.mes==='Setembro'?', incluindo Rodrigo':''));\n  }\n}\n\nfunction render(){\n  document.querySelectorAll('.leitura .seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===st.leitura));\n  const s=MESES.find(r=>r.nome==='Setembro');\n  if(s) document.getElementById('leituraInfo').textContent = `Setembro: ${st.leitura==='B'?s.vfB:s.vfA} vendas de Follow (a outra leitura dá ${st.leitura==='B'?s.vfA:s.vfB})`;\n  renderView('mes'); renderView('closer'); renderDiario();\n}\n\ndocument.querySelector('.leitura .seg').addEventListener('click', e=>{const b=e.target.closest('button'); if(!b) return; st.leitura=b.dataset.l; render();});\n['mes','closer'].forEach(id=>{\n  document.getElementById(`${id}-seg`).addEventListener('click', e=>{const b=e.target.closest('button'); if(!b) return; VIEWS[id].metrica=b.dataset.m; renderView(id);});\n  document.getElementById(`${id}-sel`).addEventListener('change', e=>{VIEWS[id].sel=e.target.value; renderView(id);});\n});\ndocument.getElementById('closer-mes').addEventListener('click', e=>{const b=e.target.closest('button'); if(!b) return; VIEWS.closer.mes=b.dataset.mes; VIEWS.closer.sel=null; renderView('closer'); renderDiario();});\n\n/* ===== Dados diários ===== */\nconst DIARIO = __HOD_DIARIO__;\nconst DS = { sort:{k:null,dir:-1}, modo:'dia', recorte:'dia', dia:null, semana:null, pde:null, pate:null, closer:null, de:null, ate:null, agrup:'dia', mes:null };\nconst DOW = ['dom','seg','ter','qua','qui','sex','sáb'];\nconst ddmm = (M,d) => String(d).padStart(2,'0')+'/'+String(M.mes).padStart(2,'0');\nconst dow = (M,d) => DOW[new Date(M.ano, M.mes-1, d).getDay()];\nfunction linhaDia(v){ // v = [ag, real, vendas, leadsFollow, vfA, vfB, fat]\n  const vf = st.leitura==='A' ? v[4] : v[5];\n  return {ag:v[0], real:v[1], vendas:v[2], conv: v[1] ? v[2]/v[1]*100 : null, fat:v[6],\n          ticket: v[2] ? v[6]/v[2] : null, vf, pvf: v[2] ? vf/v[2]*100 : null, follow: DS.semFollow ? null : v[3]};\n}\nfunction somaDia(vs){ const s=[0,0,0,0,0,0,0]; vs.forEach(v=>v.forEach((x,i)=>s[i]+=x)); s[6]=Math.round(s[6]*100)/100; return s; }\nconst COLD = [['ag','Agendadas',fmtInt],['real','Realizadas',fmtInt],['vendas','Vendas',fmtInt],['conv','Conversão',fmtPct],['fat','Faturamento',fmtR],['ticket','Ticket médio',fmtR],['vf','Vendas Follow',fmtInt],['pvf','% Follow',fmtPct],['follow','Leads p/ Follow',fmtInt]];\nconst cel = (f,v) => v===null ? '<span class=\"sub\">—<\/span>' : f(v);\nfunction semanasDoMes(M){\n  // Semanas de segunda a domingo, recortadas aos dias com dados do mês\n  const ws=[]; let cur=null;\n  for(let d=1; d<=M.ult; d++){\n    const wd=new Date(M.ano,M.mes-1,d).getDay();\n    if(!cur || wd===1){ cur={ini:d,fim:d}; ws.push(cur); } else cur.fim=d;\n  }\n  ws.forEach(w=>{\n    const iniWd=new Date(M.ano,M.mes-1,w.ini).getDay(), fimWd=new Date(M.ano,M.mes-1,w.fim).getDay();\n    w.parcial = !(iniWd===1 && fimWd===0);\n    const andamento = w.fim===M.ult && fimWd!==0 ? ' (em andamento)' : '';\n    w.label = (w.ini===w.fim ? `${ddmm(M,w.ini)} · ${dow(M,w.ini)}` : `${ddmm(M,w.ini)} a ${ddmm(M,w.fim)}` + (w.parcial ? ` · ${dow(M,w.ini)} a ${dow(M,w.fim)}` : ' · seg a dom')) + andamento;\n  });\n  return ws;\n}\nfunction renderDiario(){\n  const mes = VIEWS.closer.mes, M = DIARIO[mes]; if(!M){ document.getElementById('dia-tabela').innerHTML=''; document.getElementById('dia-nota').textContent='Sem dados diários neste mês.'; return; } DS.semFollow=!!M.semFollow;\n  const nomes = Object.keys(M.d).sort((a,b)=>a.localeCompare(b,'pt-BR'));\n  const ws = semanasDoMes(M);\n  if(DS.mes!==mes){ DS.mes=mes; DS.dia=M.ult; DS.semana=ws.length-1; DS.pde=1; DS.pate=M.ult; DS.closer=nomes[0]; DS.de=1; DS.ate=M.ult; }\n  document.querySelectorAll('#dia-modo button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.modo===DS.modo));\n  const dias = Array.from({length:M.ult},(_,i)=>i+1);\n  const optDia = sel => dias.map(d=>`<option value=\"${d}\"${d===sel?' selected':''}>${ddmm(M,d)} · ${dow(M,d)}<\/option>`).join('');\n  const optSem = ws.map((w,i)=>`<option value=\"${i}\"${i===DS.semana?' selected':''}>${w.label}<\/option>`).join('');\n  const F = document.getElementById('dia-filtros');\n  if(DS.modo==='dia'){\n    const rec = `<label>Recorte<select id=\"f-recorte\"><option value=\"dia\"${DS.recorte==='dia'?' selected':''}>Um dia<\/option><option value=\"semana\"${DS.recorte==='semana'?' selected':''}>Semana (seg a dom)<\/option><option value=\"periodo\"${DS.recorte==='periodo'?' selected':''}>Período personalizado<\/option><\/select><\/label>`;\n    let extra='';\n    if(DS.recorte==='dia') extra = `<label>Dia<select id=\"f-dia\">${optDia(DS.dia)}<\/select><\/label>`;\n    if(DS.recorte==='semana') extra = `<label>Semana<select id=\"f-semana\">${optSem}<\/select><\/label>`;\n    if(DS.recorte==='periodo') extra = `<label>De<select id=\"f-pde\">${optDia(DS.pde)}<\/select><\/label><label>Até<select id=\"f-pate\">${optDia(DS.pate)}<\/select><\/label>`;\n    F.innerHTML = rec + extra;\n  } else {\n    F.innerHTML = `<label>Closer<select id=\"f-closer\"><option value=\"__time\"${DS.closer==='__time'?' selected':''}>Time (todos os closers)<\/option>${nomes.map(n=>`<option${n===DS.closer?' selected':''}>${n}<\/option>`).join('')}<\/select><\/label>\n      <label>Agrupar por<select id=\"f-agrup\"><option value=\"dia\"${DS.agrup==='dia'?' selected':''}>Dia<\/option><option value=\"semana\"${DS.agrup==='semana'?' selected':''}>Semana (seg a dom)<\/option><\/select><\/label>\n      <label>De<select id=\"f-de\">${optDia(DS.de)}<\/select><\/label><label>Até<select id=\"f-ate\">${optDia(DS.ate)}<\/select><\/label>`;\n  }\n  const seta = k => DS.sort.k===k ? (DS.sort.dir>0?' ↑':' ↓') : '';\n  const ariaS = k => DS.sort.k===k ? ` aria-sort=\"${DS.sort.dir>0?'ascending':'descending'}\"` : '';\n  const head = (c1) => `<thead><tr><th${ariaS('__lbl')}><button type=\"button\" class=\"ord\" data-k=\"__lbl\">${c1}${seta('__lbl')}<\/button><\/th>${COLD.map(c=>`<th${ariaS(c[0])}><button type=\"button\" class=\"ord\" data-k=\"${c[0]}\">${c[1]}${seta(c[0])}<\/button><\/th>`).join('')}<\/tr><\/thead>`;\n  const ordena = itens => { // itens: [rótulo, valores, ordem natural]\n    const k=DS.sort.k, dir=DS.sort.dir; if(!k) return itens;\n    return itens.slice().sort((a,b)=>{\n      if(k==='__lbl') return dir*(a[2]-b[2]);\n      const va=linhaDia(a[1])[k], vb=linhaDia(b[1])[k];\n      if(va===null && vb===null) return a[2]-b[2]; if(va===null) return 1; if(vb===null) return -1;\n      return va===vb ? a[2]-b[2] : dir*(va-vb);\n    });\n  };\n  const row = (lbl, v, cls) => { const L=linhaDia(v), z=!v.some(x=>x); return `<tr class=\"${cls||''}${z&&!cls?' zero':''}\"><td>${lbl}<\/td>${COLD.map(c=>`<td>${cel(c[2],L[c[0]])}<\/td>`).join('')}<\/tr>`; };\n  const vazio = [0,0,0,0,0,0,0];\n  const somaCloser = (n, a, b) => somaDia(dias.filter(d=>d>=a && d<=b).map(d=>M.d[n][String(d)]||vazio));\n  let html='';\n  if(DS.modo==='dia'){\n    let a,b,tit;\n    if(DS.recorte==='dia'){ a=b=DS.dia; tit=ddmm(M,a); }\n    else if(DS.recorte==='semana'){ const w=ws[Math.min(DS.semana,ws.length-1)]; a=w.ini; b=w.fim; tit=`${ddmm(M,a)} a ${ddmm(M,b)}`; }\n    else { a=Math.min(DS.pde,DS.pate); b=Math.max(DS.pde,DS.pate); tit = a===b ? ddmm(M,a) : `${ddmm(M,a)} a ${ddmm(M,b)}`; }\n    const vs = nomes.map(n=>somaCloser(n,a,b));\n    html = head('Closer') + '<tbody>' + ordena(nomes.map((n,i)=>[n,vs[i],i])).map(([l,v])=>row(l,v)).join('') + row(`TOTAL ${tit}`, somaDia(vs), 'total') + '<\/tbody>';\n  } else {\n    const de=Math.min(DS.de,DS.ate), ate=Math.max(DS.de,DS.ate);\n    const sel = (a,b) => DS.closer==='__time' ? somaDia(nomes.map(n=>somaCloser(n,a,b))) : somaCloser(DS.closer,a,b);\n    let linhas;\n    if(DS.agrup==='semana'){\n      linhas = ws.filter(w=>w.fim>=de && w.ini<=ate).map(w=>{ const a=Math.max(w.ini,de), b=Math.min(w.fim,ate);\n        return [a===b ? `${ddmm(M,a)}<span class=\"dow\">${dow(M,a)}<\/span>` : `${ddmm(M,a)} a ${ddmm(M,b)}<span class=\"dow\">${dow(M,a)} a ${dow(M,b)}<\/span>`, sel(a,b)]; });\n    } else {\n      linhas = dias.filter(d=>d>=de && d<=ate).map(d=>[`${ddmm(M,d)}<span class=\"dow\">${dow(M,d)}<\/span>`, sel(d,d)]);\n    }\n    html = head(DS.agrup==='semana'?'Semana':'Dia') + '<tbody>' + ordena(linhas.map((x,i)=>[x[0],x[1],i])).map(([l,v])=>row(l,v)).join('') + row(`TOTAL ${ddmm(M,de)} a ${ddmm(M,ate)}`, somaDia(linhas.map(x=>x[1])), 'total') + '<\/tbody>';\n  }\n  document.getElementById('dia-tabela').innerHTML = html;\n  document.getElementById('dia-nota').textContent = 'Clique no título de uma coluna para ordenar (clique de novo para inverter). Semanas de segunda a domingo; a primeira e a última semana do mês podem ser parciais. Conversão, ticket médio e % Follow de cada linha são calculados sobre os números da própria linha. Faturamento vem do Dashboard comercial pela data registrada lá, que nem sempre coincide com o dia em que a venda foi lançada na aba do closer — por isso pode haver faturamento em dia sem venda, e vice-versa.';\n}\ndocument.getElementById('dia-tabela').addEventListener('click', e=>{\n  const b=e.target.closest('button.ord'); if(!b) return; const k=b.dataset.k;\n  if(DS.sort.k===k) DS.sort.dir = -DS.sort.dir; else DS.sort = {k, dir: k==='__lbl' ? 1 : -1};\n  renderDiario();\n});\ndocument.getElementById('dia-modo').addEventListener('click', e=>{const b=e.target.closest('button'); if(!b) return; DS.modo=b.dataset.modo; renderDiario();});\ndocument.getElementById('dia-filtros').addEventListener('change', e=>{\n  const t=e.target, v=t.value;\n  if(t.id==='f-recorte') DS.recorte=v;\n  if(t.id==='f-dia') DS.dia=+v;\n  if(t.id==='f-semana') DS.semana=+v;\n  if(t.id==='f-pde') DS.pde=+v;\n  if(t.id==='f-pate') DS.pate=+v;\n  if(t.id==='f-closer') DS.closer=v;\n  if(t.id==='f-agrup') DS.agrup=v;\n  if(t.id==='f-de') DS.de=+v;\n  if(t.id==='f-ate') DS.ate=+v;\n  renderDiario();\n});\ndocument.querySelector('.abas').addEventListener('click', e=>{\n  const b=e.target.closest('button'); if(!b) return;\n  document.querySelectorAll('.abas button').forEach(x=>x.setAttribute('aria-selected', x===b));\n  document.getElementById('aba-mes').hidden = b.dataset.aba!=='mes';\n  document.getElementById('aba-closer').hidden = b.dataset.aba!=='closer';\n});\n(function(){\n  document.getElementById('closer-mes').innerHTML = MES_KEYS.map(k=>`<button type=\"button\" data-mes=\"${k}\" aria-pressed=\"false\">${k}${PARC&&PARC.nome===k?' (em andamento)':''}<\/button>`).join('');\n  const set=(id,t)=>{const e=document.getElementById(id); if(e) e.innerHTML=t;};\n  set('hod-periodo', HX.periodo||''); set('hod-fonte', HX.fonte||'');\n  set('h-fech', FECH.length ? FECH[0].nome+(FECH.length>1?' a '+FECH[FECH.length-1].nome.toLowerCase():'') : 'Meses fechados');\n  if(PARC){ set('h-parc', PARC.nome+' em andamento'); set('s-parc', HX.parcSub||''); }\n})();\nrender();\n<\/script>\n<\/body>\n<\/html>\n", "sdr": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>HOD | Performance SDR<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<style>\n:root{\n  /* Paleta — troque aqui pelas cores institucionais do HOD, se houver manual de marca */\n  --bg:#F5F7F4; --surface:#FFFFFF; --ink:#18241A; --ink-2:#465247; --ink-3:#848E85;\n  --line:#E2E7E1; --line-2:#EEF2ED;\n  --brand:#253A20; --brand-2:#4E6F44; --brand-soft:#E8EFE5;\n  --bot:#3F6EA8; --bot-soft:#E7EEF7;\n  --ok:#2F9356; --ok-soft:#E3F3E8;\n  --bad:#D9472F; --bad-soft:#FCEAE6;\n  --warn:#B7800A; --warn-soft:#FBF2DD;\n  --future:#CFD6CD;\n  --f-head:\"Sora\", \"Segoe UI\", system-ui, sans-serif;\n  --f-body:\"IBM Plex Sans\", \"Segoe UI\", system-ui, sans-serif;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n*,*::before,*::after{box-sizing:inherit}\nhtml{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}\nbody{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}\nbutton,select,input{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--brand);outline-offset:2px}\n.wrap{max-width:1360px;margin:0 auto;padding:0 28px}\n\n/* Header */\n.top{background:var(--brand);color:#fff}\n.top .wrap{display:flex;align-items:center;gap:20px;padding-top:18px;padding-bottom:14px;flex-wrap:wrap}\n.mark{display:flex;align-items:center;gap:12px}\n.mark{gap:22px}\n.mark img{height:48px;width:auto;display:block}\n.mark .ttl{border-left:1px solid rgba(255,255,255,.25);padding-left:22px}\n.mark h1{margin:0;font:600 20px/1.2 var(--f-head);letter-spacing:-.01em}\n.mark small{display:block;color:rgba(255,255,255,.68);font-size:13px;margin-top:2px}\n.top .btn{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}\n.top .btn:hover{border-color:#fff;background:rgba(255,255,255,.08)}\n.top .actions{margin-left:auto;display:flex;gap:10px;align-items:center}\n.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}\n.btn:hover{border-color:var(--ink-3)}\n.btn.ghost{border-color:transparent;color:var(--ink-2)}\n\n.filters{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}\nbody::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:rgba(255,255,255,.94)}\n.filters .wrap{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}\n.fg{display:flex;flex-direction:column;gap:4px}\n.fg>label,.fg>span{font-size:12px;color:var(--ink-3);font-weight:500}\n.fg select,.fg input[type=date]{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);min-height:38px}\n.fg select{padding-right:28px}\n.range{display:flex;gap:6px;align-items:center}\n.range span{color:var(--ink-3)}\n.seg{display:inline-flex;background:var(--line-2);border-radius:999px;padding:3px}\n.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink-2);min-height:32px}\n.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(24,36,26,.12)}\n.seg button.is-bot[aria-pressed=true]{color:var(--bot)}\n.active-filter{display:none;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:6px 8px 6px 14px;font-size:13px;font-weight:600}\n.active-filter.on{display:inline-flex}\n.active-filter.bot{background:var(--bot-soft);color:var(--bot)}\n.active-filter button{border:0;background:rgba(255,255,255,.7);border-radius:999px;width:22px;height:22px;cursor:pointer;line-height:1}\n.filters .meta{margin-left:auto;font-size:12px;color:var(--ink-3);text-align:right}\n\n/* Sections */\nmain{padding:8px 0 60px}\n.sec{margin-top:36px}\n.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}\n.sec-h h2{margin:0;font:600 19px/1.3 var(--f-head);letter-spacing:-.01em}\n.sec-h p{margin:0;color:var(--ink-3);font-size:14px}\n.sec-h .right{margin-left:auto}\n.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}\n.scope{font-size:12px;color:var(--ink-3);margin-top:10px}\n\n/* KPI */\n.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}\n.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}\n.kpi .lb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500}\n.kpi .v{font:600 32px/1.1 var(--f-head);letter-spacing:-.02em}\n.kpi.rate .v{color:var(--ink)}\n.kpi .sub{font-size:12px;color:var(--ink-3)}\n.kpi .bar{height:5px;border-radius:5px;background:var(--line-2);overflow:hidden}\n.kpi .bar i{display:block;height:100%;border-radius:5px}\n.info{width:16px;height:16px;border-radius:50%;border:1px solid var(--ink-3);color:var(--ink-3);display:inline-grid;place-items:center;font:600 10px/1 var(--f-body);cursor:help;background:transparent;padding:0;flex:none}\n.delta{font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}\n.delta.good{color:var(--ok)} .delta.bad{color:var(--bad)} .delta.flat,.delta.na{color:var(--ink-3);font-weight:500}\n.delta em{font-style:normal;font-weight:400;color:var(--ink-3)}\n\n/* Funnel */\n.funnel{display:grid;grid-template-columns:180px 1fr;row-gap:18px;column-gap:20px;align-items:center}\n.funnel .fl{font-size:14px;color:var(--ink-2);font-weight:500}\n.funnel .fl b{display:block;font:600 24px/1.15 var(--f-head);color:var(--ink);letter-spacing:-.01em}\n.track{position:relative;height:44px;border-radius:10px;display:flex;overflow:hidden;background:transparent}\n.track .s{height:100%;display:flex;align-items:center; n value=\"mes\">Este mês<\/option>\n      <option value=\"mes_passado\">Mês passado<\/option>\n      <option value=\"d7\">Últimos 7 dias<\/option>\n      <option value=\"d30\">Últimos 30 dias<\/option>\n      <option value=\"custom\">Personalizado<\/option>\n    <\/select>\n  <\/div>\n  <div class=\"fg\">\n    <span>Intervalo<\/span>\n    <div class=\"range\"><input type=\"date\" id=\"fStart\" aria-label=\"Data inicial\"><span>até<\/span><input type=\"date\" id=\"fEnd\" aria-label=\"Data final\"><\/div>\n  <\/div>\n  <div class=\"fg\">\n    <label for=\"fSdr\">SDR<\/label>\n    <select id=\"fSdr\"><\/select>\n  <\/div>\n  <div class=\"fg\">\n    <span>Origem<\/span>\n    <div class=\"seg\" role=\"group\" aria-label=\"Origem\" id=\"fOrigem\">\n      <button data-v=\"ALL\" aria-pressed=\"true\">Todos<\/button>\n      <button data-v=\"HUM\" aria-pressed=\"false\">SDRs humanos<\/button>\n      <button data-v=\"TB\" aria-pressed=\"false\" class=\"is-bot\">TYPEBOT<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"active-filter\" id=\"chip\"><span id=\"chipTxt\"><\/span><button id=\"chipX\" aria-label=\"Limpar seleção de SDR\">×<\/button><\/div>\n  <div class=\"meta\" id=\"metaTxt\"><\/div>\n<\/div><\/div>\n\n<main class=\"wrap\">\n\n  <section class=\"sec\" id=\"s4\">\n    <header class=\"sec-h\"><h2>Performance individual<\/h2><p>Quem está performando? Clique em um SDR para filtrar o painel.<\/p><\/header>\n    <div class=\"panel\"><div class=\"tbl-wrap\"><table id=\"rank\"><thead><\/thead><tbody><\/tbody><\/table><\/div>\n    <div class=\"scope\" id=\"rankScope\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s1\">\n    <header class=\"sec-h\"><h2>Visão geral<\/h2><p id=\"ovSub\">Como estamos no período?<\/p><\/header>\n    <div class=\"kpis\" id=\"kpis\"><\/div>\n    <div class=\"goal-note\" id=\"updNote\" style=\"margin-top:12px\"><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s-week\">\n    <header class=\"sec-h\"><h2>Performance da semana<\/h2><p id=\"wkSub\"><\/p><\/header>\n    <div class=\"panel\">\n      <div class=\"tbl-wrap\"><table class=\"wk-table\" id=\"wkTable\"><\/table><\/div>\n      <div class=\"goal-note\" id=\"goal\"><\/div>\n      <div class=\"scope\" id=\"wkScope\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s2\">\n    <header class=\"sec-h\"><h2>Funil de reuniões<\/h2><p>Do agendamento à agenda do Closer e ao resultado<\/p><\/header>\n    <div class=\"panel\"><div class=\"funnel\" id=\"funnel\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s3\">\n    <header class=\"sec-h\"><h2>Evolução<\/h2><p>Como os números se movem ao longo do tempo?<\/p>\n      <div class=\"right seg\" role=\"group\" aria-label=\"Visualização\" id=\"fEvoView\">\n        <button data-v=\"tabela\" aria-pressed=\"true\">Quadro<\/button>\n        <button data-v=\"grafico\" aria-pressed=\"false\">Gráfico<\/button>\n      <\/div>\n      <div class=\"seg\" role=\"group\" aria-label=\"Agrupamento\" id=\"fGran\">\n        <button data-v=\"dia\" aria-pressed=\"true\">Dia<\/button>\n        <button data-v=\"semana\" aria-pressed=\"false\">Semana<\/button>\n        <button data-v=\"mes\" aria-pressed=\"false\">Mês<\/button>\n      <\/div>\n    <\/header>\n    <div class=\"panel\"><div class=\"tbl-wrap\" id=\"evoTableWrap\"><table class=\"evo-table\" id=\"evoTable\"><\/table><\/div>\n    <div class=\"chart-box\" id=\"evoChartWrap\" hidden><canvas id=\"cEvo\" aria-label=\"Evolução de agendadas, acontecidas e no-show\"><\/canvas><\/div>\n    <div class=\"scope\" id=\"evoScope\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s5\">\n    <header class=\"sec-h\"><h2>TYPEBOT × SDRs<\/h2><p>A automação gera volume, e esse volume vira reunião?<\/p><\/header>\n    <div class=\"panel\">\n      <div class=\"tbl-wrap\"><table class=\"cmp-table\" id=\"cmp\"><\/table><\/div>\n      <div class=\"scope\">Considera apenas o filtro de período, para manter a comparação completa.<\/div>\n    <\/div>\n  <\/section>\n\n  <details class=\"sec ins\" id=\"s7\">\n    <summary><span class=\"ins-t\">Insights<\/span> <span class=\"ins-c\" id=\"insCount\"><\/span><span class=\"ins-hint\">Sinais calculados a partir dos dados filtrados<\/span><\/summary>\n    <ul class=\"insights\" id=\"insights\"><\/ul>\n  <\/details>\n\n  <details class=\"notes\" id=\"notes\">\n    <summary>Regras de cálculo e qualidade da base<\/summary>\n    <div class=\"cols\">\n      <div>\n        <h3>Como os números são calculados<\/h3>\n        <ul>\n          <li><b>Data<\/b>: dia da reunião. <b>Agendadas<\/b>: soma da coluna Agendamentos, ou seja, reuniões marcadas para aquele dia.<\/li>\n          <li><b>Reuniões passadas<\/b>: agendamentos que entraram efetivamente na agenda dos Closers, sem overbooking (coluna Reuniões Passadas). Vale sempre o valor informado na planilha, mesmo quando Acontecidas + No-show da linha é maior (essa soma pode se referir ao total de agendamentos).<\/li>\n          <li><b>Não passadas ao Closer<\/b>: Agendadas − Reuniões passadas, até o último dia com resultado lançado na base. <b>Aguardando registro<\/b>: o mesmo saldo nos dias seguintes, que ainda não tiveram resultado lançado. Nenhum dos dois entra nas taxas.<\/li>\n          <li><b>Repasse<\/b> = Reuniões passadas ÷ agendadas com data já ocorrida.<\/li>\n          <li><b>Taxa de agendamento<\/b> = Agendamentos ÷ Atividades (coluna Atividades).<\/li>\n          <li><b>No-show rate<\/b> = No-show ÷ Agendamentos.<\/li>\n          <li>Essas regras (taxa de agendamento, no-show rate sobre agendamentos e as duas conversões em venda) valem <b>de novembro/26 em diante<\/b>. Meses fechados seguem a regra anterior: no-show ÷ reuniões passadas, sem taxas de atividades e vendas. Num período que mistura os dois, cada mês entra com o seu critério.<\/li>\n          <li><b>Show rate<\/b> (comparecimento) = Reuniões acontecidas ÷ Reuniões passadas (as que já chegaram na data marcada).<\/li>\n          <li><b>Conversão reunião em venda<\/b> = Vendas ÷ Reuniões acontecidas. <b>Conversão atividade em venda<\/b> = Vendas ÷ Atividades. Vendas = coluna Conversão em Vendas.<\/li>\n          <li><b>Sem status<\/b>: reuniões na agenda do Closer ainda sem marcação de acontecida ou no-show. Ficam no denominador das taxas, como manda a fórmula.<\/li>\n          <li>Células vazias contam como zero. Não há linhas de total na planilha; linhas em branco entre os dias são ignoradas.<\/li>\n          <li>TYPEBOT é identificado pelo valor TYPEBOT na coluna SDR. Todos os outros nomes contam como SDRs humanos.<\/li>\n          <li>Semanas de segunda a domingo, inclusive na comparação semanal e na meta. Os cards do topo comparam com um intervalo anterior de mesmo tamanho, cortado até hoje.<\/li>\n        <\/ul>\n      <\/div>\n      <div>\n        <h3>Conferência com a planilha (base completa)<\/h3>\n        <div class=\"recon\" id=\"recon\"><\/div>\n        <h3 style=\"margin-top:16px\">Pontos de atenção na base<\/h3>\n        <ul id=\"dq\"><\/ul>\n      <\/div>\n    <\/div>\n  <\/details>\n<\/main>\n\n<div id=\"tip\" hidden role=\"tooltip\"><\/div>\n\n<script id=\"calc\">\n/* ===== Dados: exportados de Acompanhamento_HOD.xlsx (aba SDRs Typebot) =====\n   Data = dia da reunião. Agendamentos = reuniões marcadas para aquele dia.\n   Reuniões Passadas = agendamentos que entraram de fato na agenda dos Closers, sem overbooking.\n   Formato de cada linha: [data, SDR, Agendamentos, Reuniões Passadas, Acontecidas, No-show, Não Passadas, Daily check] */\nvar DATA_RAW = [[\"2026-10-01\", \"MICHELLY\", 0, 0, 0, 0, 0, \"SPRINTER\"], [\"2026-10-01\", \"BEATRIZ\", 5, 5, 4, 1, 0, \"FEZ DEPOIS\"], [\"2026-10-01\", \"LEANDRO B.\", 13, 13, 11, 2, 0, \"OK!\"], [\"2026-10-01\", \"VITOR\", 9, 7, 4, 3, 2, \"OK!\"], [\"2026-10-01\", \"Lucas Carioca\", 5, 5, 3, 2, 0, \"OK!\"], [\"2026-10-01\", \"IASMIN\", 8, 7, 5, 2, 1, \"OK!\"], [\"2026-10-01\", \"GUSTAVO\", 0, 0, 0, 0, 0, \"SPRINTER\"], [\"2026-10-01\", \"ÁLVARO\", 2, 1 Agendamentos ÷ Atividades\n  t.nsp=pct(t.ns,nv.ag+ant.pa);      // 2. No-show rate: ÷ Agendamentos (nov+) · ÷ Reuniões passadas (até out)\n  t.comp=pct(t.ac,t.pa);             // 3. Show rate = Acontecidas ÷ Reuniões passadas\n  t.cvr=nv.n?pct(t.ve,nv.ac):null;   // 4. Conversão reunião em venda = Vendas ÷ Acontecidas\n  t.cva=nv.n?pct(t.ve,t.at):null;    // 5. Conversão atividade em venda = Vendas ÷ Atividades\n  t.mix=nv.n>0&&ant.n>0;\n  t.rep=pct(t.pa,t.pa+t.npass); return t;\n}\n/* datas (strings ISO, aritmética em UTC) */\nfunction toD(s){return new Date(s+\"T00:00:00Z\");}\nfunction iso(d){return d.toISOString().slice(0,10);}\nfunction addDays(s,n){var d=toD(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);}\nfunction dow(s){return (toD(s).getUTCDay()+6)%7;}\nfunction monday(s){return addDays(s,-dow(s));}\nfunction diffDays(a,b){return Math.round((toD(b)-toD(a))/864e5);}\nfunction firstOfMonth(s){return s.slice(0,8)+\"01\";}\nfunction addMonths(s,n){var d=toD(firstOfMonth(s));d.setUTCMonth(d.getUTCMonth()+n);return iso(d);}\nfunction endOfMonth(s){return addDays(addMonths(s,1),-1);}\nfunction br(s){return s.slice(8,10)+\"/\"+s.slice(5,7);}\n\nfunction presetRange(p,R){\n  var m=monday(R);\n  switch(p){\n    case \"hoje\": return [R,R];\n    case \"ontem\": return [addDays(R,-1),addDays(R,-1)];\n    case \"semana\": return [m,addDays(m,6)];\n    case \"semana_passada\": return [addDays(m,-7),addDays(m,-1)];\n    case \"mes\": return [firstOfMonth(R),endOfMonth(R)];\n    case \"mes_passado\": return [addMonths(R,-1),addDays(firstOfMonth(R),-1)];\n    case \"d7\": return [addDays(R,-6),R];\n    case \"d30\": return [addDays(R,-29),R];\n  }\n  return null;\n}\n/* Período anterior: mesmo tamanho, cortado até hoje. Retorna {cur:[s,e], prev:[s,e]} ou null */\nfunction compareRanges(s,e,preset,R,dataMin){\n  if(s>R) return null;\n  var ce = e<R? e : R, len = diffDays(s,ce)+1, ps;\n  if(preset===\"mes\"||preset===\"mes_passado\"){ ps=addMonths(s,-1); }\n  else { ps=addD 70.32, \"30\": 27555.75, \"31\": 10190.4}}]};\nconst fR = n => 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst fN = n => n.toLocaleString('pt-BR');\nconst fP = n => n===null ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';\nconst fX = n => n===null ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'x';\nconst $ = id => document.getElementById(id);\nconst DOW=['dom','seg','ter','qua','qui','sex','sáb'];\nconst st = { mes: MID.meses.length-1, de:null, ate:null, camp:'__cons' };\n\nconst M = () => MID.meses[st.mes];\nconst dd = (m,d) => String(d).padStart(2,'0')+'/'+String(m.mes).padStart(2,'0');\nconst dow = (m,d) => DOW[new Date(m.ano,m.mes-1,d).getDay()];\nconst diasDisp = m => Object.keys(m.dias).map(Number).sort((a,b)=>a-b);\n\nfunction filtros(){\n  const m=M(), ds=diasDisp(m);\n  if(st.de===null){ st.de=ds[0]; st.ate=ds[ds.length-1]; }\n  const opt = sel => ds.map(d=>`<option value=\"${d}\"${d===sel?' selected':''}>${dd(m,d)}<\/option>`).join('');\n  $('fMes').innerHTML = MID.meses.map((x,i)=>`<option value=\"${i}\"${i===st.mes?' selected':''}>${x.label}<\/option>`).join('');\n  $('fDe').innerHTML = opt(st.de); $('fAte').innerHTML = opt(st.ate);\n  $('fCamp').innerHTML = `<option value=\"__cons\"${st.camp==='__cons'?' selected':''}>Consolidado (todas somadas)<\/option>`+\n    `<option value=\"__todas\"${st.camp==='__todas'?' selected':''}>Todas as campanhas, lado a lado<\/option>`+\n    m.camps.map((c,i)=>`<option value=\"${i}\"${String(i)===st.camp?' selected':''}>${c}<\/option>`).join('');\n}\n\nfunction render(){\n  filtros();\n  const m=M(), de=Math.min(st.de,st.ate), ate=Math.max(st.de,st.ate);\n  const ds = diasDisp(m).filter(d=>d>=de && d<=ate);\n  const ultVenda = Math.max(0,...Object.keys(m.vendas).map(Number));\n  $('periodo').textContent = `${m.label} · ${dd(m,de)} a ${dd(m,ate)}`;\n  $('subCons').textContent = `${ds.length} dias`;\n\n  const tot = ds.reduce((s,d)=>s+m.dias[d].tot,0);\n  const cont = ds.reduce((s,d)=>s+m.dias[d].contatos,0);\n  const pipe = ds.reduce((s,d)=>s+m.dias[d].pipeline,0);\n  const dsR = ds.filter(d=>d<=ultVenda);\n  const invR = dsR.reduce((s,d)=>s+m.dias[d].tot,0), venR = dsR.reduce((s,d)=>s+(m.vendas[d]||0),0);\n  const porCamp = m.camps.map((c,i)=>ds.reduce((s,d)=>s+m.dias[d].c[i],0));\n  const ativas = porCamp.filter(v=>v>0).length;\n\n  $('kInv').textContent = fR(tot);\n  $('kInvDet').textContent = `média de ${fR(tot/(ds.length||1))} por dia`;\n  $('kRoas').textContent = fX(invR ? venR/invR : null);\n  $('kRoasDet').textContent = dsR.length ? `vendas ÷ investimento · ${fR(venR)} em vendas de ${dd(m,dsR[0])} a ${dd(m,dsR[dsR.length-1])}` : 'sem vendas lançadas no período';\n  $('kCont').textContent = m.semGhl ? '—' : fN(cont);\n  $('kContDet').textContent = m.semGhl ? 'GoHighLevel ainda não conectado neste mês' : `média de ${fN(Math.round(cont/(ds.length||1)))} por dia`;\n  $('kPipe').textContent = m.semGhl ? '—' : fN(pipe);\n  $('kPipeDet').textContent = m.semGhl ? 'GoHighLevel ainda não conectado neste mês' : `média de ${fN(Math.round(pipe/(ds.length||1)))} por dia`;\n  $('kConv').textContent = m.semGhl ? '—' : fP(cont ? pipe/cont*100 : null);\n  $('kCamp').textContent = `${ativas} de ${m.camps.length}`;\n  $('kCampDet').textContent = 'com investimento no período';\n\n  // Por campanha\n  $('tCamp').innerHTML = `<thead><tr><th>Campanha<\/th><th>Investimento<\/th><th>% do total<\/th><th>Média por dia<\/th><th>Dias com investimento<\/th><\/tr><\/thead><tbody>`+\n    m.camps.map((c,i)=>{ const v=porCamp[i], n=ds.filter(d=>m.dias[d].c[i]>0).length;\n      return `<tr class=\"${v?'':'zero'}\"><td>${c}<\/td><td>${fR(v)}<\/td><td>${fP(tot?v/tot*100:null)}<\/td><td>${fR(v/(ds.length||1))}<\/td><td>${n} de ${ds.length}<\/td><\/tr>`; }).join('')+\n    `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(tot)}<\/td><td>${fP(tot?100:null)}<\/td><td>${fR(tot/(ds.length||1))}<\/td><td><\/td><\/tr><\/tbody>`;\n\n  // Diário\n  const lbl = d => `${dd(m,d)}<span class=\"dow\">${dow(m,d)}<\/span>`;\n  let h='';\n  if(st.camp==='__cons'){\n    h = `<thead><tr><th>Dia<\/th><th>Investimento<\/th><th>Vendas<\/th><th>ROAS<\/th><th>Contatos<\/th><th>Pipeline<\/th><th>Conversão<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>{ const x=m.dias[d], temV=d<=ultVenda, v=m.vendas[d]||0;\n        return `<tr><td>${lbl(d)}<\/td><td>${fR(x.tot)}<\/td><td>${temV?fR(v):'<span class=\"sub\">—<\/span>'}<\/td><td>${temV&&x.tot?fX(v/x.tot):'<span class=\"sub\">—<\/span>'}<\/td><td>${fN(x.contatos)}<\/td><td>${fN(x.pipeline)}<\/td><td>${fP(x.contatos?x.pipeline/x.contatos*100:null)}<\/td><\/tr>`; }).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(tot)}<\/td><td>${fR(venR)}<\/td><td>${fX(invR?venR/invR:null)}<\/td><td>${fN(cont)}<\/td><td>${fN(pipe)}<\/td><td>${fP(cont?pipe/cont*100:null)}<\/td><\/tr><\/tbody>`;\n  } else if(st.camp==='__todas'){\n    h = `<thead><tr><th>Dia<\/th>${m.camps.map(c=>`<th>${c}<\/th>`).join('')}<th>Total<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>`<tr><td>${lbl(d)}<\/td>${m.dias[d].c.map(v=>`<td>${v?fR(v):'<span class=\"sub\">R$ 0,00<\/span>'}<\/td>`).join('')}<td><strong>${fR(m.dias[d].tot)}<\/strong><\/td><\/tr>`).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td>${porCamp.map(v=>`<td>${fR(v)}<\/td>`).join('')}<td>${fR(tot)}<\/td><\/tr><\/tbody>`;\n  } else {\n    const i=+st.camp, v=porCamp[i];\n    h = `<thead><tr><th>Dia<\/th><th>Investimento · ${m.camps[i]}<\/th><th>% do investimento do dia<\/th><th>Investimento total do dia<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>{ const x=m.dias[d], c=x.c[i];\n        return `<tr class=\"${c?'':'zero'}\"><td>${lbl(d)}<\/td><td>${fR(c)}<\/td><td>${fP(x.tot?c/x.tot*100:null)}<\/td><td>${fR(x.tot)}<\/td><\/tr>`; }).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(v)}<\/td><td>${fP(tot?v/tot*100:null)}<\/td><td>${fR(tot)}<\/td><\/tr><\/tbody>`;\n  }\n  $('tDia').innerHTML = h;\n  $('nota').textContent = `Investimento em mídia = soma das ${m.camps.length} campanhas. Vendas = total vendido do dia no Dashboard comercial, lançado até ${dd(m,ultVenda)}; o ROAS considera só os dias com vendas lançadas. Contatos e pipeline vêm do GHL.`;\n}\n$('fMes').addEventListener('change', e=>{ st.mes=+e.target.value; st.de=null; render(); });\n$('fDe').addEventListener('change', e=>{ st.de=+e.target.value; render(); });\n$('fAte').addEventListener('change', e=>{ st.ate=+e.target.value; render(); });\n$('fCamp').addEventListener('change', e=>{ st.camp=e.target.value; render(); });\nrender();\n<\/script>\n<script>\n/* ═══ HOD · mídia ao vivo (windsor.ai) a partir de novembro/26 ═══\n   Até outubro: dados salvos acima (MID). De novembro em diante: investimento por dia e campanha\n   do windsor.ai (API ?fonte=midia) e vendas do dia da planilha de vendas (para o ROAS).\n   Contatos e pipeline (GoHighLevel) ainda não estão conectados nesses meses. */\n(function(){\n  var URL_VENDAS = 'https://script.google.com/macros/s/AKfycbw-CAcp-Xba_09kHjGeu2a67L-TfMxQq6AAjQ2LWGpSzbVXkD6ebCB_nCVQGtT6IGf0jw/exec';\n  var MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];\n  // Grupos de campanha (mesmos nomes da aba até outubro). A primeira regra que bater vale.\n  var GRUPOS = [\n    ['Aulão Black',       function(o,c){ return /AULAO|AULÃO|BLACK/.test(c); }],\n    ['Plano 90D',         function(o,c){ return /PLANO 90D/.test(c); }],\n    ['Typebot',           function(o,c){ return /TYPEBOT/.test(c); }],\n    ['Direct/Whatsapp',   function(o,c){ return /(^|[^A-Z])DIRECT|WHATS/.test(c); }],\n    ['Live',              function(o,c){ return /\\[LIVE\\]/.test(c); }],\n    ['Rmkt YouTube',      function(o,c){ return o === 'google' && /RMKT/.test(c); }],\n    ['Inscritos YouTube', function(o,c){ return o === 'google' && /INSCRITOS/.test(c); }],\n    ['Redirect (Meta → YouTube)', function(o,c){ return o === 'facebook' && /YOUTUBE/.test(c); }],\n    ['Rmkt Insta',        function(o,c){ return /RMKT/.test(c); }],\n    ['Seguidores Insta',  function(o,c){ return /PERFIL|SEGUIDORES/.test(c); }]\n  ];\n  function grupo(origem, camp){\n    var o = String(origem||'').toLowerCase(), c = String(camp||'').toUpperCase();\n    for (var i = 0; i < GRUPOS.length; i++) if (GRUPOS[i][1](o, c)) return GRUPOS[i][0];\n    return 'Outras';\n  }\n  var app = document.getElementById('app-midia'), codigo = app.textContent;\n  var ini = codigo.indexOf('const MID = '), fim = codigo.indexOf('\\n', ini);\n  var base = JSON.parse(codigo.slice(ini + 12, fim).trim().replace(/;$/, ''));\n  var url = '';\n  try { url = window.__HOD_API_TESTE || (window.parent && window.parent.HOD_API_URL) || ''; } catch(e) {}\n\n  function iniciar(MID, st){\n    window.__MID_HOD = MID;\n    var s = document.createElement('script');\n    s.textContent = codigo.slice(0, ini) + 'const MID = window.__MID_HOD;' + codigo.slice(fim);\n    document.body.appendChild(s);\n    var el = document.createElement('div');\n    el.textContent = st.ok ? '● Ao vivo · ' + st.hora : '● ' + st.texto;\n    el.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15);' +\n      (st.ok ? 'background:#e8f7ee;color:#167a3e' : 'background:#fff4e5;color:#9a5b00');\n    document.body.appendChild(el);\n  }\n  function getJSON(u){\n    var c = new AbortController(), t = setTimeout(function(){ c.abort(); }, 20000);\n    return fetch(u, { signal: c.signal, cache: 'no-store' }).then(function(r){ clearTimeout(t); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })\n      .then(function(j){ if (j && j.erro) throw new Error(j.erro); return j; });\n  }\n  function montar(vivo, vendas){\n    var MID = JSON.parse(JSON.stringify(base));\n    var hoje = new Date(), hojeIso = hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0') + '-' + String(hoje.getDate()).padStart(2,'0');\n    var porMes = {};\n    vivo.linhas.forEach(function(l){\n      var mk = l[0].slice(0,7), d = +l[0].slice(8,10), g = grupo(l[1], l[3]);\n      var M = porMes[mk] = porMes[mk] || { inv:{}, grupos:{} };\n      M.grupos[g] = 1;\n      var D = M.inv[d] = M.inv[d] || {};\n      D[g] = Math.round(((D[g]||0) + l[4]) * 100) / 100;\n    });\n    var vendDia = {};\n    ((vendas && vendas.meses) || []).forEach(function(m){\n      var p = m.label.split('/'), mk = '20' + p[1] + '-' + String(MESES_NOME.indexOf(p[0]) + 1).padStart(2,'0');\n      m.transacoes.forEach(function(t){ var o = vendDia[mk] = vendDia[mk] || {}; o[t.d] = Math.round(((o[t.d]||0) + t.v) * 100) / 100; });\n    });\n    var desde = vivo.desde || '2026-11-01';\n    for (var mk = desde.slice(0,7); mk <= hojeIso.slice(0,7); ) {\n      var y = +mk.slice(0,4), mm = +mk.slice(5,7), M = porMes[mk] || { inv:{}, grupos:{} };\n      var camps = GRUPOS.map(function(g){ return g[0]; }).filter(function(g){ return M.grupos[g]; });\n      if (M.grupos['Outras']) camps.push('Outras');\n      var ultimo = mk === hojeIso.slice(0,7) ? +hojeIso.slice(8,10) : new Date(y, mm, 0).getDate();\n      var dias = {};\n      for (var d = 1; d <= ultimo; d++) {\n        var D = M.inv[d] || {}, c = camps.map(function(g){ return D[g] || 0; });\n        dias[d] = { tot: Math.round(c.reduce(function(a,b){ return a+b; }, 0) * 100) / 100, c: c, contatos: 0, pipeline: 0 };\n      }\n      if (camps.length) {\n        var lbl = MESES_NOME[mm-1] + ' de ' + y;\n        MID.meses = MID.meses.filter(function(x){ return x.label !== lbl; });\n        MID.meses.push({ label: lbl, ano: y, mes: mm, camps: camps, dias: dias, vendas: vendDia[mk] || {}, semGhl: true });\n      }\n      mm++; if (mm > 12) { mm = 1; y++; } mk = y + '-' + String(mm).padStart(2,'0');\n    }\n    return MID;\n  }\n  if (!/^(https|blob|data):/.test(url)) { iniciar(base, { ok:false, texto:'Versão salva (até outubro)' }); return; }\n  Promise.all([\n    getJSON(url + (url.indexOf('?') < 0 ? '?' : '&') + 'fonte=midia'),\n    getJSON(URL_VENDAS).catch(function(){ return null; })\n  ]).then(function(r){\n    var h = new Date(r[0].geradoEm || Date.now()).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });\n    iniciar(montar(r[0], r[1]), r[1] ? { ok:true, hora:h } : { ok:false, texto:'Mídia ao vivo · vendas indisponíveis (sem ROAS)' });\n  }).catch(function(err){\n    console.warn('[HOD mídia] usando versão salva:', err);\n    iniciar(base, { ok:false, texto:'Versão salva (até outubro)' });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"};

        const parcial = m === fim, ddmm = String(ult).padStart(2,'0') + '/' + String(mm).padStart(2,'0');
        meses.push({ nome, ag:T.ag, real:T.real, vendas:T.vendas, follow:null, vfA:T.vf, vfB:T.vf, fat:fatMes[m]||0, parcial });
        closers[nome] = lista; diario[nome] = { ano:y, mes:mm, ult:Math.max(ult,1), semFollow:true, d:dd }; live.push(nome);
        avisos[nome] = '<strong>' + (parcial ? 'Mês em andamento' : 'Mês fechado') + ': reuniões e vendas que cada closer preenche no site de remuneração, até ' + ddmm + '.</strong> Faturamento da planilha CONTROLE COMISSÃO.';
        subs[nome] = ' · dados até ' + ddmm; if (parcial) parcSub = '01 a ' + ddmm;
      }
      let ny = y, nm = mm + 1; if (nm > 12) { nm = 1; ny++; }
      m = ny + '-' + String(nm).padStart(2,'0');
    }
  }
  const ultM = meses[meses.length-1], pa = meses.find(x => x.parcial);
  return { meses, closers, diario, extra: { avisos, subs, live, parcSub,
    periodo: meses[0].nome + ' de 2026 a ' + ultM.nome.toLowerCase() + ' de ' + fim.slice(0,4) + (pa ? ' · ' + pa.nome.toLowerCase() + ' em andamento' : ''),
    fonte: 'Maio a outubro: planilha antiga dos closers. A partir de novembro: o que os closers preenchem no site de remuneração. Faturamento: planilha CONTROLE COMISSÃO.' } };
}
function srcClosers(c, status){
  const selo = '<div style="position:fixed;right:14px;bottom:14px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15);' +
    (status.ok ? 'background:#e8f7ee;color:#167a3e">\u25CF Ao vivo \u00B7 ' + status.hora : 'background:#fff4e5;color:#9a5b00">\u25CF ' + status.texto) + '</div>';
  return DASH.closers
    .replace('__HOD_MESES__', () => pnJSON(c.meses)).replace('__HOD_CLOSERS__', () => pnJSON(c.closers))
    .replace('__HOD_DIARIO__', () => pnJSON(c.diario)).replace('__HOD_EXTRA__', () => pnJSON(c.extra))
    .replace('</body>', () => selo + '</body>');
}
let closersMontado = false;
function montarClosers(f){
  if (closersMontado) return; closersMontado = true;
  const api = window.HOD_API_URL;
  Promise.all([
    buscarJSON(api + (api.indexOf('?')<0?'?':'&') + 'fonte=closers', 20000),
    buscarJSON(URL_VENDAS_API, 20000).catch(() => null),
  ]).then(([vivo, vendas]) => {
    const h = new Date(vivo.geradoEm || Date.now()).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    f.srcdoc = srcClosers(dadosClosers(vivo, vendas), vendas ? { ok:true, hora:h } : { ok:false, texto:'Ao vivo sem faturamento (planilha de vendas indisponível)' });
  }).catch(err => {
    console.warn('[HOD closers] usando só a base salva:', err);
    f.srcdoc = srcClosers(dadosClosers(null, null), { ok:false, texto:'Versão salva (maio a outubro)' });
  });
}

const LINKS = {
  vendas: 'https://homeofficedigital.github.io/vendas-times/',
};
// Selo da aba Leads: horário da última atualização do arquivo de dados do dashboard de leads
// (o dashboard é reconstruído ao vivo a partir do Supabase e republicado no GitHub)
const LEADS_DADOS = 'https://lfgrb-hod.github.io/leads-supabase/data/leads.js';
function seloLeads(mostrarSelo){
  let el = document.getElementById('seloLeads');
  if(!el){
    el = document.createElement('button'); el.type='button'; el.id='seloLeads'; el.title='Clique para recarregar os leads';
    el.style.cssText='position:fixed;right:14px;bottom:14px;z-index:50;border:0;cursor:pointer;font:600 12px/1 system-ui,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15);background:#e8f7ee;color:#167a3e';
    el.onclick = () => { const f=document.getElementById('f-leads'); f.dataset.carregado=0; mostrar('leads'); };
    document.body.appendChild(el);
  }
  el.hidden = !mostrarSelo;
  if(!mostrarSelo) return;
  el.textContent = '\u25CF Leads ao vivo';
  fetch(LEADS_DADOS + '?h=' + Date.now(), { method:'HEAD', cache:'no-store' })
    .then(r => { const lm = r.headers.get('last-modified'); if(lm){ const d=new Date(lm);
      el.textContent = '\u25CF Leads atualizados ' + d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); } })
    .catch(() => {});
}
function mostrar(v){
  if(!NOMES[v]) v='big';
  for(const k in NOMES){
    const f=document.getElementById('f-'+k);
    if(!f) continue;
    if(k===v){
      if(LINKS[k]){
        // Abre a versão publicada; ao voltar para a aba depois de 10 min, recarrega para trazer os dados novos
        const carregado = +(f.dataset.carregado||0);
        if(!f.getAttribute('src') || Date.now()-carregado > 10*60e3){
          f.src = LINKS[k] + (LINKS[k].indexOf('?')<0?'?':'&') + 't=' + Date.now();
          f.dataset.carregado = Date.now();
        }
      }
      else if(k==='closers') montarClosers(f);
      else if(k==='leads'){
        // Leads: versão com a identidade do HOD; os dados vêm ao vivo do repositório de leads.
        // Ao voltar para a aba depois de 10 min (ou clicando no selo), recarrega.
        if(!f.srcdoc || Date.now()-(+(f.dataset.carregado||0)) > 10*60e3){ f.srcdoc = DASH.leads + '<!-- ' + Date.now() + ' -->'; f.dataset.carregado = Date.now(); }
      }
      else if(!f.srcdoc && DASH[k]) f.srcdoc = DASH[k];
    }
    f.hidden = k!==v;
  }
  document.querySelectorAll('nav a').forEach(a=>{ if(a.dataset.v===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.getElementById('atual').textContent = NOMES[v];
  seloLeads(v==='leads');
  document.title = 'HOD · ' + NOMES[v];
  document.body.classList.remove('aberto');
}
window.addEventListener('hashchange', ()=>mostrar(location.hash.slice(1)));
mostrar(location.hash.slice(1) || 'big');
try{ if(localStorage.getItem('hod-menu-min')==='1') document.body.classList.add('min'); }catch(e){}
document.getElementById('recolher').addEventListener('click', ()=>{
  const min=document.body.classList.toggle('min');
  document.getElementById('recolher').setAttribute('aria-label', min?'Expandir menu':'Recolher menu');
  try{ localStorage.setItem('hod-menu-min', min?'1':'0'); }catch(e){}
});
document.getElementById('menu').addEventListener('click', ()=>document.body.classList.add('aberto'));
document.getElementById('veu').addEventListener('click', ()=>document.body.classList.remove('aberto'));
</script>
