<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOD · Painel Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1B2A17; --side-2:#22341D; --side-linha:rgba(245,246,242,.10);
  --side-txt:#C7D6C1; --side-txt-forte:#F5F6F2; --ativo:#4F7345;
  --fundo:#F5F6F2; --w:256px; --w-min:68px;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fundo:#141A12; } }
:root[data-theme="dark"]{ --fundo:#141A12; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fundo);display:flex;overflow:hidden}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

aside{width:var(--w);flex:0 0 var(--w);height:100%;background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;border-right:1px solid var(--side-linha);transition:width .2s ease,flex-basis .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.marca{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:20px 16px 18px 20px;border-bottom:1px solid var(--side-linha)}
.marca .logo{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--side-txt-forte);white-space:nowrap}
.marca .logo small{display:block;font-family:'Public Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-txt);opacity:.8;margin-top:2px}
.btn-ico{border:0;background:transparent;color:var(--side-txt);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:0 0 30px}
.btn-ico:hover{background:var(--side-2);color:var(--side-txt-forte)}
.btn-ico svg{width:18px;height:18px;transition:transform .2s}
nav{padding:14px 10px;display:grid;gap:4px}
.grupo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-txt);opacity:.6;padding:10px 12px 6px;white-space:nowrap}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-txt);text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden}
nav a svg{width:19px;height:19px;flex:0 0 19px}
nav a:hover{background:var(--side-2);color:var(--side-txt-forte)}
nav a[aria-current="page"]{background:var(--ativo);color:var(--side-txt-forte);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
nav a:focus-visible,.btn-ico:focus-visible{outline:2px solid #9AC98A;outline-offset:2px}
.rodape{margin-top:auto;padding:14px 20px 18px;border-top:1px solid var(--side-linha);font-size:12px;line-height:1.45;color:var(--side-txt);opacity:.75;white-space:nowrap;overflow:hidden}

/* recolhido */
body.min aside{width:var(--w-min);flex-basis:var(--w-min)}
body.min .marca{padding:20px 0 18px;justify-content:center}
body.min .marca .logo, body.min .grupo, body.min nav a span, body.min .rodape{display:none}
body.min nav a{justify-content:center;padding:10px 0}
body.min .btn-ico svg{transform:rotate(180deg)}

main{flex:1;min-width:0;height:100%;position:relative}
iframe{border:0;width:100%;height:100%;display:block;background:var(--fundo)}
iframe[hidden]{display:none}

/* mobile */
.topo{display:none}
@media (max-width:820px){
  body{flex-direction:column}
  .topo{display:flex;align-items:center;gap:10px;background:var(--side);color:var(--side-txt-forte);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));flex:0 0 auto}
  .topo .logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px}
  .topo .atual{font-size:13px;color:var(--side-txt);margin-left:auto}
  aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s ease;width:var(--w)!important;flex-basis:auto!important;box-shadow:8px 0 24px rgba(0,0,0,.25)}
  body.aberto aside{transform:none}
  body.min .marca .logo, body.min .grupo, body.min nav a span, body.min .rodape{display:block}
  body.min nav a{justify-content:flex-start;padding:10px 12px}
  #recolher{display:none}
  .veu{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
  body.aberto .veu{display:block}
  main{height:auto;flex:1}
}
</style>
</head>
<body>
<div class="topo">
  <button class="btn-ico" id="menu" aria-label="Abrir menu" style="color:#F5F6F2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

    <a href="#vendas" data-v="vendas" title="Dashboard comercial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/></svg><span>Dashboard comercial</span></a>
    <a href="#closers" data-v="closers" title="Performance closers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.4-.3 4.4 1.2 5 4.3"/></svg><span>Performance closers</span></a>
    <a href="#sdr" data-v="sdr" title="Performance SDRs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13v-1a7.5 7.5 0 0 1 15 0v1"/><rect x="3.5" y="13" width="4" height="6" rx="1.5"/><rect x="16.5" y="13" width="4" height="6" rx="1.5"/><path d="M18.5 19c0 1.4-1.6 2-4 2h-1.5"/></svg><span>Performance SDRs</span></a>
    <a href="#midia" data-v="midia" title="Mídia e contatos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></svg><span>Mídia e contatos</span></a>
  </nav>
  <div class="rodape">Home Office Digital</div>
</aside>
<main>
  <iframe id="f-big" title="Big numbers" hidden></iframe>

  <iframe id="f-sdr" title="Performance SDRs" hidden></iframe>

</main>

ando os dias até ${dd(m,R.cut)} (último dia com resultado lançado). Realizadas = reuniões que aconteceram. % No-show = no-shows ÷ reuniões passadas ao closer, com o valor de reuniões passadas como está na planilha.<\/span>\n    <span><strong>Typebot<\/strong>: reuniões da linha TYPEBOT na base de SDRs; faturamento das vendas com SDR = BOT; investimento na campanha Typebot da planilha de mídia.<\/span>`;\n}\n\nconst sel = $('selMes');\nsel.innerHTML = BN.meses.map((m,i)=>`<option value=\"${i}\">${m.label}<\/option>`).join('');\nsel.value = BN.meses.length-1;\nsel.addEventListener('change', ()=>render(+sel.value));\nrender(BN.meses.length-1);\n<\/script>\n<\/body>\n<\/html>\n", "vendas": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Home Office Digital · Dashboard Comercial<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --verde:#263A21;\n  --verde-2:#3E5C37;\n  --verde-3:#4F7345;\n  --offwhite:#F5F6F2;\n  --mdf:#E7EEE3;\n  --mdf-2:#D7DECD;\n  --tinta:#1C2419;\n  --tinta-2:#5B6B54;\n  --branco:#FFFFFF;\n  --ouro:#D9A441;\n  --prata:#9B968A;\n  --bronze:#B4794A;\n  --raio:10px;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\nbody{\n  font-family:'Public Sans',system-ui,sans-serif;\n  background:var(--offwhite);\n  color:var(--tinta);\n  font-size:15px;\n  line-height:1.5;\n}\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{animation:none!important;transition:none!important}\n}\n\n/* ── Header ─────────────────────────── */\nheader{\n  background:\n    linear-gradient(90deg, rgba(0,0,0,.20), rgba(0,0,0,0) 35%),\n    var(--verde);\n  color:var(--offwhite);\n  padding:22px 28px 20px;\n  border-bottom:4px solid var(--verde-3);\n}\n.header-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}\n.header-brand{display:flex;align-items:center;gap:14px}\n.header-brand img{width:44px;height:44px;border-radius:9px}\n.brand-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#B9CBB1;font-weight:600}\nh1{\n  font-family:'Bricolage Grotesque',sans-serif;\n  font-weight:700;font-size:clamp(22px,3.2vw,32px);\n  letter-spacing:-.01em;line-height:1.1;margin-top:2px;\n}\nh1 em{font-style:normal;color:#9AC98A}\n.header-periodo-resumo{font-size:13px;color:#C7D6C1;text-align:right}\n.header-periodo-resumo strong{color:var(--offwhite)}\n\n/* ── Layout ─────────────────────────── */\nmain{max-width:1180px;margin:0 auto;padding:22px 20px 64px}\nsection{margin-top:34px}\n.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}\nh2{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em}\n.sec-head .sub{font-size:13px;color:var(--tinta-2)}\n\n/* ── Filtros ────────────────────────── */\n.filtros{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:18px 20px;margin-top:20px;\n  box-shadow:0 1px 0 rgba(38,58,33,.05);\n}\n.filtro label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:10px}\n.filtro + .filtro{margin-top:18px}\n.periodo-toggles{display:flex;gap:10px;flex-wrap:wrap}\n.chip-mes{\n  font:inherit;font-size:14px;font-weight:600;color:var(--tinta);cursor:pointer;\n  background:var(--offwhite);border:1.5px solid var(--mdf-2);border-radius:99px;padding:9px 18px;\n  transition:background .15s,border-color .15s,color .15s;\n}\n.chip-mes:hover{background:var(--mdf)}\n.chip-mes.ativo{background:var(--verde);color:var(--offwhite);border-color:var(--verde)}\n.chip-mes:focus-visible{outli onze::before{background:var(--bronze)}\n.kpi .rotulo{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2)}\n.kpi .valor{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}\n.kpi .detalhe{font-size:12.5px;color:var(--tinta-2);margin-top:2px}\n\n.nota{font-size:12.5px;color:var(--tinta-2);margin-top:14px;line-height:1.5}\n.alerta-divergencia{\n  margin-top:14px;padding:12px 16px;border-radius:8px;\n  background:#FBF2E2;border:1px solid #E9CE9A;color:#6B4E1A;font-size:13px;line-height:1.5;\n}\n.alerta-divergencia strong{color:#4F3810}\n\n/* ── Cards ──────────────────────────── */\n.card{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:18px 20px;box-shadow:0 1px 0 rgba(38,58,33,.05);\n}\n.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n@media(max-width:880px){.grid-2{grid-template-columns:1fr}}\n\n/* Barras estilo ripa (assinatura visual herdada do padrão Montagna Ads) */\n.slats{display:flex;flex-direction:column;gap:9px}\n.slat-row{display:grid;grid-template-columns:170px 1fr 92px;gap:10px;align-items:center;padding:2px 6px;border-radius:6px}\n@media(max-width:560px){.slat-row{grid-template-columns:120px 1fr 78px}}\n.slat-row.slat-row-sem-barra{grid-template-columns:1fr auto;justify-content:space-between}\n.slat-row.slat-row-sem-barra .slat-num{text-align:right;font-weight:600}\n.slat-nome{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.slat-trilho{background:var(--mdf);border-radius:4px;height:22px;position:relative}\n.slat-barra{\n  height:100%;border-radius:4px;min-width:2px;\n  background:\n    repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 9px, rgba(0,0,0,.05) 9px 18px),\n    var(--cor,var(--verde-3));\n  border-right:2px solid rgba(0,0,0,.15);\n  transition:width .45s cubic-bezier(.2,.7,.3,1);\n}\n.slat-num{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;text-align:right;line-height:1.25}\n.rank-pos{display:inline-block;min-width:26px;font-weight:700;color:var(--tinta-2);font-variant-numeric:tabular-nums;font-size:12.5px}\n.slat-row.top1{background:linear-gradient(90deg, rgba(217,164,65,.16), transparent 75%)}\n.slat-row.top2{background:linear-gradient(90deg, rgba(155,150,138,.18), transparent 75%)}\n.slat-row.top3{background:linear-gradient(90deg, rgba(180,121,74,.16), transparent 75%)}\n.slat-row.top1 .rank-pos{color:var(--ouro)}\n.slat-row.top2 .rank-pos{color:var(--prata)}\n.slat-row.top3 .rank-pos{color:var(--bronze)}\n.vazio{padding:28px;text-align:center;color:var(--tinta-2);font-size:14px}\n\n/* Busca por nome dentro do ranking (filtra ou mostra todos) */\n.busca-nome-wrap{position:relative;margin-bottom:14px}\n.busca-nome{\n  width:100%;font:inherit;font-size:14px;color:var(--tinta);\n  background:var(--offwhite);border:1px solid var(--mdf-2);border-radius:8px;padding:9px 34px 9px 12px;\n}\n.busca-nome:focus-visible{outline:2px solid var(--verde-3);outline-offset:1px}\n.busca-nome-limpar{\n  position:absolute;right:6px;top:50%;transform:translateY(-50%);\n  background:none;border:none;color:var(--tinta-2);font-size:16px;cursor:pointer;padding:4px 8px;line-height:1;display:none;\n}\n.busca-nome-limpar.visivel{display:block}\n.busca-nome-info{font-size:12px;color:var(--tinta-2);margin-top:-8px;margin-bottom:10px}\n\n/* Gráfico de linha (variação diária) */\n#graficoLinhaWrap{position:relative}\n#graficoLinha{width:100%;height:auto;display:block}\n.tooltip{\n  position:absolute;pointer-events:none;background:var(--verde);color:var(--offwhite);\n  font-size:12.5px;padding:7px 11px;border-radius:7px;white-space:nowrap;\n  transform:translate(-50%,-115%);opacity:0;transition:opacity .12s;z-index:5;\n}\n.tooltip strong{color:#9AC98A}\n\nfooter{max-width:1180px;margin:0 auto;padding:0 20px 36px;font-size:12.5px;color:var(--tinta-2)}\n\n/* ── Estrutura de times / categorias ─────────────────── */\n.info-times{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:16px 20px;margin-top:20px;font-size:13px;color:var(--tinta-2);line-height:1.6;\n}\n.info-times strong{color:var(--tinta)}\n.legenda-categorias{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}\n.legenda-item{display:flex;align-items:center;gap:6px;font-size:12.5px}\n.legenda-dot{width:10px;height:10px;border-radius:50%;display:inline-block}\n.legenda-dot.senior{background:var(--ouro)}\n.legenda-dot.pleno{background:var(--prata)}\n.legenda-dot.junior{background:var(--bronze)}\n\n.time-badge{\n  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;\n  padding:2px 8px;border-radius:99px;color:var(--offwhite);white-space:nowrap;\n}\n.time-badge.tA{background:var(--verde-3)}\n.time-badge.tB{background:var(--verde-2)}\n.time-badge.t1{background:var(--bronze)}\n.time-badge.t2{background:#8A6C3D}\n.time-badge.t3{background:var(--ouro)}\n\n.cat-badge{\n  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;\n  padding:2px 8px;border-radius:99px;color:var(--tinta);white-space:nowrap;\n}\n.cat-badge.senior{background:#F3E1B8;color:#6B4E1A}\n.cat-badge.pleno{background:#E7E5DF;color:#4A473E}\n.cat-badge.junior{background:#E9D3BE;color:#5C3B1E}\n.cat-badge.sem-categoria{background:var(--mdf);color:var(--tinta-2)}\n\n.lider-tag{font-size:10.5px;color:var(--verde-2);font-weight:700}\n\n/* Cards de time */\n.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}\n@media(max-width:880px){.team-grid{grid-template-columns:1fr}}\n.team-grid + .team-grid{margin-top:16px}\n.team-grid-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin:20px 0 8px}\n.team-grid-label:first-child{margin-top:0}\n.team-card{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:16px 18px;box-shadow:0 1px 0 rgba(38,58,33,.05);\n}\n.team-card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}\n.team-card-nome{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}\n.fairy-icon{width:30px;height:30px;flex:none}\n.team-card-lider{font-size:12px;color:var(--tinta-2)}\n.team-card-nums{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}\n.team-card-total{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700}\n.team-card-meta{font-size:12.5px;color:var(--tinta-2)}\n.team-card-trilho{background:var(--mdf);border-radius:4px;height:10px;margin:8px 0 10px;overflow:hidden}\n.team-card-barra{height:100%;border-radius:4px;background:var(--verde-3);transition:width .45s cubic-bezier(.2,.7,.3,1)}\n.team-card-pct{font-size:12px;font-weight:600;color:var(--tinta-2);margin-bottom:10px}\n.team-card-membros{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--mdf);padding-top:8px}\n.team-card-membro{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:8px}\n.team-card-membro .m-nome{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.team-card-membro .m-valor{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}\n.team-card-membro .m-valor-nota{font-weight:400;font-size:10.5px;color:var(--tinta-2)}\n\n/* Sprinters: categoria de trabalho, não um time — visual deliberadamente diferente dos\n   .team-card acima (sem borda lateral de time, sem meta em R$, foco no % de no-show) */\n.metrica-card{\n  background:var(--mdf);border:1px dashed var(--prata);border-radius:var(--raio);\n  padding:20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;\n}\n.metrica-destaque-bloco{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:10px}\n.metrica-destaque-valor{font-size:40px;font-weight:700;color:var(--tinta);line-height:1;font-variant-numeric:tabular-nums}\n.metrica-destaque-rotulo{font-size:12.5px;color:var(--tinta-2)}\n.metrica-trilho{width:100%;max-width:360px;background:var(--mdf-2);border-radius:4px;height:8px;overflow:hidden}\n.metrica-barra{height:100%;background:var(--verde-3);border-radius:4px}\n.metrica-legenda{font-size:12px;color:var(--tinta-2);margin:6px 0 16px}\n.metrica-nums{display:flex;gap:32px;flex-wrap:wrap;justify-content:center}\n.metrica-num{display:flex;flex-direction:column;align-items:center}\n.metrica-num .n-valor{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}\n.metrica-num .n-rotulo{font-size:11.5px;color:var(--tinta-2)}\n.metrica-destaques{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}\n.metrica-destaque-chip{font-size:12px;color:var(--tinta-2);background:var(--branco);border:1px solid var(--mdf-2);border-radius:99px;padding:5px 12px}\n.destaque-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;color:var(--offwhite);margin-right:4px}\n.destaque-tag.melhor{background:var(--verde-3)}\n.destaque-tag.pior{background:#B05C4A}\n.metrica-toggle{\n  display:flex;align-items:center;gap:6px;margin:16px auto 0;padding:7px 16px;\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:99px;\n  font-size:12.5px;font-weight:600;color:var(--tinta-2);cursor:pointer;\n}\n.metrica-toggle:hover{background:var(--mdf)}\n.metrica-toggle-seta{display:inline-block;transition:transform .2s ease;font-size:10px}\n.metrica-toggle[aria-expanded=\"true\"] .metrica-toggle-seta{transform:rotate(90deg)}\n.metrica-dia-semana{font-weight:400;color:var(--tinta-2);font-size:11.5px}\n\n/* Tabela diária: Dia / Agendadas / Realizadas / No-show (com escala de cor) */\n.metrica-table{display:flex;flex-direction:column;border:1px solid var(--mdf-2);border-radius:var(--raio);overflow:hidden}\n.metrica-table-head, .metrica-table-row{\n  display:grid;grid-template-columns:84px 1fr 1fr 110px;gap:8px;align-items:center;padding:8px 14px;\n}\n@media(max-width:560px){ .metrica-table-head, .metrica-table-row{grid-template-columns:62px 1fr 1fr 86px;gap:4px;padding:7px 10px} }\n.metrica-table-head{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-2);background:var(--mdf)}\n.metrica-table-head span:not(:first-child), .metrica-table-row span:not(:first-child){text-align:right}\n.metrica-table-row{font-size:13px;border-top:1px solid var(--mdf-2);font-variant-numeric:tabular-nums}\n.metrica-table-row.sem-reuniao{color:var(--tinta-2)}\n.metrica-table-row .dia-nome{text-align:left;display:flex;align-items:center;gap:6px;font-weight:500}\n.metrica-table-row .metrica-pill{\n  display:inline-block;justify-self:end;padding:3px 10px;border-radius:99px;font-weight:700;font-size:12.5px;\n}\n\n/* Atingimento individual */\n.categoria-heading{\n  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);\n  margin:16px 0 8px;display:flex;align-items:center;gap:8px;\n}\n.categoria-heading:first-child{margin-top:0}\n.individual-list{display:flex;flex-direction:column;gap:10px}\n.individual-row{padding:2px 2px}\n.individual-row-topo{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}\n.individual-nome{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}\n.individual-num{font-size:12.5px;color:var(--tinta-2);font-variant-numeric:tabular-nums;white-space:nowrap}\n.individual-num strong{color:var(--tinta)}\n.individual-bar-trilho{background:var(--mdf);border-radius:4px;height:14px;position:relative;overflow:hidden}\n.individual-bar{height:100%;border-radius:4px;min-width:2px;transition:width .45s cubic-bezier(.2,.7,.3,1)}\n.individual-bar.senior{background:var(--ouro)}\n.individual-bar.pleno{background:var(--prata)}\n.individual-bar.junior{ba ate\" id=\"diaFimCal\">\n        <button type=\"button\" id=\"limparDias\">Ver mês(es) completo(s)<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"filtros-rodape\">\n      <div class=\"contagem-filtro\" id=\"contagem\"><\/div>\n      <button id=\"limpar\">Selecionar todos os meses<\/button>\n    <\/div>\n  <\/div>\n\n  <!-- Info: data da atualização (não é filtro, só referência para os cartões de ritmo) -->\n  <div class=\"info-atualizacao\">\n    <label for=\"dataAtualizacao\">Data da atualização (referência para \"dias restantes\", \"necessário por dia\" e \"ontem\")<\/label>\n    <input type=\"date\" id=\"dataAtualizacao\">\n  <\/div>\n\n  <!-- KPIs -->\n  <div class=\"kpis\">\n    <div class=\"kpi k-meta\"><div class=\"rotulo\">Meta do período<\/div><div class=\"valor\" id=\"kMeta\">–<\/div><div class=\"detalhe\" id=\"kMetaDet\"><\/div><\/div>\n    <div class=\"kpi\"><div class=\"rotulo\">Total vendido<\/div><div class=\"valor\" id=\"kTotal\">–<\/div><div class=\"detalhe\" id=\"kTotalDet\"><\/div><\/div>\n    <div class=\"kpi k-projecao\"><div class=\"rotulo\">Projeção de fechamento<\/div><div class=\"valor\" id=\"kProjecao\">–<\/div><div class=\"detalhe\" id=\"kProjecaoDet\"><\/div><\/div>\n    <div class=\"kpi k-evo\"><div class=\"rotulo\" id=\"kEvoRotulo\">Evolução vs. mês anterior<\/div><div class=\"valor\" id=\"kEvo\">–<\/div><div class=\"detalhe\" id=\"kEvoDet\"><\/div><\/div>\n    <div class=\"kpi k-media-filtro\"><div class=\"rotulo\">Média diária (no filtro)<\/div><div class=\"valor\" id=\"kMediaFiltro\">–<\/div><div class=\"detalhe\" id=\"kMediaFiltroDet\"><\/div><\/div>\n  <\/div>\n\n  <div class=\"kpis kpis-ritmo\" id=\"blocoRitmo\">\n    <div class=\"kpi k-dias\"><div class=\"rotulo\">Dias restantes para a meta<\/div><div class=\"valor\" id=\"kDias\">–<\/div><div class=\"detalhe\" id=\"kDiasDet\"><\/div><\/div>\n    <div class=\"kpi k-necessario\"><div class=\"rotulo\">Necessário por dia<\/div><div class=\"valor\" id=\"kNecessario\">–<\/div><div class=\"detalhe\" id=\"kNecessarioDet\"><\/div><\/div>\n    <div class=\"kpi k-ontem\"><div class=\"rotulo\">Quanto fizemos ontem<\/div><div class=\"valor\" id=\"kOntem\">–<\/div><div class=\"detalhe\" id=\"kOntemDet\"><\/div><\/div>\n  <\/div>\n\n  <!-- Desempenho por Time -->\n  <section>\n    <div class=\"sec-head\"><h2>Desempenho por Time<\/h2><span class=\"sub\" id=\"timesSub\">meta de cada time = metade da meta geral do período selecionado<\/span><\/div>\n    <div class=\"team-grid-label\">Closers<\/div>\n    <div class=\"team-grid\" id=\"gTimesCloser\"><\/div>\n    <div class=\"team-grid-label\">SDRs<\/div>\n    <div class=\"team-grid\" id=\"gTimesSdr\"><\/div>\n  <\/section>\n\n  <!-- Atingimento individual (por categoria) -->\n  <section>\n    <div class=\"sec-head\"><h2>Atingimento individual — meta por categoria<\/h2><span class=\"sub\" id=\"individualSub\">meta mensal por categoria × nº de meses selecionados<\/span><\/div>\n    <div class=\"grid-2\">\n      <div class=\"card\">\n        <div class=\"sec-head\" style=\"margin-bottom:8px\"><h2 style=\"font-size:15px\">Closers<\/h2><\/div>\n        <div id=\"gIndividualCloser\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <div class=\"sec-head\" style=\"margin-bottom:8px\"><h2 style=\"font-size:15px\">SDRs<\/h2><\/div>\n        <div id=\"gIndividualSdr\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Rankings -->\n  <section>\n    <div class=\"grid-2\">\n      <div class=\"card\">\n        <div class=\"sec-head\"><h2>Ranking — Closers<\/h2><span class=\"sub\">quem mais faturou no período — busque um nome ou veja todos<\/span><\/div>\n        <div class=\"busca-nome-wrap\">\n          <input type=\"search\" class=\"busca-nome\" id=\"buscaCloser\" placeholder=\"Buscar closer pelo nome...\">\n          <button type=\"button\" class=\"busca-nome-limpar\" id=\"limpaBuscaCloser\" aria-label=\"Limpar busca\">✕<\/button>\n        <\/div>\n        <div class=\"busca-nome-info\" id=\"infoCloser\"><\/div>\n        <div class=\"slats\" id=\"gCloser\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <div class=\"sec-head\"><h2>Ranking — SDRs<\/h2><span class=\"sub\">quem mais originou faturamento no período — busque um nome ou veja todos<\/span><\/div>\n        <div class=\"busca-nome-wrap\">\n          <input type=\"search\" class=\"busca-nome\" id=\"buscaSdr\" placeholder=\"Buscar SDR pelo nome...\">\n          <button type=\"button\" class=\"busca-nome-limpar\" id=\"limpaBuscaSdr\" aria-label=\"Limpar busca\">✕<\/button>\n        <\/div>\n        <div class=\"busca-nome-info\" id=\"infoSdr\"><\/div>\n        <div class=\"slats\" id=\"gSdr\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Composição das Vendas: ticket médio, plano, forma de pagamento, observações (a partir de outubro/26) -->\n  <section id=\"secComposicao\" style=\"display:none\">\n    <div class=\"sec-head\"><h2>Composição das Vendas<\/h2><span class=\"sub\">ticket médio, planos, forma de pagamento e observações recorrentes — a partir de outubro/26<\/span><\/div>\n    <div class=\"kpis kpis-composicao\">\n      <div class=\"kpi k-verde\"><div class=\"rotulo\">Ticket médio (real)<\/div><div class=\"valor\" id=\"kTicketReal\">–<\/div><div class=\"detalhe\" id=\"kTicketRealDet\">sem recorrência — valor integral das vendas<\/div><\/div>\n      <div class=\"kpi k-prata\"><div class=\"rotulo\">Ticket médio (nominal)<\/div><div class=\"valor\" id=\"kTicketNominal\">–<\/div><div class=\"detalhe\" id=\"kTicketNominalDet\">incluindo valores de recorrência<\/div><\/div>\n      <div class=\"kpi k-ouro\"><div class=\"rotulo\">Recorrência<\/div><div class=\"valor\" id=\"kObsRecorrencia\">–<\/div><div class=\"detalhe\" id=\"kObsRecorrenciaDet\"><\/div><\/div>\n      <div class=\"kpi k-bronze\"><div class=\"rotulo\">Semestral<\/div><div class=\"valor\" id=\"kObsSemestral\">–<\/div><div class=\"detalhe\" id=\"kObsSemestralDet\"><\/div><\/div>\n      <div class=\"kpi k-ve    <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Sprinters — categoria de trabalho (NÃO é um time de vendas), visual próprio para não confundir com os cards de time lá em cima -->\n  <section id=\"secSprinters\" style=\"display:none\">\n    <div class=\"sec-head\"><h2>Sprinters — <span id=\"sprintersNomes\"><\/span><\/h2><span class=\"sub\">categoria de trabalho, não um time de vendas — as vendas de quem está aqui seguem valendo no Ranking de SDRs e no total geral; aqui o que se acompanha é o no-show das reuniões<\/span><\/div>\n    <div class=\"metrica-card\">\n      <div class=\"metrica-destaque-bloco\">\n        <span class=\"metrica-destaque-valor\" id=\"sprintersPctNoShow\">–<\/span>\n        <span class=\"metrica-destaque-rotulo\">no-show · <span id=\"sprintersPeriodoLabel\"><\/span><\/span>\n      <\/div>\n      <div class=\"metrica-trilho\"><div class=\"metrica-barra\" id=\"sprintersBarra\"><\/div><\/div>\n      <div class=\"metrica-legenda\" id=\"sprintersPctComp\"><\/div>\n      <div class=\"metrica-nums\">\n        <div class=\"metrica-num\"><span class=\"n-valor\" id=\"sprintersAgendadas\">–<\/span><span class=\"n-rotulo\">reuniões agendadas<\/span><\/div>\n        <div class=\"metrica-num\"><span class=\"n-valor\" id=\"sprintersAconteceram\">–<\/span><span class=\"n-rotulo\">reuniões aconteceram<\/span><\/div>\n      <\/div>\n      <div class=\"metrica-destaques\">\n        <div class=\"metrica-destaque-chip\" id=\"sprintersMediaAgendadas\"><\/div>\n        <div class=\"metrica-destaque-chip\" id=\"sprintersMediaAconteceram\"><\/div>\n      <\/div>\n    <\/div>\n    <button type=\"button\" class=\"metrica-toggle\" id=\"sprintersToggle\" aria-expanded=\"false\">\n      <span id=\"sprintersToggleLabel\">Ver no-show por dia<\/span> <span class=\"metrica-toggle-seta\" id=\"sprintersToggleSeta\">▸<\/span>\n    <\/button>\n    <div class=\"metrica-table\" id=\"sprintersDias\" style=\"display:none\">\n      <div class=\"metrica-table-head\">\n        <span>Dia :none\"><\/div>\n\n  <!-- Estrutura de times -->\n  <div class=\"info-times\">\n    <strong>Estrutura comercial — setembro/26:<\/strong> Closers em <strong>Time A — \"Galáticos\"<\/strong> (Portuga · líder, Paulo, Túlio, Luigi) e <strong>Time B<\/strong> (Edu · líder, Larissa, Rodrigo, Misael). SDRs em <strong>Time 1 — \"Fantásticos Leads\"<\/strong> (Rafael · líder, Beatriz, Vitor, Carioca, Alvaro) e <strong>Time 2 — \"Clube das Winx\"<\/strong> (Michelly · líder, Leandro, Gustavo, Iasmin). Alvaro entrou no Time 1 sem categoria (Júnior/Pleno/Sênior) e, portanto, sem meta individual — mas seu resultado conta normalmente para o total do Time 1 e para o somatório geral de SDR.\n    <br><br>\n    <strong>A partir de outubro/26:<\/strong> Túlio e Misael saíram dos times de Closers — seus resultados deixam de contar para o total de Time A/B, mas continuam no Ranking de Closers e no somatório geral. Rafael e Leandro saíram dos times de SDR, com o mesmo tratamento (ranking e somatório geral, fora da soma por time). Vitor migrou para o <strong>Time 2 — \"Clube das Winx\"<\/strong>, que passa a ter só Iasmin e Vitor. O <strong>Time 1 — \"Fantásticos Leads\"<\/strong> passa a ter só Carioca e Beatriz. Alvaro deixou o Time 1 de SDRs e passou a ser closer do <strong>Time B<\/strong> (júnior, meta R$ 50.000/mês), que fica com Edu, Larissa, Rodrigo e Alvaro; vendas em que ele aparece como SDR seguem no Ranking de SDRs e no somatório geral, fora da soma por time. Michelly e Gustavo formam o novo <strong>Time 3 — \"Sprinters\"<\/strong>: não têm meta em R$ nem somatório de time (suas vendas contam no Ranking de SDRs e no somatório geral, mas não no total de nenhum time) — em vez disso, são acompanhados pela taxa de no-show das reuniões agendadas.\n    <br><br>\n    Cada pessoa também tem uma categoria com meta individual mensal — os valores de SDR e Closer não se somam entre si (são complementares: a mesma venda é contabilizada uma vez do lado do closer e uma vez do lado do SDR).\n
