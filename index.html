<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOD · Painel Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1B2A17; --side-2:#22341D; --side-linha:rgba(245,246,242,.10);
  --side-txt:#C7D6C1; --side-txt-forte:#F5F6F2; --ativo:#4F7345;
  --fundo:#F5F6F2; --w:256px; --w-min:68px;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fundo:#141A12; } }
:root[data-theme="dark"]{ --fundo:#141A12; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fundo);display:flex;overflow:hidden}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

aside{width:var(--w);flex:0 0 var(--w);height:100%;background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;border-right:1px solid var(--side-linha);transition:width .2s ease,flex-basis .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.marca{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:20px 16px 18px 20px;border-bottom:1px solid var(--side-linha)}
.marca .logo{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--side-txt-forte);white-space:nowrap}
.marca .logo small{display:block;font-family:'Public Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-txt);opacity:.8;margin-top:2px}
.btn-ico{border:0;background:transparent;color:var(--side-txt);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:0 0 30px}
.btn-ico:hover{background:var(--side-2);color:var(--side-txt-forte)}
.btn-ico svg{width:18px;height:18px;transition:transform .2s}
nav{padding:14px 10px;display:grid;gap:4px}
.grupo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-txt);opacity:.6;padding:10px 12px 6px;white-space:nowrap}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-txt);text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden}
nav a svg{width:19px;height:19px;flex:0 0 19px}
nav a:hover{background:var(--side-2);color:var(--side-txt-forte)}
nav a[aria-current="page"]{background:var(--ativo);color:var(--side-txt-forte);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
nav a:focus-visible,.btn-ico:focus-visible{outline:2px solid #9AC98A;outline-offset:2px}
.rodape{margin-top:auto;padding:14px 20px 18px;border-top:1px solid var(--side-linha);font-size:12px;line-height:1.45;color:var(--side-txt);opacity:.75;white-space:nowrap;overflow:hidden}

/* recolhido */
body.min aside{width:var(--w-min);flex-basis:var(--w-min)}
body.min .marca{padding:20px 0 18px;justify-content:center}
body.min .marca .logo, body.min .grupo, body.min nav a span, body.min .rodape{display:none}
body.min nav a{justify-content:center;padding:10px 0}
body.min .btn-ico svg{transform:rotate(180deg)}

main{flex:1;min-width:0;height:100%;position:relative}
iframe{border:0;width:100%;height:100%;display:block;background:var(--fundo)}
iframe[hidden]{display:none}

/* mobile */
.topo{display:none}
@media (max-width:820px){
  body{flex-direction:column}
  .topo{display:flex;align-items:center;gap:10px;background:var(--side);color:var(--side-txt-forte);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));flex:0 0 auto}
  .topo .logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px}
  .topo .atual{font-size:13px;color:var(--side-txt);margin-left:auto}
  aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s ease;width:var(--w)!important;flex-basis:auto!important;box-shadow:8px 0 24px rgba(0,0,0,.25)}
  body.aberto aside{transform:none}
  body.min .marca .logo, body.min .grupo, body.min nav a span, body.min .rodape{display:block}
  body.min nav a{justify-content:flex-start;padding:10px 12px}
  #recolher{display:none}
  .veu{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
  body.aberto .veu{display:block}
  main{height:auto;flex:1}
}
</style>
</head>
<body>
<div class="topo">
  <button class="btn-ico" id="menu" aria-label="Abrir menu" style="color:#F5F6F2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

    <a href="#closers" data-v="closers" title="Performance closers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.4-.3 4.4 1.2 5 4.3"/></svg><span>Performance closers</span></a>
    <a href="#sdr" data-v="sdr" title="Performance SDRs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13v-1a7.5 7.5 0 0 1 15 0v1"/><rect x="3.5" y="13" width="4" height="6" rx="1.5"/><rect x="16.5" y="13" width="4" height="6" rx="1.5"/><path d="M18.5 19c0 1.4-1.6 2-4 2h-1.5"/></svg><span>Performance SDRs</span></a>
    <a href="#midia" data-v="midia" title="Mídia e contatos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></svg><span>Mídia e contatos</span></a>
  </nav>
  <div class="rodape">Home Office Digital</div>
</aside>
<main>
  <iframe id="f-big" title="Big numbers" hidden></iframe>
  <iframe id="f-vendas" title="Dashboard comercial" hidden></iframe>

  <iframe id="f-sdr" title="Performance SDRs" hidden></iframe>
  <iframe id="f-midia" title="Mídia e contatos" hidden></iframe>
</main>

ia` : '';\n\n  $('nota').innerHTML = `\n    <span><strong>Faturamento<\/strong>: total vendido no mês, igual ao Dashboard comercial (inclui low ticket e recuperação de cobranças).<\/span>\n    <span><strong>Reuniões<\/strong>: base Performance SDRs, considerando os dias até ${dd(m,R.cut)} (último dia com resultado lançado). Realizadas = reuniões que aconteceram. % No-show = no-shows ÷ reuniões passadas ao closer, com o valor de reuniões passadas como está na planilha.<\/span>\n    <span><strong>Typebot<\/strong>: reuniões da linha TYPEBOT na base de SDRs; faturamento das vendas com SDR = BOT; investimento na campanha Typebot da planilha de mídia.<\/span>`;\n}\n\nconst sel = $('selMes');\nsel.innerHTML = BN.meses.map((m,i)=>`<option value=\"${i}\">${m.label}<\/option>`).join('');\nsel.value = BN.meses.length-1;\nsel.addEventListener('change', ()=>render(+sel.value));\nrender(BN.meses.length-1);\n<\/script>\n<\/body>\n<\/html>\n", "closers": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Performance Comercial — Closers HOD · Maio a Outubro/26<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --verde:#263A21; --verde-2:#3E5C37; --verde-3:#4F7345;\n  --fundo:#F5F6F2; --mdf:#E7EEE3; --linha:#D7DECD;\n  --tinta:#1C2419; --tinta-2:#5B6B54; --card:#FFFFFF;\n  --acima:#3E5C37; --acima-bg:#E3EEDD;\n  --perto:#6F7768; --perto-bg:#ECEEE8;\n  --abaixo:#9A6B2F; --abaixo-bg:#F5EADB;\n  --barra:#4F7345; --barra-bg:#EEF2EA;\n  --alerta-bg:#FBF6EA; --alerta-borda:#E6D3A6;\n  --raio:10px;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefe t-size:12px;color:var(--tinta-2)}\n\n.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-top:26px;flex-wrap:wrap}\n.abas button{font:inherit;font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:17px;font-weight:600;border:0;background:transparent;color:var(--tinta-2);padding:10px 16px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}\n.abas button[aria-selected=\"true\"]{color:var(--tinta);border-bottom-color:var(--verde-3)}\n.abas button:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px}\n.aviso-sec{font-size:13px;color:var(--tinta-2);background:var(--card);border:1px solid var(--linha);border-left:3px solid var(--alerta-borda);border-radius:6px;padding:10px 14px;margin-top:22px;max-width:110ch}\n.aviso-sec strong{color:var(--tinta)}\n[hidden]{display:none!important}\n\n.filtros-dia{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}\n.filtros-dia label{display:grid;gap:4px;font-size:12.5px;color:var(--tinta-2)}\n.filtros-dia select{min-width:0;font-size:14px;padding:7px 10px}\ntable.tab-dia{min-width:880px}\ntable.tab-dia button.ord{font:inherit;font-weight:600;color:inherit;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}\ntable.tab-dia button.ord:hover{color:var(--tinta)}\ntable.tab-dia th[aria-sort] button.ord{color:var(--tinta)}\ntable.tab-dia button.ord:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px;border-radius:3px}\ntable.tab-dia tbody tr.zero td{color:var(--tinta-2)}\ntable.tab-dia .dow{font-size:12px;color:var(--tinta-2);margin-left:6px}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div class=\"wrap\">\n    <div>\n      <h1>Performance Comercial — Closers HOD<\/h1>\n      <div class=\"periodo\">Maio a Outubro de 2026 · outubro em andamento, dados até 31/10<\/div>\n    <\/div>\n    <div class=\"fonte\">Reuniões e vendas: abas GERAL MAI a OUT e abas individuais de setembro e outubro. Faturamento: dashboard financeiro HOD.<\/div>\n  <\/div>\n<\/header>\n\n<main>\n\n  <div class=\"abas\" role=\"tablist\" style=\"margin-top:4px\">\n    <button type=\"button\" role=\"tab\" aria-selected=\"true\" data-aba=\"closer\" id=\"tab-closer\">Closers · setembro e outubro<\/button>\n    <button type=\"button\" role=\"tab\" aria-selected=\"false\" data-aba=\"mes\" id=\"tab-mes\">Time · maio a outubro<\/button>\n  <\/div>\n\n  <div id=\"aba-closer\" role=\"tabpanel\" aria-labelledby=\"tab-closer\">\n    <div class=\"ind-top\" style=\"margin-top:22px\"><label for=\"closer-mes\" class=\"sub\">Mês<\/label><div class=\"seg\" role=\"group\" aria-label=\"Mês\" id=\"closer-mes\"><button type=\"button\" data-mes=\"Setembro\" aria-pressed=\"false\">Setembro<\/button><button type=\"button\" data-mes=\"Outubro\" aria-pressed=\"true\">Outubro (até 31/10)<\/button><\/div><\/div>\n    <p class=\"aviso-sec\" id=\"closer-aviso\"><\/p>\n    <section>\n      <div class=\"sec-head\"><h2>Dados diários<\/h2><span class=\"sub\">números por dia, conforme o filtro<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\" style=\"align-items:flex-end\">\n          <div class=\"seg\" role=\"group\" aria-label=\"Tipo de visão\" id=\"dia-modo\">\n            <button type=\"button\" data-modo=\"dia\" aria-pressed=\"true\">Closers lado a lado<\/button>\n            <button type=\"button\" data-modo=\"closer\" aria-pressed=\"false\">Um closer ao longo dos dias<\/button>\n          <\/div>\n          <div class=\"filtros-dia\" id=\"dia-filtros\"><\/div>\n        <\/div>\n        <div class=\"tabela-box\" style=\"border:0\"><table id=\"dia-tabela\" class=\"tab-dia\"><\/table><\/div>\n        <p class=\"nota\" id=\"dia-nota\"><\/p>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2 id=\"closer-titulo\">Visão geral do time<\/h2><span class=\"sub\" id=\"closer-sub\"><\/span><\/div>\n      <div class=\"kpis\" id=\"closer-kpis\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparativo dos closers<\/h2><span class=\"sub\">ordem alfabética · indicador = distância da média dos closers<\/span><\/div>\n      <div class=\"tabela-box\"><table id=\"closer-tabela\"><\/table><\/div>\n      <div class=\"legenda\">\n        <span><span class=\"chip acima\">+12%<\/span> acima da média<\/span>\n        <span><span class=\"chip perto\">−4%<\/span> próximo da média (até ±10%)<\/span>\n        <span><span class=\"chip abaixo\">−25%<\/span> abaixo da média<\/span>\n      <\/div>\n      <p class=\"nota\">Média dos closers = média simples dos resultados individuais do mês selecionado (ticket médio e % Follow só entre closers com vendas). Total do time = soma para reuniões, vendas, faturamento e Follow; conversão, ticket e % Follow do total são calculados sobre os somatórios.<\/p>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparação com a média dos closers<\/h2><span class=\"sub\">a linha tracejada marca a média<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\"><div class=\"seg\" role=\"group\" aria-label=\"Métrica\" id=\"closer-seg\"><\/div><div class=\"ref\" id=\"closer-ref\"><\/div><\/div>\n        <div class=\"barras\" id=\"closer-barras\"><\/div>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Detalhamento individual<\/h2><\/div>\n      <div class=\"ind-top\"><label for=\"closer-sel\" class=\"sub\">Closer<\/label><select id=\"closer-sel\"><\/select><\/div>\n      <div class=\"ind-grid\" id=\"closer-grid\"><\/div>\n      <p class=\"compl\" id=\"closer-compl\"><\/p>\n    <\/section>\n  <\/div>\n  <section>\n  <details class=\"atencao\">\n    <summary>Pontos de atenção nos dados (clique para expandir)<\/summary>\n    <ul>\n      <li><strong>Outubro é mês em andamento<\/strong>, com reuniões, vendas e faturamento lançados de 01 a 31/10. Fica fora da média mensal e do total do período; volumes (reuniões, vendas, faturamento) não são comparados com meses fechados, só a taxa de conversão e o % de Follow.<\/li>\n      <li><strong>Túlio tem R$ 2.148,73 de faturamento em outubro<\/strong>, mas a aba dele foi desconsiderada. Fica fora da visão por closer (R$ 348.357,55) e dentro da visão mensal, que soma todos os closers da aba Vendas (R$ 354.096,68). Por isso o ticket médio de outubro é R$ 2.977,41 na visão por closer e R$ 3.026,47 na visão mensal.<\/li>\n      <li><strong>Closers em outubro:<\/strong> abas de Misael e Túlio desconsideradas, conforme orientação; 7 closers na média. Dias sem preenchimento contados como zero; quando o subtotal da semana diverge dos dias, valem os dias somados. Último dia lançado varia por closer: Alvaro até 22/10; Larissa, Luigi e Paulo até 30/10; Leandro, Eduardo e Rodrigo até 31/10. Fonte única desde 15/10: planilha Acompanhamento_HOD.xlsx (abas por closer e aba Vendas).<\/li>\n      <li><strong>Subtotais semanais desatualizados nas abas de outubro.<\/strong> Os subtotais das semanas a partir de 12/10 e a linha de total do mês não incluem todos os dias lançados. O dashboard soma os dias: 1090 agendadas, 526 realizadas, 117 vendas, 118 leads em Follow e 59 vendas de Follow. A aba Closers Geral Outubro bate com a soma das abas em todos os dias, exceto nas vendas de Follow de 19/10 (2 na aba geral, 1 nas abas individuais); valem as abas individuais.<\/li>\n      <li><strong>Setembro: 111 vendas no consolidado × 107 nas abas por closer.<\/strong> A diferença está em 24/09 (8 vendas na GERAL SET, 4 nas abas individuais), ainda não atribuída a nenhum closer. A visão por closer de setembro usa as abas individuais da versão anterior.<\/li>\n      <li><strong>Coluna H com 0,01 e 0,02 em setembro:<\/strong> leitura padrão “0,01 = 1 venda”, com base na correção feita nos lançamentos de Eduardo. Outubro não tem esse tipo de lançamento.<\/li>\n      <li><strong>Faturamento de setembro:<\/strong> a visão mensal soma todos os closers do dashboard financeiro (R$ 290.949,71, inclui Rafael com R$ 4.299,93); a visão por closer soma só os 9 closers com aba (R$ 286.649,78). Na versão atualizada, Larissa ganhou R$ 1.795,20 em setembro em relação à versão anterior. Maio a agosto seguem o critério da visão mensal.<\/li>\n      <li><strong>Alvaro<\/strong> tem lançamentos só até 04/09 e R$ 0 como closer em setembro. Ticket médio e % Follow não existem para quem não teve vendas, então essas médias usam só os closers com venda.<\/li>\n    <\/ul>\n    <div class=\"leitura\">\n      <span>Leitura da coluna H:<\/span>\n      <div class=\"seg\" role=\"group\" aria-label=\"Leitura das vendas de Follow\">\n        <button type=\"button\" data-l=\"B\" aria-pressed=\"true\">0,01 = 1 venda<\/button>\n        <button type=\"button\" data-l=\"A\" aria-pressed=\"false\">Como exibido na planilha (0,01 = 0)<\/button>\n      <\/div>\n      <span class=\"sub\" id=\"leituraInfo\"><\/span>\n    <\/div>\n  <\/details>\n  <\/section>\n  <div id=\"aba-mes\" role=\"tabpanel\" aria-labelledby=\"tab-mes\" hidden>\n    <section>\n      <div class=\"sec-head\"><h2>Maio a setembro<\/h2><span class=\"sub\">meses fechados<\/span><\/div>\n      <div class=\"kpis\" id=\"mes-kpis\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Outubro em andamento<\/h2><span class=\"sub\">01 a 31/10<\/span><\/div>\n      <div class=\"kpis\" id=\"mes-kpis-out\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparativo mensal<\/h2><span class=\"sub\">indicador ao lado de cada valor = distância da média mensal do período<\/span><\/div>\n      <div class=\"tabela-box\"><table id=\"mes-tabela\"><\/table><\/div>\n      <div class=\"legenda\">\n        <span><span class=\"chip acima\">+12%<\/span> acima da média<\/span>\n        <span><span class=\"chip perto\">−4%<\/span> próximo da média (até ±10%)<\/span>\n        <span><span class=\"chip abaixo\">−25%<\/span> abaixo da média<\/span>\n      <\/div>\n      <p class=\"nota\">Média mensal = média simples dos meses fechados (maio a setembro); outubro, em andamento, não entra na média nem no total. Total do período = soma para reuniões, vendas e faturamento; conversão e ticket do total são calculados sobre os somatórios. Vendas de Follow começaram em setembro; com só um mês fechado, ainda não há média para comparação.<\/p>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparação com a média mensal<\/h2><span class=\"sub\">a linha tracejada marca a média<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\"><div class=\"seg\" role=\"group\" aria-label=\"Métrica\" id=\"mes-seg\"><\/div><div class=\"ref\" id=\"mes-ref\"><\/div><\/div>\n        <div class=\"barras\" id=\"mes-barras\"><\/div>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Detalhamento mensal<\/h2><\/div>\n      <div class=\"ind-top\"><label for=\"mes-sel\" class=\"sub\">Mês<\/label><select id=\"mes-sel\"><\/select><\/div>\n      <div class=\"ind-grid\" id=\"mes-grid\"><\/div>\n      <p class=\"compl\" id=\"mes-compl\"><\/p>\n    <\/section>\n  <\/div>\n\n<\/main>\n<footer>Valores recalculados a partir das linhas diárias; dias sem preenchimento considerados como zero. Vendas = coluna VENDAS; Vendas de Follow = coluna VENDA FOLLOW; leads enviados para Follow (coluna FOLLOW) aparecem só como dado complementar.<\/footer>\n\n<script>\nconst MESES = [{\"nome\": \"Maio\", \"ag\": 1083, \"real\": 608, \"vendas\": 117, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 302599.15}, {\"nome\": \"Junho\", \"ag\": 1093, \"real\": 625, \"vendas\": 140, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 385894.26}, {\"nome\": \"Julho\", \"ag\": 982, \"real\": 588, \"vendas\": 137, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 384660.12}, {\"nome\": \"Agosto\", \"ag\": 1126, \"real\": 755, \"vendas\": 118, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 347698.84}, {\"nome\": \"Setembro\", \"ag\": 1023, \"real\": 634, \"vendas\": 111, \"follow\": 108, \"vfA\": 46, \"vfB\": 57, \"fat\": 290949.71}, {\"nome\": \"Outubro\", \"parcial\": true, \"ag\": 1090, \"real\": 526, \"vendas\": 117, \"follow\": 118, \"vfA\": 59, \"vfB\": 59, \"fat\": 354096.68}];\nconst CLOSERS = {\"Setembro\": [{\"nome\": \"Alvaro\", \"ag\": 20, \"real\": 13, \"vendas\": 0, \"follow\": 2, \"vfA\": 0, \"vfB\": 0, \"fat\": 0}, {\"nome\": \"Eduardo\", \"ag\": 77, \"real\": 41, \"vendas\": 14, \"follow\": 21, \"vfA\": 5, \"vfB\": 8, \"fat\": 47918.11}, {\"nome\": \"Larissa\", \"ag\": 88, \"real\": 63, \"vendas\": 9, \"follow\": 3, \"vfA\": 2, \"vfB\": 2, \"fat\": 26180.66}, {\"nome\": \"Leandro Portuga\", \"ag\": 98, \"real\": 58, \"vendas\": 18, \"follow\": 4, \"vfA\": 13, \"vfB\": 13, \"fat\": 49028.94}, {\"nome\": \"Luigi\", \"ag\": 154, \"real\": 88, \"vendas\": 11, \"follow\": 28, \"vfA\": 6, \"vfB\": 6, \"fat\": 17930.55}, {\"nome\": \"Misael\", \"ag\": 85, \"real\": 53, \"vendas\": 5, \"follow\": 0, \"vfA\": 1, \"vfB\": 5, \"fat\": 14478.4}, {\"nome\": \"Paulo\", \"ag\": 160, \"real\": 102, \"vendas\": 10, \"follow\": 7, \"vfA\": 0, \"vfB\": 0, \"fat\": 29337.11}, {\"nome\": \"Rodrigo\", \"ag\": 211, \"real\": 136, \"vendas\": 13, \"follow\": 34, \"vfA\": 0, \"vfB\": 7, \"fat\": 42900.42}, {\"nome\": \"Túlio\", \"ag\": 130, \"real\": 80, \"vendas\": 27, \"follow\": 9, \"vfA\": 16, \"vfB\": 16, \"fat\": 58875.59}], \"Outubro\": [{\"nome\": \"Alvaro\", \"ag\": 102, \"real\": 38, \"vendas\": 4, \"follow\": 5, \"vfA\": 1, \"vfB\": 1, \"fat\": 11952.0}, {\"nome\": \"Eduardo\", \"ag\": 104, \"real\": 50, \"vendas\": 17, \"follow\": 24, \"vfA\": 7, \"vfB\": 7, \"fat\": 57621.37}, {\"nome\": \"Larissa\", \"ag\": 105, \"real\": 54, \"vendas\": 16, \"follow\": 2, \"vfA\": 5, \"vfB\": 5, \"fat\": 53082.38}, {\"nome\": \"Leandro Portuga\", \"ag\": 188, \"real\": 109, \"vendas\": 31, \"follow\": 33, \"vfA\": 20, \"vfB\": 20, \"fat\": 87908.72}, {\"nome\": \"Luigi\", \"ag\": 191, \"real\": 92, \"vendas\": 18, \"follow\": 26, \"vfA\": 9, \"vfB\": 9, \"fat\": 49357.63}, {\"nome\": \"Paulo\", \"ag\": 176, \"real\": 72, \"vendas\": 12, \"follow\": 10, \"vfA\": 11, \"vfB\": 11, \"fat\": 41880.83}, {\"nome\": \"Rodrigo\", \"ag\": 224, \"real\": 111, \"vendas\": 19, \"follow\": 18, \"vfA\": 6, \"vfB\": 6, \"fat\": 46554.62}]};\nconst AVISOS = {\n  Setembro: '<strong>Base: abas individuais de setembro (versão anterior da planilha).<\/strong> Somam 107 vendas, contra 111 no consolidado do mês — diferença de 4 vendas em 24/09, ainda não atribuída a nenhum closer. Faturamento: 9 closers com aba.',\n  Outubro: '<strong>Mês em andamento: reuniões, vendas e faturamento de 01 a 31/10.<\/strong> 7 closers (Misael e Túlio desconsiderados); faturamento soma só os 7 closers com aba.'\n};\nconst st = { leitura:'B' };\n\nconst fmtInt = n => n.toLocaleString('pt-BR',{maximumFractionDigits:0});\nconst fmtDec = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});\nconst fmtR = n => 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst fmtPct = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';\n\nconst METRICAS = [\n  {k:'ag',     nome:'Reuniões agendadas', curto:'Agendadas',  fmt:fmtInt, mfmt:fmtDec},\n  {k:'real',   nome:'Reuniões realizadas',curto:'Realizadas', fmt:fmtInt, mfmt:fmtDec},\n  {k:'vendas', nome:'Vendas realizadas',  curto:'Vendas',     fmt:fmtInt, mfmt:fmtDec},\n  {k:'conv',   nome:'Taxa de conversão',  curto:'Conversão',  fmt:fmtPct, mfmt:fmtPct, taxa:true},\n  {k:'fat',    nome:'Faturamento',        curto:'Faturamento',fmt:fmtR,   mfmt:fmtR},\n  {k:'ticket', nome:'Ticket médio',       curto:'Ticket médio', fmt:fmtR, mfmt:fmtR, taxa:true},\n  {k:'vf',     nome:'Vendas de Follow',   curto:'Vendas Follow', fmt:fmtInt, mfmt:fmtDec},\n  {k:'pvf',    nome:'% de vendas de Follow', curto:'% Follow', fmt:fmtPct, mfmt:fmtPct, taxa:true},\n];\nconst GRAF = [['vendas','Vendas'],['conv','Conversão'],['fat','Faturamento'],['ticket','Ticket médio'],['real','Reuniões realizadas']];\n\nfunction enrich(r){\n  const vf = r.vfA===null ? null : (st.leitura==='A' ? r.vfA : r.vfB);\n  return {...r, vf,\n    conv: r.real ? r.vendas/r.real*100 : null,\n    ticket: (r.fat!==null && r.vendas && !r.semTicket) ? r.fat/r.vendas : null,\n    pvf: (vf!==null && r.vendas) ? vf/r.vendas*100 : null};\n}\nfunction calc(rows){\n  const cl = rows.map(enrich);\n  const base = cl.filter(c=>!c.parcial);\n  const media={}, n={};\n  METRICAS.forEach(m=>{\n    const vals = base.map(c=>c[m.k]).filter(v=>v!==null);\n    n[m.k]=vals.length;\n    media[m.k] = vals.length>1 ? vals.reduce((a,b)=>a+b,0)/vals.length : null;\n  });\n  return {cl, media, n, t: totais(base)};\n}\nfunction totais(rows){\n  const t={ag:0,real:0,vendas:0,fat:0,vf:0,follow:0,vendasF:0,semFat:false};\n  rows.forEach(c=>{['ag','real','vendas'].forEach(k=>t[k]+=c[k]); if(c.fat===null) t.semFat=true; else t.fat+=c.fat; if(c.semTicket) t.semTicket=true;\n    if(c.vf!==null){t.vf+=c.vf;t.follow+=c.follow;t.vendasF+=c.vendas;}});\n  t.conv=t.real? t.vendas/t.real*100 : null;\n  if(t.semFat){t.fat=null;t.ticket=null;} else t.ticket=(t.vendas && !t.semTicket)? t.fat/t.vendas : null;\n  t.pvf=t.vendasF? t.vf/t.vendasF*100 : null;\n  return t;\n}\n\nfunction chip(v, m){\n  if(v===null || m===null || !m) return '';\n  const d=v/m-1, r=Math.round(d*100);\n  const cls = Math.abs(d)<=0.10 ? 'perto' : (r>0?'acima':'abaixo');\n  return `<span class=\"chip ${cls}\">${(r>0?'+':r<0?'−':'')+Math.abs(r)}%<\/span>`;\n}\n// mês parcial: só taxas são comparáveis com a média de meses fechados\nconst chipRow = (c,m,med) => (c.parcial && !m.taxa) ? '' : chip(c[m.k],med);\nconst nd = '<span class=\"sub\">sem dado<\/span>';\nfunction kpiHTML(cards){ return cards.map(([r,v,d,dest])=>`<div class=\"kpi${dest?' dest':''}\"><div class=\"rot\">${r}<\/div><div class=\"val\">${v}<\/div>${d?`<div class=\"det\">${d}<\/div>`:''}<\/div>`).join(''); }\nconst opt = (v,f) => v===null ? '—' : f(v);\n\nconst VIEWS = {\n  mes: {\n    rows: ()=>MESES, rotulo:'Mês', mediaLbl:'MÉDIA MENSAL', totalLbl:'TOTAL MAI–SET', mediaRef:'Média mensal (mai–set)',\n    sel: 'Setembro', metrica:'vendas',\n    label: c => c.parcial ? `${c.nome} <span class=\"sub\">(até 31/10)<\/span>` : c.nome,\n    kpis(D){ const t=D.t, nf=MESES.filter(m=>!m.parcial).length; return [\n      ['Reuniões agendadas', fmtInt(t.ag), `média de ${fmtDec(t.ag/nf)} por mês`],\n      ['Reuniões realizadas', fmtInt(t.real), `${fmtPct(t.real/t.ag*100)} das agendadas`],\n      ['Vendas realizadas', fmtInt(t.vendas), `média de ${fmtDec(t.vendas/nf)} por mês`],\n      ['Taxa de conversão', fmtPct(t.conv), 'vendas ÷ reuniões realizadas', true],\n      ['Faturamento', fmtR(t.fat), `média de ${fmtR(t.fat/nf)} por mês`, true],\n      ['Ticket médio', fmtR(t.ticket), 'faturamento ÷ vendas'],\n      ['Vendas de Follow', fmtInt(t.vf), `acompanhamento desde setembro · ${fmtInt(t.follow)} leads enviados para Follow`],\n      ['% de vendas de Follow', fmtPct(t.pvf), `sobre ${t.vendasF} vendas de setembro`],\n    ];},\n    nMedia(){ return ''; },\n    semMedia: 'sem média de comparação ainda',\n  },\n  closer: {\n    rows: ()=>CLOSERS[VIEWS.closer.mes], rotulo:'Closer', mediaLbl:'MÉDIA DOS CLOSERS', totalLbl:'TOTAL DO TIME', mediaRef:'Média dos closers',\n    mes:'Outubro', sel: null, metrica:'vendas',\n    label: c => c.nome,\n    kpis(D){ const t=D.t, nc=D.cl.length; return [\n      ['Reuniões agendadas', fmtInt(t.ag), ''],\n      ['Reuniões realizadas', fmtInt(t.real), `${fmtPct(t.real/t.ag*100)} das agendadas`],\n      ['Vendas realizadas', fmtInt(t.vendas), 'soma das abas individuais'],\n      ['Taxa de conversão', opt(t.conv,fmtPct), 'vendas ÷ reuniões realizadas', true],\n      ['Faturamento', t.fat===null?'Sem dado':fmtR(t.fat), t.fat===null?'aguardando dashboard financeiro de outubro':(t.semTicket?`${nc} closers com aba · só até 06/10`:`${nc} closers com aba`), true],\n      ['Ticket médio', t st s=[0,0,0,0,0,0,0]; vs.forEach(v=>v.forEach((x,i)=>s[i]+=x)); s[6]=Math.round(s[6]*100)/100; return s; }\nconst COLD = [['ag','Agendadas',fmtInt],['real','Realizadas',fmtInt],['vendas','Vendas',fmtInt],['conv','Conversão',fmtPct],['fat','Faturamento',fmtR],['ticket','Ticket médio',fmtR],['vf','Vendas Follow',fmtInt],['pvf','% Follow',fmtPct],['follow','Leads p/ Follow',fmtInt]];\nconst cel = (f,v) => v===null ? '<span class=\"sub\">—<\/span>' : f(v);\nfunction semanasDoMes(M){\n  // Semanas de segunda a domingo, recortadas aos dias com dados do mês\n  const ws=[]; let cur=null;\n  for(let d=1; d<=M.ult; d++){\n    const wd=new Date(M.ano,M.mes-1,d).getDay();\n    if(!cur || wd===1){ cur={ini:d,fim:d}; ws.push(cur); } else cur.fim=d;\n  }\n  ws.forEach(w=>{\n    const iniWd=new Date(M.ano,M.mes-1,w.ini).getDay(), fimWd=new Date(M.ano,M.mes-1,w.fim).getDay();\n    w.parcial = !(iniWd===1 && fimWd===0);\n    const andamento = w.fim===M.ult && fimWd!==0 ? ' (em andamento)' : '';\n    w.label = (w.ini===w.fim ? `${ddmm(M,w.ini)} · ${dow(M,w.ini)}` : `${ddmm(M,w.ini)} a ${ddmm(M,w.fim)}` + (w.parcial ? ` · ${dow(M,w.ini)} a ${dow(M,w.fim)}` : ' · seg a dom')) + andamento;\n  });\n  return ws;\n}\nfunction renderDiario(){\n  const mes = VIEWS.closer.mes, M = DIARIO[mes]; if(!M) return;\n  const nomes = Object.keys(M.d).sort((a,b)=>a.localeCompare(b,'pt-BR'));\n  const ws = semanasDoMes(M);\n  if(DS.mes!==mes){ DS.mes=mes; DS.dia=M.ult; DS.semana=ws.length-1; DS.pde=1; DS.pate=M.ult; DS.closer=nomes[0]; DS.de=1; DS.ate=M.ult; }\n  document.querySelectorAll('#dia-modo button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.modo===DS.modo));\n  const dias = Array.from({length:M.ult},(_,i)=>i+1);\n  const optDia = sel => dias.map(d=>`<option value=\"${d}\"${d===sel?' selected':''}>${ddmm(M,d)} · ${dow(M,d)}<\/option>`).join('');\n  const optSem = ws.map((w,i)=>`<option value=\"${i}\"${i===DS.semana?' selected':''}>${w.label}<\/option>`).join('');\n  const F = document.getElementById('dia-filtros');\n  if(DS.modo==='dia'){\n    const rec = `<label>Recorte<select id=\"f-recorte\"><option value=\"dia\"${DS.recorte==='dia'?' selected':''}>Um dia<\/option><option value=\"semana\"${DS.recorte==='semana'?' selected':''}>Semana (seg a dom)<\/option><option value=\"periodo\"${DS.recorte==='periodo'?' selected':''}>Período personalizado<\/option><\/select><\/label>`;\n    let extra='';\n    if(DS.recorte==='dia') extra = `<label>Dia<select id=\"f-dia\">${optDia(DS.dia)}<\/select><\/label>`;\n    if(DS.recorte==='semana') extra = `<label>Semana<select id=\"f-semana\">${optSem}<\/select><\/label>`;\n    if(DS.recorte==='periodo') extra = `<label>De<select id=\"f-pde\">${optDia(DS.pde)}<\/select><\/label><label>Até<select id=\"f-pate\">${optDia(DS.pate)}<\/select><\/label>`;\n    F.innerHTML = rec + extra;\n  } else {\n    F.innerHTML = `<label>Closer<select id=\"f-closer\"><option value=\"__time\"${DS.closer==='__time'?' selected':''}>Time (todos os closers)<\/option>${nomes.map(n=>`<option${n===DS.closer?' selected':''}>${n}<\/option>`).join('')}<\/select><\/label>\n      <label>Agrupar por<select id=\"f-agrup\"><option value=\"dia\"${DS.agrup==='dia'?' selected':''}>Dia<\/option><option value=\"semana\"${DS.agrup==='semana'?' selected':''}>Semana (seg a dom)<\/option><\/select><\/label>\n      <label>De<select id=\"f-de\">${optDia(DS.de)}<\/select><\/label><label>Até<select id=\"f-ate\">${optDia(DS.ate)}<\/select><\/label>`;\n  }\n  const seta = k => DS.sort.k===k ? (DS.sort.dir>0?' ↑':' ↓') : '';\n  const ariaS = k => DS.sort.k===k ? ` aria-sort=\"${DS.sort.dir>0?'ascending':'descending'}\"` : '';\n  const head = (c1) => `<thead><tr><th${ariaS('__lbl')}><button type=\"button\" class=\"ord\" data-k=\"__lbl\">${c1}${seta('__lbl')}<\/button><\/th>${COLD.map(c=>`<th${ariaS(c[0])}><button type=\"button\" class=\"ord\" data-k=\"${c[0]}\">${c[1]}${seta(c[0])}<\/button><\/th>`).join('')}<\/tr><\/thead>`;\n  const ordena = itens => { // itens: [rótulo, valores, ordem natural]\n    const k=DS.sort.k, dir=DS.sort.dir; if(!k) return itens;\n    return itens.slice().sort((a,b)=>{\n      if(k==='__lbl') return dir*(a[2]-b[2]);\n      const va=linhaDia(a[1])[k], vb=linhaDia(b[1])[k];\n      if(va===null && vb===null) return a[2]-b[2]; if(va===null) return 1; if(vb===null) return -1;\n      return va===vb ? a[2]-b[2] : dir*(va-vb);\n    });\n  };\n  const row = (lbl, v, cls) => { const L=linhaDia(v), z=!v.some(x=>x); return `<tr class=\"${cls||''}${z&&!cls?' zero':''}\"><td>${lbl}<\/td>${COLD.map(c=>`<td>${cel(c[2],L[c[0]])}<\/td>`).join('')}<\/tr>`; };\n  const vazio = [0,0,0,0,0,0,0];\n  const somaCloser = (n, a, b) => somaDia(dias.filter(d=>d>=a && d<=b).map(d=>M.d[n][String(d)]||vazio));\n  let html='';\n  if(DS.modo==='dia'){\n    let a,b,tit;\n    if(DS.recorte==='dia'){ a=b=DS.dia; tit=ddmm(M,a); }\n    else if(DS.recorte==='semana'){ const w=ws[Math.min(DS.semana,ws.length-1)]; a=w.ini; b=w.fim; tit=`${ddmm(M,a)} a ${ddmm(M,b)}`; }\n    else { a=Math.min(DS.pde,DS.pate); b=Math.max(DS.pde,DS.pate); tit = a===b ? ddmm(M,a) : `${ddmm(M,a)} a ${ddmm(M,b)}`; }\n    const vs = nomes.map(n=>somaCloser(n,a,b));\n    html = head('Closer') + '<tbody>' + ordena(nomes.map((n,i)=>[n,vs[i],i])).map(([l,v])=>row(l,v)).join('') + row(`TOTAL ${tit}`, somaDia(vs), 'total') + '<\/tbody>';\n  } else {\n    const de=Math.min(DS.de,DS.ate), ate=Math.max(DS.de,DS.ate);\n    const sel = (a,b) => DS.closer==='__time' ? somaDia(nomes.map(n=>somaCloser(n,a,b))) : somaCloser(DS.closer,a,b);\n    let linhas;\n    if(DS.agrup==='semana'){\n      linhas = ws.filter(w=>w.fim>=de && w.ini<=ate).map(w=>{ const a=Math.max(w.ini,de), b=Math.min(w.fim,ate);\n        return [a===b ? `${ddmm(M,a)}<span class=\"dow\">${dow(M,a)}<\/span>` : `${ddmm(M,a)} a ${ddmm(M,b)}<span class=\"dow\">${dow(M,a)} a ${dow(M,b)}<\/span>`, sel(a,b)]; });\n    } else {\n      linhas = dias.filter(d=>d>=de && d<=ate).map(d=>[`${ddmm(M,d)}<span class=\"dow\">${dow(M, time de SDR e pelo TYPEBOT<\/small><\/div>\n  <\/div>\n  <div class=\"actions\">\n    <input type=\"file\" id=\"fileIn\" accept=\".xlsx,.xls\" hidden>\n    <button class=\"btn\" id=\"btnFile\" data-tip=\"Carregue uma planilha com o mesmo layout (Data, SDR, Agendamentos, Reuniões Passadas, Acontecidas, No-show). Nada é enviado para fora do navegador.\">Atualizar base (.xlsx)<\/button>\n  <\/div>\n<\/div><\/div>\n\n<div class=\"filters\"><div class=\"wrap\">\n  <div class=\"fg\">\n    <label for=\"fPeriod\">Período<\/label>\n    <select id=\"fPeriod\">\n      <option value=\"hoje\">Hoje<\/option>\n      <option value=\"ontem\">Ontem (último dia lançado)<\/option>\n      <option value=\"semana\">Esta semana<\/option>\n      <option value=\"semana_passada\">Semana passada<\/option>\n      <option value=\"mes\">Este mês<\/option>\n      <option value=\"mes_passado\">Mês passado<\/option>\n      <option value=\"d7\">Últimos 7 dias<\/option>\n      <option value=\"d30\">Últimos 30 dias<\/option>\n      <option value=\"custom\">Personalizado<\/option>\n    <\/select>\n  <\/div>\n  <div class=\"fg\">\n    <span>Intervalo<\/span>\n    <div class=\"range\"><input type=\"date\" id=\"fStart\" aria-label=\"Data inicial\"><span>até<\/span><input type=\"date\" id=\"fEnd\" aria-label=\"Data final\"><\/div>\n  <\/div>\n  <div class=\"fg\">\n    <label for=\"fSdr\">SDR<\/label>\n    <select id=\"fSdr\"><\/select>\n  <\/div>\n  <div class=\"fg\">\n    <span>Origem<\/span>\n    <div class=\"seg\" role=\"group\" aria-label=\"Origem\" id=\"fOrigem\">\n      <button data-v=\"ALL\" aria-pressed=\"true\">Todos<\/button>\n      <button data-v=\"HUM\" aria-pressed=\"false\">SDRs humanos<\/button>\n      <button data-v=\"TB\" aria-pressed=\"false\" class=\"is-bot\">TYPEBOT<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"active-filter\" id=\"chip\"><span id=\"chipTxt\"><\/span><button id=\"chipX\" aria-label=\"Limpar seleção de SDR\">×<\/button><\/div>\n  <div class=\"meta\" id=\"metaTxt\"><\/div>\n<\/div><\/div>\n\n<main class=\"wrap\">\n\n  <section class=\"sec\" id=\"s4\">\n    <header class=\"sec-h\"><h2>Performance individual<\/h2><p>Quem está performando? Clique em um SDR para filtrar o painel.<\/p><\/header>\n    <div class=\"panel\"><div class=\"tbl-wrap\"><table id=\"rank\"><thead><\/thead><tbody><\/tbody><\/table><\/div>\n    <div class=\"scope\" id=\"rankScope\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s1\">\n    <header class=\"sec-h\"><h2>Visão geral<\/h2><p id=\"ovSub\">Como estamos no período?<\/p><\/header>\n    <div class=\"kpis\" id=\"kpis\"><\/div>\n    <div class=\"goal-note\" id=\"updNote\" style=\"margin-top:12px\"><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s-week\">\n    <header class=\"sec-h\"><h2>Performance da semana<\/h2><p id=\"wkSub\"><\/p><\/header>\n    <div class=\"panel\">\n      <div class=\"tbl-wrap\"><table class=\"wk-table\" id=\"wkTable\"><\/table><\/div>\n      <div class=\"goal-note\" id=\"goal\"><\/div>\n      <div class=\"scope\" id=\"wkScope\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s2\">\n    <header class=\"sec-h\"><h2>Funil de reuniões<\/h2><p>Do agendamento à agenda do Closer e ao resultado<\/p><\/header>\n    <div class=\"panel\"><div class=\"funnel\" id=\"funnel\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s3\">\n    <header class=\"sec-h\"><h2>Evolução<\/h2><p>Como os números se movem ao longo do tempo?<\/p>\n      <div class=\"right seg\" role=\"group\" aria-label=\"Visualização\" id=\"fEvoView\">\n        <button data-v=\"tabela\" aria-pressed=\"true\">Quadro<\/button>\n        <button data-v=\"grafico\" aria-pressed=\"false\">Gráfico<\/button>\n      <\/div>\n      <div class=\"seg\" role=\"group\" aria-label=\"Agrupamento\" id=\"fGran\">\n        <button data-v=\"dia\" aria-pressed=\"true\">Dia<\/button>\n        <button data-v=\"semana\" aria-pressed=\"false\">Semana<\/button>\n        <button data-v=\"mes\" aria-pressed=\"false\">Mês<\/button>\n      <\/div>\n    <\/header>\n    <div class=\"panel\"><div class=\"tbl-wrap\" id=\"evoTableWrap\"><table class=\"evo-table\" id=\"evoTable\"><\/table><\/div>\n    <div class=\"chart-box\" id=\"evoChartWrap\" hidden><canvas id=\"cEvo\" aria-label=\"Evolução de agendadas, acontecidas e no-show\"><\/canvas><\/div>\n    <div class=\"scope\" id=\"evoScope\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s5\">\n    <header class=\"sec-h\"><h2>TYPEBOT × SDRs<\/h2><p>A automação gera volume, e esse volume vira reunião?<\/p><\/header>\n    <div class=\"panel\">\n      <div class=\"tbl-wrap\"><table class=\"cmp-table\" id=\"cmp\"><\/table><\/div>\n      <div class=\"scope\">Considera apenas o filtro de período, para manter a comparação completa.<\/div>\n    <\/div>\n  <\/section>\n\n  <details class=\"sec ins\" id=\"s7\">\n    <summary><span class=\"ins-t\">Insights<\/span> <span class=\"ins-c\" id=\"insCount\"><\/span><span class=\"ins-hint\">Sinais calculados a partir dos dados filtrados<\/span><\/summary>\n    <ul class=\"insights\" id=\"insights\"><\/ul>\n  <\/details>\n\n  <details class=\"notes\" id=\"notes\">\n    <summary>Regras de cálculo e qualidade da base<\/summary>\n    <div class=\"cols\">\n      <div>\n        <h3>Como os números são calculados<\/h3>\n        <ul>\n          <li><b>Data<\/b>: dia da reunião. <b>Agendadas<\/b>: soma da coluna Agendamentos, ou seja, reuniões marcadas para aquele dia.<\/li>\n          <li><b>Reuniões passadas<\/b>: agendamentos que entraram efetivamente na agenda dos Closers, sem overbooking (coluna Reuniões Passadas). Vale sempre o valor informado na planilha, mesmo quando Acontecidas + No-show da linha é maior (essa soma pode se referir ao total de agendamentos).<\/li>\n          <li><b>Não passadas ao Closer<\/b>: Agendadas − Reuniões passadas, até o último dia com resultado lançado na base. <b>Aguardando registro<\/b>: o mesmo saldo nos dias seguintes, que ainda não tiveram resultado lançado. Nenhum dos dois entra nas taxas.<\/li>\n          <li><b>Repasse<\/b> = Reuniões passadas ÷ agendadas com data já ocorrida.<\/li>\n          <li><b>Comparecimento<\/b> = Acontecidas ÷ Reuniões passadas. <b>No-show %<\/b> = No-show ÷ Reuniões passadas.<\/li>\n          <li><b>Sem status<\/b>: reuniões na agenda do Closer ainda sem marcação de acontecida ou no-show. Ficam no denominador das taxas, como manda a fórmula.<\/li>\n          <li>Células vazias contam como zero. Não há linhas de total na planilha; linhas em branco entre os dias são ignoradas.<\/li>\n          <li>TYPEBOT é identificado pelo valor TYPEBOT na coluna SDR. Todos os outros nomes contam como SDRs humanos.<\/li>\n          <li>Semanas de segunda a domingo, inclusive na comparação semanal e na meta. Os cards do topo comparam com um intervalo anterior de mesmo tamanho, cortado até hoje.<\/li>\n        <\/ul>\n      <\/div>\n      <div>\n        <h3>Conferência com a planilha (base completa)<\/h3>\n        <div class=\"recon\" id=\"recon\"><\/div>\n        <h3 style=\"margin-top:16px\">Pontos de atenção na base<\/h3>\n        <ul id=\"dq\"><\/ul>\n      <\/div>\n    <\/div>\n  <\/details>\n<\/main>\n\n<div id=\"tip\" hidden role=\"tooltip\"><\/div>\n\n<script id=\"calc\">\n/* ===== Dados: exportados de Acompanhamento_HOD.xlsx (aba SDRs Typebot) =====\n   Data = dia da reunião. Agendamentos = reuniões marcadas para aquele dia.\n   Reuniões Passadas = agendamentos que entraram de fato na agenda dos Closers, sem overbooking.\n   Formato de cada linha: [data, SDR, Agendamentos, Reuniões Passadas, Acontecidas, No-show, Não Passadas, Daily check] */\nvar DATA_RAW = [[\"2026-10-01\", \"MICHELLY\", 0, 0, 0, 0, 0, \"SPRINTER\"], [\"2026-10-01\", \"BEATRIZ\", 5, 5, 4, 1, 0, \"FEZ DEPOIS\"], [\"2026-10-01\", \"LEANDRO B.\", 13, 13, 11, 2, 0, \"OK!\"], [\"2026-10-01\", \"VITOR\", 9, 7, 4, 3, 2, \"OK!\"], [\"2026-10-01\", \"Lucas Carioca\", 5, 5, 3, 2, 0, \"OK!\"], [\"2026-10-01\", \"IASMIN\", 8, 7, 5 2\": 8145.96, \"5\": 2496.47, \"6\": 3488.84, \"7\": 23240.13, \"8\": 11273.23, \"9\": 24518.4, \"11\": 3598.44, \"12\": 2244.8, \"13\": 13359.04, \"14\": 18265.93, \"15\": 17791.0, \"16\": 18570.34, \"17\": 2988.0, \"19\": 17798.11, \"20\": 5593.8, \"21\": 23618.01, \"22\": 17017.1, \"23\": 18450.2, \"26\": 16761.54, \"27\": 26904.0, \"28\": 16283.2, \"29\": 23670.32, \"30\": 27555.75, \"31\": 10190.4}}]};\nconst fR = n => 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst fN = n => n.toLocaleString('pt-BR');\nconst fP = n => n===null ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';\nconst fX = n => n===null ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'x';\nconst $ = id => document.getElementById(id);\nconst DOW=['dom','seg','ter','qua','qui','sex','sáb'];\nconst st = { mes: MID.meses.length-1, de:null, ate:null, camp:'__cons' };\n\nconst M = () => MID.meses[st.mes];\nconst dd = (m,d) => String(d).padStart(2,'0')+'/'+String(m.mes).padStart(2,'0');\nconst dow = (m,d) => DOW[new Date(m.ano,m.mes-1,d).getDay()];\nconst diasDisp = m => Object.keys(m.dias).map(Number).sort((a,b)=>a-b);\n\nfunction filtros(){\n  const m=M(), ds=diasDisp(m);\n  if(st.de===null){ st.de=ds[0]; st.ate=ds[ds.length-1]; }\n  const opt = sel => ds.map(d=>`<option value=\"${d}\"${d===sel?' selected':''}>${dd(m,d)}<\/option>`).join('');\n  $('fMes').innerHTML = MID.meses.map((x,i)=>`<option value=\"${i}\"${i===st.mes?' selected':''}>${x.label}<\/option>`).join('');\n  $('fDe').innerHTML = opt(st.de); $('fAte').innerHTML = opt(st.ate);\n  $('fCamp').innerHTML = `<option value=\"__cons\"${st.camp==='__cons'?' selected':''}>Consolidado (todas somadas)<\/option>`+\n    `<option value=\"__todas\"${st.camp==='__todas'?' selected':''}>Todas as campanhas, lado a lado<\/option>`+\n    m.camps.map((c,i)=>`<option value=\"${i}\"${String(i)===st.camp?' selected':''}>${c}<\/option>`).join('');\n}\n\nfunction render(){\n  filtros();\n  const m=M(), de=Math.min(st.de,st.ate), ate=Math.max(st.de,st.ate);\n  const ds = diasDisp(m).filter(d=>d>=de && d<=ate);\n  const ultVenda = Math.max(0,...Object.keys(m.vendas).map(Number));\n  $('periodo').textContent = `${m.label} · ${dd(m,de)} a ${dd(m,ate)}`;\n  $('subCons').textContent = `${ds.length} dias`;\n\n  const tot = ds.reduce((s,d)=>s+m.dias[d].tot,0);\n  const cont = ds.reduce((s,d)=>s+m.dias[d].contatos,0);\n  const pipe = ds.reduce((s,d)=>s+m.dias[d].pipeline,0);\n  const dsR = ds.filter(d=>d<=ultVenda);\n  const invR = dsR.reduce((s,d)=>s+m.dias[d].tot,0), venR = dsR.reduce((s,d)=>s+(m.vendas[d]||0),0);\n  const porCamp = m.camps.map((c,i)=>ds.reduce((s,d)=>s+m.dias[d].c[i],0));\n  const ativas = porCamp.filter(v=>v>0).length;\n\n  $('kInv').textContent = fR(tot);\n  $('kInvDet').textContent = `média de ${fR(tot/(ds.length||1))} por dia`;\n  $('kRoas').textContent = fX(invR ? venR/invR : null);\n  $('kRoasDet').textContent = dsR.length ? `vendas ÷ investimento · ${fR(venR)} em vendas de ${dd(m,dsR[0])} a ${dd(m,dsR[dsR.length-1])}` : 'sem vendas lançadas no período';\n  $('kCont').textContent = fN(cont);\n  $('kContDet').textContent = `média de ${fN(Math.round(cont/(ds.length||1)))} por dia`;\n  $('kPipe').textContent = fN(pipe);\n  $('kPipeDet').textContent = `média de ${fN(Math.round(pipe/(ds.length||1)))} por dia`;\n  $('kConv').textContent = fP(cont ? pipe/cont*100 : null);\n  $('kCamp').textContent = `${ativas} de ${m.camps.length}`;\n  $('kCampDet').textContent = 'com investimento no período';\n\n  // Por campanha\n  $('tCamp').innerHTML = `<thead><tr><th>Campanha<\/th><th>Investimento<\/th><th>% do total<\/th><th>Média por dia<\/th><th>Dias com investimento<\/th><\/tr><\/thead><tbody>`+\n    m.camps.map((c,i)=>{ const v=porCamp[i], n=ds.filter(d=>m.dias[d].c[i]>0).length;\n      return `<tr class=\"${v?'':'zero'}\"><td>${c}<\/td><td>${fR(v)}<\/td><td>${fP(tot?v/tot*100:null)}<\/td><td>${fR(v/(ds.length||1))}<\/td><td>${n} de ${ds.length}<\/td><\/tr>`; }).join('')+\n    `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(tot)}<\/td><td>${fP(tot?100:null)}<\/td><td>${fR(tot/(ds.length||1))}<\/td><td><\/td><\/tr><\/tbody>`;\n\n  // Diário\n  const lbl = d => `${dd(m,d)}<span class=\"dow\">${dow(m,d)}<\/span>`;\n  let h='';\n  if(st.camp==='__cons'){\n    h = `<thead><tr><th>Dia<\/th><th>Investimento<\/th><th>Vendas<\/th><th>ROAS<\/th><th>Contatos<\/th><th>Pipeline<\/th><th>Conversão<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>{ const x=m.dias[d], temV=d<=ultVenda, v=m.vendas[d]||0;\n        return `<tr><td>${lbl(d)}<\/td><td>${fR(x.tot)}<\/td><td>${temV?fR(v):'<span class=\"sub\">—<\/span>'}<\/td><td>${temV&&x.tot?fX(v/x.tot):'<span class=\"sub\">—<\/span>'}<\/td><td>${fN(x.contatos)}<\/td><td>${fN(x.pipeline)}<\/td><td>${fP(x.contatos?x.pipeline/x.contatos*100:null)}<\/td><\/tr>`; }).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(tot)}<\/td><td>${fR(venR)}<\/td><td>${fX(invR?venR/invR:null)}<\/td><td>${fN(cont)}<\/td><td>${fN(pipe)}<\/td><td>${fP(cont?pipe/cont*100:null)}<\/td><\/tr><\/tbody>`;\n  } else if(st.camp==='__todas'){\n    h = `<thead><tr><th>Dia<\/th>${m.camps.map(c=>`<th>${c}<\/th>`).join('')}<th>Total<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>`<tr><td>${lbl(d)}<\/td>${m.dias[d].c.map(v=>`<td>${v?fR(v):'<span class=\"sub\">R$ 0,00<\/span>'}<\/td>`).join('')}<td><strong>${fR(m.dias[d].tot)}<\/strong><\/td><\/tr>`).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td>${porCamp.map(v=>`<td>${fR(v)}<\/td>`).join('')}<td>${fR(tot)}<\/td><\/tr><\/tbody>`;\n  } else {\n    const i=+st.camp, v=porCamp[i];\n    h = `<thead><tr><th>Dia<\/th><th>Investimento · ${m.camps[i]}<\/th><th>% do investimento do dia<\/th><th>Investimento total do dia<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>{ const x=m.dias[d], c=x.c[i];\n        return `<tr class=\"${c?'':'zero'}\"><td>${lbl(d)}<\/td><td>${fR(c)}<\/td><td>${fP(x.tot?c/x.tot*100:null)}<\/td><td>${fR(x.tot)}<\/td><\/tr>`; }).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(v)}<\/td><td>${fP(tot?v/tot*100:null)}<\/td><td>${fR(tot)}<\/td><\/tr><\/tbody>`;\n  }\n  $('tDia').innerHTML = h;\n  $('nota').textContent = `Investimento em mídia = soma das ${m.camps.length} campanhas. Vendas = total vendido do dia no Dashboard comercial, lançado até ${dd(m,ultVenda)}; o ROAS considera só os dias com vendas lançadas. Contatos e pipeline vêm do GHL.`;\n}\n$('fMes').addEventListener('change', e=>{ st.mes=+e.target.value; st.de=null; render(); });\n$('fDe').addEventListener('change', e=>{ st.de=+e.target.value; render(); });\n$('fAte').addEventListener('change', e=>{ st.ate=+e.target.value; render(); });\n$('fCamp').addEventListener('change', e=>{ st.camp=e.target.value; render(); });\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};

const NOMES = {big:'Big numbers', vendas:'Dashboard comercial', closers:'Performance closers', sdr:'Performance SDRs', midia:'Mídia e contatos'};
// Abas que abrem o dashboard publicado (sempre a versão atual, com dados ao vivo),

const LINKS = {
  vendas: 'https://homeofficedigital.github.io/vendas-times/',
};
function mostrar(v){
  if(!NOMES[v]) v='big';
  for(const k in NOMES){
    const f=document.getElementById('f-'+k);
    if(!f) continue;
    if(k===v){
      if(LINKS[k]){ if(!f.getAttribute('src')) f.src = LINKS[k]; }
      else if(!f.srcdoc && DASH[k]) f.srcdoc = DASH[k];
    }
    f.hidden = k!==v;
  }
  document.querySelectorAll('nav a').forEach(a=>{ if(a.dataset.v===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.getElementById('atual').textContent = NOMES[v];
  document.title = 'HOD · ' + NOMES[v];
  document.body.classList.remove('aberto');
}
