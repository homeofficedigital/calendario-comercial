nd;justify-content:space-between}\nh1{font-size:clamp(22px,3.2vw,32px);font-weight:700;line-height:1.1}\n.periodo{font-size:15px;color:#C7D6C1;margin-top:4px}\n.fonte{font-size:12.5px;color:#B9CBB1;text-align:right;max-width:420px}\n\nmain{max-width:1240px;margin:0 auto;padding:20px 20px 64px}\nsection{margin-top:34px}\n.sec-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin-bottom:14px}\nh2{font-size:20px;font-weight:600}\n.sub{font-size:13px;color:var(--tinta-2)}\n\n/* Pontos de atenção */\n.atencao{background:var(--alerta-bg);border:1px solid var(--alerta-borda);border-radius:var(--raio);padding:14px 18px}\n.atencao summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;gap:10px;align-items:center}\n.atencao summary::-webkit-details-marker{display:none}\n.atencao summary::before{content:\"▸\";transition:transform .15s}\n.atencao[open] summary::before{transform:rotate(90deg)}\n.atencao ul{margin:12px 0 4px 20px;font-size:13.5px;display:grid;gap:7px;max-width:95ch}\n.atencao li strong{font-weight:600}\n.leitura{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--alerta-borda);font-size:13.5px}\n.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--card)}\n.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--tinta);padding:7px 12px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--linha)}\n.seg button[aria-pressed=\"true\"]{background:var(--verde);color:#F5F6F2}\n.seg button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px}\n\n/* KPIs */\n.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px 18px 14px}\n.kpi .rot{font-size:13px;color:var(--tinta-2);font-weight:500}\n.kpi .val{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:clamp(24px,2.6vw,32px);font-weight:600;line-height:1.15;margin-top:4px}\n.kpi .det{font-size:12.5px;color:var(--tinta-2);margin-top:4px}\n.kpi.dest{background:var(--verde);border-color:var(--verde)}\n.kpi.dest .rot,.kpi.dest .det{color:#C7D6C1}\n.kpi.dest .val{color:#F5F6F2}\n@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}\n\n/* Tabela */\n.tabela-box{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);overflow-x:auto}\ntable{width:100%;border-collapse:collapse;min-width:1000px;font-size:13.5px}\nth,td{padding:9px 8px;text-align:right;white-space:nowrap}\nth:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--card)}\nthead th:first-child{background:var(--mdf)}\ntr.media td:first-child{background:var(--mdf)}\nthead th{font-size:12.5px;font-weight:600;color:var(--tinta-2);background:var(--mdf);border-bottom:1px solid var(--linha);vertical-align:bottom}\ntbody td{border-bottom:1px solid var(--linha)}\ntbody tr:hover td{background:color-mix(in srgb,var(--mdf) 55%,transparent)}\ntd .n{font-weight:500}\ntd .chip{margin-left:5px}\ntr.media td{background:var(--mdf);font-weight:600;border-top:2px solid var(--verde-3)}\ntr.total td{font-weight:600;color:var(--tinta-2)}\ntr.total td:first-child,tr.media td:first-child{font-size:12.5px;letter-spacing:.02em}\n.nota{font-size:12.5px;color:var(--tinta-2);margin-top:10px;max-width:110ch}\n\n.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;min-width:40px;text-align:center}\n.chip.acima{color:var(--acima);background:var(--acima-bg)}\n.chip.perto{color:var(--perto);background:var(--perto-bg)}\n.chip.abaixo{color:var(--abaixo);background:var(--abaixo-bg)}\n.chip.na{color:var(--tinta-2);background:transparent}\n.legenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--tinta-2);margin-top:10px;align-items:center}\n\n/* Comparação com a média */\n.painel{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:18px 20px}\n.painel-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:16px}\n.ref{font-size:13.5px;color:var(--tinta-2)}\n.ref strong{color:var(--tinta)}\n.barras{display:grid;gap:9px}\n.linha-b{display:grid;grid-template-columns:140px 1fr 210px;gap:14px;align-items:center;font-size:14px}\n.trilho{position:relative;height:20px;background:var(--barra-bg);border-radius:4px}\n.trilho .b{position:absolute;left:0;top:0;bottom:0;background:var(--barra);border-radius:4px;transition:width .35s ease}\n.trilho .m{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--tinta);opacity:.7}\n.linha-b .v{display:flex;justify-content:flex-end;gap:8px;align-items:center}\n.eixo-m{display:grid;grid-template-columns:140px 1fr 210px;gap:14px;font-size:12px;color:var(--tinta-2)}\n.eixo-m .t{position:relative;height:16px}\n.eixo-m .t span{position:absolute;transform:translateX(-50%);white-space:nowrap}\n@media (max-width:640px){\n  .linha-b,.eixo-m{grid-template-columns:86px 1fr;}\n  .linha-b .v{grid-column:2;justify-content:flex-start;margin-top:-4px}\n  .eixo-m>div:last-child{display:none}\n}\n\n/* Individual */\n.ind-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}\nselect{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--card);color:var(--tinta);min-width:220px}\n.ind-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n@media (max-width:860px){.ind-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.tile{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px}\n.tile .rot{font-size:13px;color:var(--tinta-2);font-weight:500}\n.tile .val{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:26px;font-weight:600;line-height:1.2;margin-top:2px}\n.tile .cmp{font-size:12.5px;color:var(--tinta-2);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.mini{margin-top:10px;display:grid;gap:4px}\n.mini div{height:6px;border-radius:3px}\n.mini .c{background:var(--barra)}\n.mini .md{background:var(--tinta-2);opacity:.45}\n.compl{margin-top:12px;font-size:13.5px;color:var(--tinta-2)}\n.compl strong{color:var(--tinta)}\nfooter{max-width:1180px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--tinta-2)}\n\n.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-top:26px;flex-wrap:wrap}\n.abas button{font:inherit;font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:17px;font-weight:600;border:0;background:transparent;color:var(--tinta-2);padding:10px 16px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}\n.abas button[aria-selected=\"true\"]{color:var(--tinta);border-bottom-color:var(--verde-3)}\n.abas button:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px}\n.aviso-sec{font-size:13px;color:var(--tinta-2);background:var(--card);border:1px solid var(--linha);border-left:3px solid var(--alerta-borda);border-radius:6px;padding:10px 14px;margin-top:22px;max-width:110ch}\n.aviso-sec strong{color:var(--tinta)}\n[hidden]{display:none!important}\n\n.filtros-dia{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}\n.filtros-dia label{display:grid;gap:4px;font-size:12.5px;color:var(--tinta-2)}\n.filtros-dia select{min-width:0;font-size:14px;padding:7px 10px}\ntable.tab-dia{min-width:880px}\ntable.tab-dia button.ord{font:inherit;font-weight:600;color:inherit;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}\ntable.tab-dia button.ord:hover{color:var(--tinta)}\ntable.tab-dia th[aria-sort] button.ord{color:var(--tinta)}\ntable.tab-dia button.ord:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px;border-radius:3px}\ntable.tab-dia tbody tr.zero td{color:var(--tinta-2)}\ntable.tab-dia .dow{font-size:12px;color:var(--tinta-2);margin-left:6px}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div class=\"wrap\">\n    <div>\n      <h1>Performance Comercial — Closers HOD<\/h1>\n      <div class=\"periodo\">Maio a Outubro de 2026 · outubro em andamento, dados até 28/10<\/div>\n    <\/div>\n    <div class=\"fonte\">Reuniões e vendas: abas GERAL MAI a OUT e abas individuais de setembro e outubro. Faturamento: dashboard financeiro HOD.<\/div>\n  <\/div>\n<\/header>\n\n<main>\n\n  <div class=\"abas\" role=\"tablist\" style=\"margin-top:4px\">\n    <button type=\"button\" role=\"tab\" aria-selected=\"true\" data-aba=\"closer\" id=\"tab-closer\">Closers · setembro e outubro<\/button>\n    <button type=\"button\" role=\"tab\" aria-selected=\"false\" data-aba=\"mes\" id=\"tab-mes\">Time · maio a outubro<\/button>\n  <\/div>\n\n  <div id=\"aba-closer\" role=\"tabpanel\" aria-labelledby=\"tab-closer\">\n    <div class=\"ind-top\" style=\"margin-top:22px\"><label for=\"closer-mes\" class=\"sub\">Mês<\/label><div class=\"seg\" role=\"group\" aria-label=\"Mês\" id=\"closer-mes\"><button type=\"button\" data-mes=\"Setembro\" aria-pressed=\"false\">Setembro<\/button><button type=\"button\" data-mes=\"Outubro\" aria-pressed=\"true\">Outubro (até 28/10)<\/button><\/div><\/div>\n    <p class=\"aviso-sec\" id=\"closer-aviso\"><\/p>\n    <section>\n      <div class=\"sec-head\"><h2>Dados diários<\/h2><span class=\"sub\">números por dia, conforme o filtro<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\" style=\"align-items:flex-end\">\n          <div class=\"seg\" role=\"group\" aria-label=\"Tipo de visão\" id=\"dia-modo\">\n            <button type=\"button\" data-modo=\"dia\" aria-pressed=\"true\">Closers lado a lado<\/button>\n            <button type=\"button\" data-modo=\"closer\" aria-pressed=\"false\">Um closer ao longo dos dias<\/button>\n          <\/div>\n          <div class=\"filtros-dia\" id=\"dia-filtros\"><\/div>\n        <\/div>\n        <div class=\"tabela-box\" style=\"border:0\"><table id=\"dia-tabela\" class=\"tab-dia\"><\/table><\/div>\n        <p class=\"nota\" id=\"dia-nota\"><\/p>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2 id=\"closer-titulo\">Visão geral do time<\/h2><span class=\"sub\" id=\"closer-sub\"><\/span><\/div>\n      <div class=\"kpis\" id=\"closer-kpis\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparativo dos closers<\/h2><span class=\"sub\">ordem alfabética · indicador = distância da média dos closers<\/span><\/div>\n      <div class=\"tabela-box\"><table id=\"closer-tabela\"><\/table><\/div>\n      <div class=\"legenda\">\n        <span><span class=\"chip acima\">+12%<\/span> acima da média<\/span>\n        <span><span class=\"chip perto\">−4%<\/span> próximo da média (até ±10%)<\/span>\n        <span><span class=\"chip abaixo\">−25%<\/span> abaixo da média<\/span>\n      <\/div>\n      <p class=\"nota\">Média dos closers = média simples dos resultados individuais do mês selecionado (ticket médio e % Follow só entre closers com vendas). Total do time = soma para reuniões, vendas, faturamento e Follow; conversão, ticket e % Follow do total são calculados sobre os somatórios.<\/p>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparação com a média dos closers<\/h2><span class=\"sub\">a linha tracejada marca a média<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\"><div class=\"seg\" role=\"group\" aria-label=\"Métrica\" id=\"closer-seg\"><\/div><div class=\"ref\" id=\"closer-ref\"><\/div><\/div>\n        <div class=\"barras\" id=\"closer-barras\"><\/div>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Detalhamento individual<\/h2><\/div>\n      <div class=\"ind-top\"><label for=\"closer-sel\" class=\"sub\">Closer<\/label><select id=\"closer-sel\"><\/select><\/div>\n      <div class=\"ind-grid\" id=\"closer-grid\"><\/div>\n      <p class=\"compl\" id=\"closer-compl\"><\/p>\n    <\/section>\n  <\/div>\n  <section>\n  <details class=\"atencao\">\n    <summary>Pontos de atenção nos dados (clique para expandir)<\/summary>\n    <ul>\n      <li><strong>Outubro é mês em andamento<\/strong>, com reuniões, vendas e faturamento lançados de 01 a 28/10. Fica fora da média mensal e do total do período; volumes (reuniões, vendas, faturamento) não são comparados com meses fechados, só a taxa de conversão e o % de Follow.<\/li>\n      <li><strong>Túlio tem R$ 1.218,86 de faturamento em outubro<\/strong> (05, 07, 11 e 19/10), mas a aba dele foi desconsiderada. Fica fora da visão por closer (R$ 292.037,08) e dentro da visão mensal, que soma todos os closers da aba Vendas (R$ 293.255,94). Por isso o ticket médio de outubro é R$ 2.891,46 na visão por closer e R$ 2.903,52 na visão mensal.<\/li>\n      <li><strong>Closers em outubro:<\/strong> abas de Misael e Túlio desconsideradas, conforme orientação; 7 closers na média. Dias sem preenchimento contados como zero; quando o subtotal da semana diverge dos dias, valem os dias somados. Último dia lançado varia por closer: Alvaro até 22/10; Eduardo e Larissa até 27/10; os demais até 28/10. Eduardo tem R$ 294,00 de faturamento (recorrência) em 20/10 sem venda lançada na aba nesse dia. Fonte única desde 15/10: planilha Acompanhamento_HOD.xlsx (abas por closer e aba Vendas).<\/li>\n      <li><strong>Subtotais semanais desatualizados nas abas de outubro.<\/strong> Os subtotais das semanas a partir de 12/10 e a linha de total do mês não incluem todos os dias lançados. O dashboard soma os dias: 958 agendadas, 459 realizadas, 101 vendas, 109 leads em Follow e 54 vendas de Follow. A aba Closers Geral Outubro bate com a soma das abas em todos os dias, exceto nas vendas de Follow de 19/10 (2 na aba geral, 1 nas abas individuais); valem as abas individuais.<\/li>\n      <li><strong>Setembro: 111 vendas no consolidado × 107 nas abas por closer.<\/strong> A diferença está em 24/09 (8 vendas na GERAL SET, 4 nas abas individuais), ainda não atribuída a nenhum closer. A visão por closer de setembro usa as abas individuais da versão anterior.<\/li>\n      <li><strong>Coluna H com 0,01 e 0,02 em setembro:<\/strong> leitura padrão “0,01 = 1 venda”, com base na correção feita nos lançamentos de Eduardo. Outubro não tem esse tipo de lançamento.<\/li>\n      <li><strong>Faturamento de setembro:<\/strong> a visão mensal soma todos os closers do dashboard financeiro (R$ 290.949,71, inclui Rafael com R$ 4.299,93); a visão por closer soma só os 9 closers com aba (R$ 286.649,78). Na versão atualizada, Larissa ganhou R$ 1.795,20 em setembro em relação à versão anterior. Maio a agosto seguem o critério da visão mensal.<\/li>\n      <li><strong>Alvaro<\/strong> tem lançamentos só até 04/09 e R$ 0 como closer em setembro. Ticket médio e % Follow não existem para quem não teve vendas, então essas médias usam só os closers com venda.<\/li>\n    <\/ul>\n    <div class=\"leitura\">\n      <span>Leitura da coluna H:<\/span>\n      <div class=\"seg\" role=\"group\" aria-label=\"Leitura das vendas de Follow\">\n        <button type=\"button\" data-l=\"B\" aria-pressed=\"true\">0,01 = 1 venda<\/button>\n        <button type=\"button\" data-l=\"A\" aria-pressed=\"false\">Como exibido na planilha (0,01 = 0)<\/button>\n      <\/div>\n      <span class=\"sub\" id=\"leituraInfo\"><\/span>\n    <\/div>\n  <\/details>\n  <\/section>\n  <div id=\"aba-mes\" role=\"tabpanel\" aria-labelledby=\"tab-mes\" hidden>\n    <section>\n      <div class=\"sec-head\"><h2>Maio a setembro<\/h2><span class=\"sub\">meses fechados<\/span><\/div>\n      <div class=\"kpis\" id=\"mes-kpis\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Outubro em andamento<\/h2><span class=\"sub\">01 a 28/10<\/span><\/div>\n      <div class=\"kpis\" id=\"mes-kpis-out\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparativo mensal<\/h2><span class=\"sub\">indicador ao lado de cada valor = distância da média mensal do período<\/span><\/div>\n      <div class=\"tabela-box\"><table id=\"mes-tabela\"><\/table><\/div>\n      <div class=\"legenda\">\n        <span><span class=\"chip acima\">+12%<\/span> acima da média<\/span>\n        <span><span class=\"chip perto\">−4%<\/span> próximo da média (até ±10%)<\/span>\n        <span><span class=\"chip abaixo\">−25%<\/span> abaixo da média<\/span>\n      <\/div>\n      <p class=\"nota\">Média mensal = média simples dos meses fechados (maio a setembro); outubro, em andamento, não entra na média nem no total. Total do período = soma para reuniões, vendas e faturamento; conversão e ticket do total são calculados sobre os somatórios. Vendas de Follow começaram em setembro; com só um mês fechado, ainda não há média para comparação.<\/p>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparação com a média mensal<\/h2><span class=\"sub\">a linha tracejada marca a média<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\"><div class=\"seg\" role=\"group\" aria-label=\"Métrica\" id=\"mes-seg\"><\/div><div class=\"ref\" id=\"mes-ref\"><\/div><\/div>\n        <div class=\"barras\" id=\"mes-barras\"><\/div>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Detalhamento mensal<\/h2><\/div>\n      <div class=\"ind-top\"><label for=\"mes-sel\" class=\"sub\">Mês<\/label><select id=\"mes-sel\"><\/select><\/div>\n      <div class=\"ind-grid\" id=\"mes-grid\"><\/div>\n      <p class=\"compl\" id=\"mes-compl\"><\/p>\n    <\/section>\n  <\/div>\n\n<\/main>\n<footer>Valores recalculados a partir das linhas diárias; dias sem preenchimento considerados como zero. Vendas = coluna VENDAS; Vendas de Follow = coluna VENDA FOLLOW; leads enviados para Follow (coluna FOLLOW) aparecem só como dado complementar.<\/footer>\n\n<script>\nconst MESES = [{\"nome\": \"Maio\", \"ag\": 1083, \"real\": 608, \"vendas\": 117, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 302599.15}, {\"nome\": \"Junho\", \"ag\": 1093, \"real\": 625, \"vendas\": 140, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 385894.26}, {\"nome\": \"Julho\", \"ag\": 982, \"real\": 588, \"vendas\": 137, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 384660.12}, {\"nome\": \"Agosto\", \"ag\": 1126, \"real\": 755, \"vendas\": 118, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 347698.84}, {\"nome\": \"Setembro\", \"ag\": 1023, \"real\": 634, \"vendas\": 111, \"follow\": 108, \"vfA\": 46, \"vfB\": 57, \"fat\": 290949.71}, {\"nome\": \"Outubro\", \"parcial\": true, \"ag\": 958, \"real\": 459, \"vendas\": 101, \"follow\": 109, \"vfA\": 54, \"vfB\": 54, \"fat\": 293255.94}];\nconst CLOSERS = {\"Setembro\": [{\"nome\": \"Alvaro\", \"ag\": 20, \"real\": 13, \"vendas\": 0, \"follow\": 2, \"vfA\": 0, \"vfB\": 0, \"fat\": 0}, {\"nome\": \"Eduardo\", \"ag\": 77, \"real\": 41, \"vendas\": 14, \"follow\": 21, \"vfA\": 5, \"vfB\": 8, \"fat\": 47918.11}, {\"nome\": \"Larissa\", \"ag\": 88, \"real\": 63, \"vendas\": 9, \"follow\": 3, \"vfA\": 2, \"vfB\": 2, \"fat\": 26180.66}, {\"nome\": \"Leandro Portuga\", \"ag\": 98, \"real\": 58, \"vendas\": 18, \"follow\": 4, \"vfA\": 13, \"vfB\": 13, \"fat\": 49028.94}, {\"nome\": \"Luigi\", \"ag\": 154, \"real\": 88, \"vendas\": 11, \"follow\": 28, \"vfA\": 6, \"vfB\": 6, \"fat\": 17930.55}, {\"nome\": \"Misael\", \"ag\": 85, \"real\": 53, \"vendas\": 5, \"follow\": 0, \"vfA\": 1, \"vfB\": 5, \"fat\": 14478.4}, {\"nome\": \"Paulo\", \"ag\": 160, \"real\": 102, \"vendas\": 10, \"follow\": 7, \"vfA\": 0, \"vfB\": 0, \"fat\": 29337.11}, {\"nome\": \"Rodrigo\", \"ag\": 211, \"real\": 136, \"vendas\": 13, \"follow\": 34, \"vfA\": 0, \"vfB\": 7, \"fat\": 42900.42}, {\"nome\": \"Túlio\", \"ag\": 130, \"real\": 80, \"vendas\": 27, \"follow\": 9, \"vfA\": 16, \"vfB\": 16, \"fat\": 58875.59}], \"Outubro\": [{\"nome\": \"Alvaro\", \"ag\": 102, \"real\": 38, \"vendas\": 4, \"follow\": 5, \"vfA\": 1, \"vfB\": 1, \"fat\": 11952.0}, {\"nome\": \"Eduardo\", \"ag\": 101, \"real\": 49, \"vendas\": 17, \"follow\": 23, \"vfA\": 6, \"vfB\": 6, \"fat\": 55929.02}, {\"nome\": \"Larissa\", \"ag\": 82, \"real\": 43, \"vendas\": 12, \"follow\": 2, \"vfA\": 5, \"vfB\": 5, \"fat\": 41405.38}, {\"nome\": \"Leandro Portuga\", \"ag\": 157, \"real\": 90, \"vendas\": 25, \"follow\": 29, \"vfA\": 18, \"vfB\": 18, \"fat\": 70818.32}, {\"nome\": \"Luigi\", \"ag\": 171, \"real\": 80, \"vendas\": 15, \"follow\": 23, \"vfA\": 8, \"vfB\": 8, \"fat\": 32226.21}, {\"nome\": \"Paulo\", \"ag\": 155, \"real\": 62, \"vendas\": 12, \"follow\": 10, \"vfA\": 11, \"vfB\": 11, \"fat\": 41550.43}, {\"nome\": \"Rodrigo\", \"ag\": 190, \"real\": 97, \"vendas\": 16, \"follow\": 17, \"vfA\": 5, \"vfB\": 5, \"fat\": 38155.72}]};\nconst AVISOS = {\n  Setembro: '<strong>Base: abas individuais de setembro (versão anterior da planilha).<\/strong> Somam 107 vendas, contra 111 no consolidado do mês — diferença de 4 vendas em 24/09, ainda não atribuída a nenhum closer. Faturamento: 9 closers com aba.',\n  Outubro: '<strong>Mês em andamento: reuniões, vendas e faturamento de 01 a 28/10.<\/strong> 7 closers (Misael e Túlio desconsiderados); faturamento soma só os 7 closers com aba.'\n};\nconst st = { leitura:'B' };\n\nconst fmtInt = n => n.toLocaleString('pt-BR',{maximumFractionDigits:0});\nconst fmtDec = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});\nconst fmtR = n => 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst fmtPct = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';\n\nconst METRICAS = [\n  {k:'ag',     nome:'Reuniões agendadas', curto:'Agendadas',  fmt:fmtInt, mfmt:fmtDec},\n  {k:'real',   nome:'Reuniões realizadas',curto:'Realizadas', fmt:fmtInt, mfmt:fmtDec},\n  {k:'vendas', nome:'Vendas realizadas',  curto:'Vendas',     fmt:fmtInt, mfmt:fmtDec},\n  {k:'conv',   nome:'Taxa de conversão',  curto:'Conversão',  fmt:fmtPct, mfmt:fmtPct, taxa:true},\n  {k:'fat',    nome:'Faturamento',        curto:'Faturamento',fmt:fmtR,   mfmt:fmtR},\n  {k:'ticket', nome:'Ticket médio',       curto:'Ticket médio', fmt:fmtR, mfmt:fmtR, taxa:true},\n  {k:'vf',     nome:'Vendas de Follow',   curto:'Vendas Follow', fmt:fmtInt, mfmt:fmtDec},\n  {k:'pvf',    nome:'% de vendas de Follow', curto:'% Follow', fmt:fmtPct, mfmt:fmtPct, taxa:true},\n];\nconst GRAF = [['vendas','Vendas'],['conv','Conversão'],['fat','Faturamento'],['ticket','Ticket médio'],['real','Reuniões realizadas']];\n\nfunction enrich(r){\n  const vf = r.vfA===null ? null : (st.leitura==='A' ? r.vfA : r.vfB);\n  return {...r, vf,\n    conv: r.real ? r.vendas/r.real*100 : null,\n    ticket: (r.fat!==null && r.vendas && !r.semTicket) ? r.fat/r.vendas : null,\n    pvf: (vf!==null && r.vendas) ? vf/r.vendas*100 : null};\n}\nfunction calc(rows){\n  const cl = rows.map(enrich);\n  const base = cl.filter(c=>!c.parcial);\n  const media={}, n={};\n  METRICAS.forEach(m=>{\n    const vals = base.map(c=>c[m.k]).filter(v=>v!==null);\n    n[m.k]=vals.length;\n    media[m.k] = vals.length>1 ? vals.reduce((a,b)=>a+b,0)/vals.length : null;\n  });\n  return {cl, media, n, t: totais(base)};\n}\nfunction totais(rows){\n  const t={ag:0,real:0,vendas:0,fat:0,vf:0,follow:0,vendasF:0,semFat:false};\n  rows.forEach(c=>{['ag','real','vendas'].forEach(k=>t[k]+=c[k]); if(c.fat===null) t.semFat=true; else t.fat+=c.fat; if(c.semTicket) t.semTicket=true;\n    if(c.vf!==null){t.vf+=c.vf;t.follow+=c.follow;t.vendasF+=c.vendas;}});\n  t.conv=t.real? t.vendas/t.real*100 : null;\n  if(t.semFat){t.fat=null;t.ticket=null;} else t.ticket=(t.vendas && !t.semTicket)? t.fat/t.vendas : null;\n  t.pvf=t.vendasF? t.vf/t.vendasF*100 : null;\n  return t;\n}\n\nfunction chip(v, m){\n  if(v===null || m===null || !m) return '';\n  const d=v/m-1, r=Math.round(d*100);\n  const cls = Math.abs(d)<=0.10 ? 'perto' : (r>0?'acima':'abaixo');\n  return `<span class=\"chip ${cls}\">${(r>0?'+':r<0?'−':'')+Math.abs(r)}%<\/span>`;\n}\n// mês parcial: só taxas são comparáveis com a média de meses fechados\nconst chipRow = (c,m,med) => (c.parcial && !m.taxa) ? '' : chip(c[m.k],med);\nconst nd = '<span class=\"sub\">sem dado<\/span>';\nfunction kpiHTML(cards){ return cards.map(([r,v,d,dest])=>`<div class=\"kpi${dest?' dest':''}\"><div class=\"rot\">${r}<\/div><div class=\"val\">${v}<\/div>${d?`<div class=\"det\">${d}<\/div>`:''}<\/div>`).join(''); }\nconst opt = (v,f) => v===null ? '—' : f(v);\n\nconst VIEWS = {\n  mes: {\n    rows: ()=>MESES, rotulo:'Mês', mediaLbl:'MÉDIA MENSAL', totalLbl:'TOTAL MAI–SET', mediaRef:'Média mensal (mai–set)',\n    sel: 'Setembro', metrica:'vendas',\n    label: c => c.parcial ? `${c.nome} <span class=\"sub\">(até 28/10)<\/span>` : c.nome,\n    kpis(D){ const t=D.t, nf=MESES.filter(m=>!m.parcial).length; return [\n      ['Reuniões agendadas', fmtInt(t.ag), `média de ${fmtDec(t.ag/nf)} por mês`],\n      ['Reuniões realizadas', fmtInt(t.real), `${fmtPct(t.real/t.ag*100)} das agendadas`],\n      ['Vendas realizadas', fmtInt(t.vendas), `média de ${fmtDec(t.vendas/nf)} por mês`],\n      ['Taxa de conversão', fmtPct(t.conv), 'vendas ÷ reuniões realizadas', true],\n      ['Faturamento', fmtR(t.fat), `média de ${fmtR(t.fat/nf)} por mês`, true],\n      ['Ticket médio', fmtR(t.ticket), 'faturamento ÷ vendas'],\n      ['Vendas de Follow', fmtInt(t.vf), `acompanhamento desde setembro · ${fmtInt(t.follow)} leads enviados para Follow`],\n      ['% de vendas de Follow', fmtPct(t.pvf), `sobre ${t.vendasF} vendas de setembro`],\n    ];},\n    nMedia(){ return ''; },\n    semMedia: 'sem média de comparação ainda',\n  },\n  closer: {\n    rows: ()=>CLOSERS[VIEWS.closer.mes], rotulo:'Closer', mediaLbl:'MÉDIA DOS CLOSERS', totalLbl:'TOTAL DO TIME', mediaRef:'Média dos closers',\n    mes:'Outubro', sel: null, metrica:'vendas',\n    label: c => c.nome,\n    kpis(D){ const t=D.t, nc=D.cl.length; return [\n      ['Reuniões agendadas', fmtInt(t.ag), ''],\n      ['Reuniões realizadas', fmtInt(t.real), `${fmtPct(t.real/t.ag*100)} das agendadas`],\n      ['Vendas realizadas', fmtInt(t.vendas), 'soma das abas individuais'],\n      ['Taxa de conversão', opt(t.conv,fmtPct), 'vendas ÷ reuniões realizadas', true],\n      ['Faturamento', t.fat===null?'Sem dado':fmtR(t.fat), t.fat===null?'aguardando dashboard financeiro de outubro':(t.semTicket?`${nc} closers com aba · só até 06/10`:`${nc} closers com aba`), true],\n      ['Ticket médio', t.ticket===null?'—':fmtR(t.ticket), t.semTicket?'não calculado: faturamento até 06/10, vendas até 14/10':'faturamento ÷ vendas'],\n      ['Vendas de Follow', fmtInt(t.vf), `${fmtInt(t.follow)} leads enviados para Follow`],\n      ['% de vendas de Follow', opt(t.pvf,fmtPct), 'vendas de Follow ÷ vendas'],\n    ];},\n    nMedia(m,D){ return D.media[m.k]!==null && D.n[m.k]<D.cl.length ? ` <span class=\"sub\">(${D.n[m.k]})<\/span>` : ''; },\n    semMedia: 'sem dado',\n  }\n};\n\nfunction renderView(id){\n  const V=VIEWS[id], D=calc(V.rows()), $=s=>document.getElementById(`${id}-${s}`);\n  if(V.sel===null || !D.cl.find(c=>c.nome===V.sel)) V.sel = D.cl[0].nome;\n  const fv=(m,v)=> v===null ? '<span class=\"sub\">—<\/span>' : m.fmt(v);\n  $('kpis').innerHTML = kpiHTML(V.kpis(D));\n  if(id==='mes'){\n    const o = enrich(MESES.find(m=>m.parcial));\n    $('kpis-out').innerHTML = kpiHTML([\n      ['Reuniões agendadas', fmtInt(o.ag), ''],\n      ['Reuniões realizadas', fmtInt(o.real), `${fmtPct(o.real/o.ag*100)} das agendadas`],\n      ['Vendas realizadas', fmtInt(o.vendas), ''],\n      ['Taxa de conversão', fmtPct(o.conv), `média mai–set: ${fmtPct(D.media.conv)} ${chip(o.conv,D.media.conv)}`, true],\n      ['Faturamento', fmtR(o.fat), 'todos os closers do dashboard financeiro', true],\n      ['Ticket médio', fmtR(o.ticket), `média mai–set: ${fmtR(D.media.ticket)} ${chip(o.ticket,D.media.ticket)}`],\n      ['Vendas de Follow', fmtInt(o.vf), `${fmtInt(o.follow)} leads enviados para Follow`],\n      ['% de vendas de Follow', fmtPct(o.pvf), `setembro: ${fmtPct(D.cl.find(c=>c.nome==='Setembro').pvf)} ${chip(o.pvf,D.cl.find(c=>c.nome==='Setembro').pvf)}`],\n    ]);\n  }\n  const t=D.t;\n  const tot={ag:fmtInt(t.ag),real:fmtInt(t.real),vendas:fmtInt(t.vendas),conv:opt(t.conv,fmtPct),fat:opt(t.fat,fmtR),ticket:opt(t.ticket,fmtR),\n    vf: id==='closer'?fmtInt(t.vf):'—', pvf: id==='closer'?opt(t.pvf,fmtPct):'—'};\n  $('tabela').innerHTML = `<thead><tr><th>${V.rotulo}<\/th>${METRICAS.map(m=>`<th>${m.curto}<\/th>`).join('')}<\/tr><\/thead><tbody>`+\n    D.cl.map(c=>`<tr${c.parcial?' style=\"font-style:italic\"':''}><td><span class=\"n\">${V.label(c)}<\/span><\/td>${METRICAS.map(m=>`<td>${fv(m,c[m.k])}${chipRow(c,m,D.media[m.k])}<\/td>`).join('')}<\/tr>`).join('')+\n    `<tr class=\"media\"><td>${V.mediaLbl}<\/td>${METRICAS.map(m=>`<td>${D.media[m.k]===null?'—':m.mfmt(D.media[m.k])}${V.nMedia(m,D)}<\/td>`).join('')}<\/tr>`+\n    `<tr class=\"total\"><td>${V.totalLbl}<\/td>${METRICAS.map(m=>`<td>${tot[m.k]}<\/td>`).join('')}<\/tr><\/tbody>`;\n  // Barras\n  $('seg').innerHTML = GRAF.map(([k,l])=>`<button type=\"button\" data-m=\"${k}\" aria-pressed=\"${V.metrica===k}\">${l}<\/button>`).join('');\n  const m=METRICAS.find(x=>x.k===V.metrica), med=D.media[m.k];\n  if(med===null){\n    $('ref').innerHTML=''; $('barras').innerHTML = `<p class=\"sub\">${m.nome}: sem dado neste período.<\/p>`;\n  } else {\n    const max=Math.max(...D.cl.map(c=>c[m.k]??0), med)*1.06||1, pm=med/max*100;\n    $('ref').innerHTML = `${V.mediaRef}: <strong>${m.mfmt(med)}<\/strong>${V.nMedia(m,D)}`;\n    $('barras').innerHTML = `<div class=\"eixo-m\"><div><\/div><div class=\"t\"><span style=\"left:${pm}%\">média ${m.mfmt(med)}<\/span><\/div><div><\/div><\/div>`+\n      D.cl.map(c=>{const v=c[m.k]; const op=c.parcial?'opacity:.45;':'';\n        return `<div class=\"linha-b\"><div>${V.label(c)}<\/div>\n        <div class=\"trilho\" role=\"img\" aria-label=\"${c.nome}: ${v===null?'sem dado':m.fmt(v)}\"><div class=\"b\" style=\"${op}width:${(v??0)/max*100}%\"><\/div><div class=\"m\" style=\"left:${pm}%\"><\/div><\/div>\n        <div class=\"v\"><span>${v===null?'sem dado':m.fmt(v)}<\/span>${chipRow(c,m,med)}<\/div><\/div>`;}).join('');\n  }\n  // Detalhe\n  const sel=$('sel');\n  sel.innerHTML = D.cl.map(r=>`<option${r.nome===V.sel?' selected':''}>${r.nome}<\/option>`).join('');\n  const c=D.cl.find(x=>x.nome===V.sel);\n  $('grid').innerHTML = METRICAS.map(m=>{\n    const v=c[m.k], med=D.media[m.k], comp = v!==null && med!==null && !(c.parcial && !m.taxa);\n    const mx=Math.max(v??0,med??0)||1;\n    const txt = comp ? 'média '+m.mfmt(med) : (v===null ? (m.k==='fat'||m.k==='ticket' ? (m.k==='ticket' && c.semTicket ? 'não calculado: faturamento até 06/10' : m.k==='ticket' && c.fat ? 'faturamento sem venda lançada' : 'sem vendas no período') : m.k==='conv' ? 'sem reuniões realizadas' : m.k==='pvf' ? 'sem vendas no período' : V.semMedia) : (c.parcial && !m.taxa ? 'mês em andamento' : 'sem média de comparação ainda'));\n    return `<div class=\"tile\"><div class=\"rot\">${m.nome}<\/div><div class=\"val\">${v===null?'—':m.fmt(v)}<\/div>\n      <div class=\"cmp\">${comp?chip(v,med):''}<span>${txt}<\/span><\/div>\n      ${comp?`<div class=\"mini\" aria-hidden=\"true\"><div class=\"c\" style=\"width:${v/mx*100}%\"><\/div><div class=\"md\" style=\"width:${med/mx*100}%\"><\/div><\/div>`:''}<\/div>`;\n  }).join('');\n  const quem = id==='mes'?'mês':'closer';\n  $('compl').innerHTML = (c.follow===null ? '' : `Dado complementar — leads enviados para Follow: <strong>${fmtInt(c.follow)}<\/strong>. `) +\n    `Barras: verde = ${quem}, cinza = média.` + (c.vfA!==null && c.vfA!==c.vfB ? ` Vendas de Follow: ${c.vfB} na leitura “0,01 = 1 venda” e ${c.vfA} na leitura como exibida.` : '');\n  if(id==='closer'){\n    document.querySelectorAll('#closer-mes button').forEach( "><h2>Performance individual<\/h2><p>Quem está performando? Clique em um SDR para filtrar o painel.<\/p><\/header>\n    <div class=\"panel\"><div class=\"tbl-wrap\"><table id=\"rank\"><thead><\/thead><tbody><\/tbody><\/table><\/div>\n    <div class=\"scope\" id=\"rankScope\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s1\">\n    <header class=\"sec-h\"><h2>Visão geral<\/h2><p id=\"ovSub\">Como estamos no período?<\/p><\/header>\n    <div class=\"kpis\" id=\"kpis\"><\/div>\n    <div class=\"goal-note\" id=\"updNote\" style=\"margin-top:12px\"><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s-week\">\n    <header class=\"sec-h\"><h2>Performance da semana<\/h2><p id=\"wkSub\"><\/p><\/header>\n    <div class=\"panel\">\n      <div class=\"tbl-wrap\"><table class=\"wk-table\" id=\"wkTable\"><\/table><\/div>\n      <div class=\"goal-note\" id=\"goal\"><\/div>\n      <div class=\"scope\" id=\"wkScope\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s2\">\n    <header class=\"sec-h\"><h2>Funil de reuniões<\/h2><p>Do agendamento à agenda do Closer e ao resultado<\/p><\/header>\n    <div class=\"panel\"><div class=\"funnel\" id=\"funnel\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s3\">\n    <header class=\"sec-h\"><h2>Evolução<\/h2><p>Como os números se movem ao longo do tempo?<\/p>\n      <div class=\"right seg\" role=\"group\" aria-label=\"Visualização\" id=\"fEvoView\">\n        <button data-v=\"tabela\" aria-pressed=\"true\">Quadro<\/button>\n        <button data-v=\"grafico\" aria-pressed=\"false\">Gráfico<\/button>\n      <\/div>\n      <div class=\"seg\" role=\"group\" aria-label=\"Agrupamento\" id=\"fGran\">\n        <button data-v=\"dia\" aria-pressed=\"true\">Dia<\/button>\n        <button data-v=\"semana\" aria-pressed=\"false\">Semana<\/button>\n        <button data-v=\"mes\" aria-pressed=\"false\">Mês<\/button>\n      <\/div>\n    <\/header>\n    <div class=\"panel\"><div class=\"tbl-wrap\" id=\"evoTableWrap\"><table class=\"evo-table\" id=\"evoTable\"><\/table><\/div>\n    <div class=\"chart-box\" id=\"evoChartWrap\" hidden><canvas id=\"cEvo\" aria-label=\"Evolução de agendadas, acontecidas e no-show\"><\/canvas><\/div>\n    <div class=\"scope\" id=\"evoScope\"><\/div><\/div>\n  <\/section>\n\n  <section class=\"sec\" id=\"s5\">\n    <header class=\"sec-h\"><h2>TYPEBOT × SDRs<\/h2><p>A automação gera volume, e esse volume vira reunião?<\/p><\/header>\n    <div class=\"panel\">\n      <div class=\"tbl-wrap\"><table class=\"cmp-table\" id=\"cmp\"><\/table><\/div>\n      <div class=\"scope\">Considera apenas o filtro de período, para manter a comparação completa.<\/div>\n    <\/div>\n  <\/section>\n\n  <details class=\"sec ins\" id=\"s7\">\n    <summary><span class=\"ins-t\">Insights<\/span> <span class=\"ins-c\" id=\"insCount\"><\/span><span class=\"ins-hint\">Sinais calculados a partir dos dados filtrados<\/span><\/summary>\n    <ul class=\"insights\" id=\"insights\"><\/ul>\n  <\/details>\n\n  <details class=\"notes\" id=\"notes\">\n    <summary>Regras de cálculo e qualidade da base<\/summary>\n    <div class=\"cols\">\n      <div>\n        <h3>Como os números são calculados<\/h3>\n        <ul>\n          <li><b>Data<\/b>: dia da reunião. <b>Agendadas<\/b>: soma da coluna Agendamentos, ou seja, reuniões marcadas para aquele dia.<\/li>\n          <li><b>Reuniões passadas<\/b>: agendamentos que entraram efetivamente na agenda dos Closers, sem overbooking (coluna Reuniões Passadas). Vale sempre o valor informado na planilha, mesmo quando Acontecidas + No-show da linha é maior (essa soma pode se referir ao total de agendamentos).<\/li>\n          <li><b>Não passadas ao Closer<\/b>: Agendadas − Reuniões passadas, até o último dia com resultado lançado na base. <b>Aguardando registro<\/b>: o mesmo saldo nos dias seguintes, que ainda não tiveram resultado lançado. Nenhum dos dois entra nas taxas.<\/li>\n          <li><b>Repasse<\/b> = Reuniões passadas ÷ agendadas com data já ocorrida.<\/li>\n          <li><b>Comparecimento<\/b> = Acontecidas ÷ Reuniões passadas. <b>No-show %<\/b> = No-show ÷ Reuniões passadas.<\/li>\n          <li><b>Sem status<\/b>: reuniões na agenda do Closer ainda sem marcação de acontecida ou no-show. Ficam no denominador das taxas, como manda a fórmula.<\/li>\n          <li>Células vazias contam como zero. Não há linhas de total na planilha; linhas em branco entre os dias são ignoradas.<\/li>\n          <li>TYPEBOT é identificado pelo valor TYPEBOT na coluna SDR. Todos os outros nomes contam como SDRs humanos.<\/li>\n          <li>Semanas de segunda a domingo, inclusive na comparação semanal e na meta. Os cards do topo comparam com um intervalo anterior de mesmo tamanho, cortado até hoje.<\/li>\n        <\/ul>\n      <\/div>\n      <div>\n        <h3>Conferência com a planilha (base completa)<\/h3>\n        <div class=\"recon\" id=\"recon\"><\/div>\n        <h3 style=\"margin-top:16px\">Pontos de atenção na base<\/h3>\n        <ul id=\"dq\"><\/ul>\n      <\/div>\n    <\/div>\n  <\/details>\n<\/main>\n\n<div id=\"tip\" hidden role=\"tooltip\"><\/div>\n\n<script id=\"calc\">\n/* ===== Dados: exportados de Acompanhamento_HOD.xlsx (aba SDRs Typebot) =====\n   Data = dia da reunião. Agendamentos = reuniões marcadas para aquele dia.\n   Reuniões Passadas = agendamentos que entraram de fato na agenda dos Closers, sem overbooking.\n   Formato de cada linha: [data, SDR, Agendamentos, Reuniões Passadas, Acontecidas, No-show, Não Passadas, Daily check] */\nvar DATA_RAW = [[\"2026-10-01\", \"MICHELLY\", 0, 0, 0, 0, 0, \"SPRINTER\"], [\"2026-10-01\", \"BEATRIZ\", 5, 5, 4, 1, 0, \"FEZ DEPOIS\"], [\"2026-10-01\", \"LEANDRO B.\", 13, 13, 11, 2, 0, \"OK!\"], [\"2026-10-01\", \"VITOR\", 9, 7, 4, 3, 2, \"OK!\"], [\"2026-10-01\", \"Lucas Carioca\", 5, 5, 3, 2, 0, \"OK!\"], [\"2026-10-01\", \"IASMIN\", 8, 7, 5, 2, 1, \"OK!\"], [\"2026-10-01\", \"GUSTAVO\", 0, 0, 0, 0, 0, \"SPRINTER\"], [\"2026-10-01\", \"ÁLVARO\", 2, 1, (d);}\nfunction dow(s){return (toD(s).getUTCDay()+6)%7;}\nfunction monday(s){return addDays(s,-dow(s));}\nfunction diffDays(a,b){return Math.round((toD(b)-toD(a))/864e5);}\nfunction firstOfMonth(s){return s.slice(0,8)+\"01\";}\nfunction addMonths(s,n){var d=toD(firstOfMonth(s));d.setUTCMonth(d.getUTCMonth()+n);return iso(d);}\nfunction endOfMonth(s){return addDays(addMonths(s,1),-1);}\nfunction br(s){return s.slice(8,10)+\"/\"+s.slice(5,7);}\n\nfunction presetRange(p,R){\n  var m=monday(R);\n  switch(p){\n    case \"hoje\": return [R,R];\n    case \"ontem\": return [addDays(R,-1),addDays(R,-1)];\n    case \"semana\": return [m,addDays(m,6)];\n    case \"semana_passada\": return [addDays(m,-7),addDays(m,-1)];\n    case \"mes\": return [firstOfMonth(R),endOfMonth(R)];\n    case \"mes_passado\": return [addMonths(R,-1),addDays(firstOfMonth(R),-1)];\n    case \"d7\": return [addDays(R,-6),R];\n    case \"d30\": return [addDays(R,-29),R];\n  }\n  return null;\n}\n/* Período anterior: mesmo tamanho, cortado até hoje. Retorna {cur:[s,e], prev:[s,e]} ou null */\nfunction compareRanges(s,e,preset,R,dataMin){\n  if(s>R) return null;\n  var ce = e<R? e : R, len = diffDays(s,ce)+1, ps;\n  if(preset===\"mes\"||preset===\"mes_passado\"){ ps=addMonths(s,-1); }\n  else { ps=addDays(s,-(diffDays(s,e)+1)); }\n  var pe=addDays(ps,len-1);\n  if(ps<dataMin) return {cur:[s,ce],prev:null};\n  return {cur:[s,ce],prev:[ps,pe]};\n}\nfunction filterRows(rows,f){\n  return rows.filter(function(r){\n    return r.d>=f.start && r.d<=f.end &&\n      (f.origem===\"ALL\"||(f.origem===\"TB\")===r.tb) &&\n      (!f.sdr||f.sdr===\"ALL\"||r.key===f.sdr);\n  });\n}\nfunction bySdr(rows){\n  var m={},order=[];\n  rows.forEach(function(r){ if(!m[r.key]){m[r.key]={key:r.key,name:r.name,tb:r.tb,rows:[]};order.push(r.key);} m[r.key].rows.push(r); });\n  return order.map(function(k){var o=m[k],a=agg(o.rows);a.key=o.key;a.name=o.name;a.tb=o.tb;return a;});\n}\nfunction highlights(list){\n  var hum=list.filter(function(x){return !x.tb&&x.ag>0;}), elig=hum.filter(function(x){return x.pa>=MIN_PASSADAS;}), h={};\n  function best(arr,f,dir){var b=null;arr.forEach(function(x){var v=f(x);if(v==null)return;if(b===null||(dir>0?v>f(b):v<f(b)))b=x;});return b;}\n  var a=best(hum,function(x){return x.ag;},1); if(a) h.vol=a.key;\n  var b=best(hum,function(x){return x.ac;},1); if(b&&b.ac>0) h.ac=b.key;\n  var c=best(elig,function(x){return x.comp;},1); if(c) h.cp=c.key;\n  var d=best(elig,function(x){return x.nsp;},1); if(d&&d.nsp>0) h.ns=d.key;\n  return h;\n}\nfunction buckets(s,e,gran){\n  var out=[],cur;\n  if(gran===\"dia\"){ for(cur=s;cur<=e;cur=addDays(cur,1)) out.push({s:cur,e:cur,label:br(cur)}); }\n  else if(gran===\"semana\"){ for(cur=monday(s);cur<=e;cur=addDays(cur,7)){ var bs=cur<s?s:cur, be=addDays(cur,6)>e?e:addDays(cur,6); out.push({s:bs,e:be,label:\"Sem. \"+br(cur)}); } }\n  else { var meses=[\"jan\",\"fev\",\"mar\",\"abr\",\"mai\",\"jun\",\"jul\",\"ago\",\"set\",\"out\",\"nov\",\"dez\"];\n    for(cur=firstOfMonth(s);cur<=e;cur=addMonths(cur,1)){ var ms=cur<s?s:cur, me=endOfMonth(cur)>e?e:endOfMonth(cur); out.push({s:ms,e:me,label:meses[+cur.slice(5,7)-1]+\"/\"+cur.slice(2,4)}); } }\n  return out;\n}\n<\/script>\n\n<script>\n(function(){\n\"use strict\";\nvar R=today(), ROWS=normalize(DATA_RAW,R), DMIN, DMAX, DLAST, ONTEM, LASTRES;\nfunction today(){var d=new Date();return d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\")+\"-\"+String(d.getDate()).padStart(2,\"0\");}\nfunction bounds(){ DMIN=ROWS.reduce(function(m,r){return r.d<m?r.d:m;},\"9999\"); DMAX=ROWS.reduce(function(m,r){return r.d>m?r.d:m;},\"0000\"); DLAST=ROWS.reduce(function(m,r){return (r.ag+r.pa+r.ac+r.ns>0&&r.d>m)?r.d:m;},DMIN); ONTEM=prevDataDay(R); LASTRES=ROWS.reduce(function(m,r){return (r.pa+r.ac+r.ns>0&&r.d>m)?r.d:m;},DMIN); }\n/* último dia antes de \"d\" com algum lançamento (agendadas ou resultados) */\nfunction prevDataDay(d){ return ROWS.reduce(function(m,r){return (r.d<d&&r.ag+r.pa+r.ac+r.ns>0&&(m===null||r.d>m))?r.d:m;},null); }\nbounds();\n\nvar S={preset:\"ontem\",start:null,end:null,sdr:\"ALL\",origem:\"ALL\",gran:\"dia\",evo:\"tabela\",sort:{k:\"ag\",dir:-1}};\nvar charts={};\nvar $=function(id){return document.getElementById(id);};\nvar C={brand:\"#253A20\",bot:\"#3F6EA8\",ok:\"#2F9356\",bad:\"#D9472F\",ink3:\"#848E85\",line:\"#E2E7E1\"};\n\nfunction fmt(n){return n==null?\"—\":n.toLocaleString(\"pt-BR\");}\nfunction fp(v,d){return v==null?\"—\":v.toLocaleString(\"pt-BR\",{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})+\"%\";}\nfunction esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c];});}\n\nfunction setPreset(p){\n  S.preset=p;\n  if(p===\"ontem\"&&ONTEM){ S.start=ONTEM; S.end=ONTEM; }\n  else if(p!==\"custom\"){ var r=presetRange(p,R); S.start=r[0]; S.end=r[1]; }\n  $(\"fPeriod\").value=p; $(\"fStart\").value=S.start; $(\"fEnd\").value=S.end;\n}\nfunction initPeriod(){\n  if(ONTEM){ setPreset(\"ontem\"); return; }\n  var r=presetRange(\"mes\",R);\n  var any=ROWS.some(function(x){return x.d>=r[0]&&x.d<=r[1];});\n  if(any) setPreset(\"mes\"); else { S.start=DMIN; S.end=DMAX; setPreset(\"custom\"); }\n}\n/* Comparação: \"Ontem\" compara com o dia lançado imediatamente anterior; demais períodos, intervalo de mesmo tamanho */\nfunction getCompare(){\n  if(S.preset===\"ontem\"&&ONTEM){ var pd=prevDataDay(ONTEM); return {cur:[ONTEM,ONTEM],prev:pd&&pd>=DMIN?[pd,pd]:null}; }\n  return compareRanges(S.start,S.end,S.preset,R,DMIN);\n}\nvar DIAS=[\"segunda\",\"terça\",\"quarta\",\"quinta\",\"sexta\",\"sábado\",\"domingo\"];\nfunction fullFilter(o){ return Object.assign({start:S.start,end:S.end,sdr:S.sdr,origem:S.origem},o||{}); }\n\nfunction buildSdrSelect(){\n  var seen={},opts=[];\n  ROWS.forEach(function(r){ if(!seen[r.key]){seen[r.key]=1;opts.push(r);} });\n  opts.sort(function(a,b){ if(a.tb!==b.tb) return a.tb?1:-1; return a.name.localeCompare(b.name,\"pt-BR\"); });\n  var html='<option value=\"ALL\">Todos<\/option>';\n  opts.forEach(function(r){\n    var dis=(S.origem===\"TB\"&&!r.tb)||(S.origem===\"HUM\"&&r.tb);\n    html+='<option value=\"'+esc(r.key)+'\"'+(dis?\" disabled\":\"\")+'>'+esc(r.name)+'<\/option>';\n  });\n  $(\"fSdr\").innerHTML=html; $(\"fSdr\").value=S.sdr;\n}\nfunction nameOf(key){ var r=ROWS.find(function(x){return x.key===key;}); return r?r.name:key; }\n\n/* ---------- KPI ---------- */\nfunction delta(cur,prev,kind,goodUp){\n  if(prev==null||cur==null) return '<span class=\"delta na\">Sem comparativo na base<\/span>';\n  var d, txt;\n  if(kind===\"pp\"){ d=cur-prev; txt=(d>0?\"+\":\"\")+d.toLocaleString(\"pt-BR\",{maximumFractionDigits:1,minimumFractionDigits:1})+\" p.p.\"; }\n  else { if(prev===0){ return cur===0?'<span class=\"delta flat\">= estável <em>vs anterior<\/em><\/span>':'<span class=\"delta '+(goodUp?\"good\":\"bad\")+'\">▲ de 0 para '+fmt(cur)+'<\/span>'; }\n    d=(cur-prev)/prev*100; txt=(d>0?\"+\":\"\")+d.toLocaleString(\"pt-BR\",{maximumFractionDigits:0})+\"%\"; }\n  if(Math.abs(d)<0.05) return '<span class=\"delta flat\">= estável <em>vs anterior<\/em><\/span>';\n  var up=d>0, good=goodUp==null?null:(up===goodUp);\n  var cls=good==null?\"flat\":(good?\"good\":\"bad\");\n  return '<span class=\"delta '+cls+'\">'+(up?\"▲\":\"▼\")+\" \"+txt+' <em>vs '+(kind===\"pp\"?\"anterior\":\"anterior\")+'<\/em><\/span>';\n}\nfunction renderKPIs(){\n  var t=agg(filterRows(ROWS,fullFilter()));\n  var cr=getCompare(), c=null,p=null;\n  if(cr&&cr.prev){ c=agg(filterRows(ROWS,fullFilter({start:cr.cur[0],end:cr.cur[1]}))); p=agg(filterRows(ROWS,fullFilter({start:cr.prev[0],end:cr.prev[1]}))); }\n  var pend = c && c.aguard>0 && c.pa+c.ac+c.ns===0;\n  var W='<span class=\"delta na\">Aguardando registro<\/span>';\n  var dr=function(h){return pend?W:h;};\n  var cmpTxt = cr&&cr.prev ? \"Comparação: \"+br(cr.cur[0])+\"–\"+br(cr.cur[1])+\" vs \"+br(cr.prev[0])+\"–\"+br(cr.prev[1])+\".\" : \"\";\n  var cards=[\n    {lb:\"Agendadas\",v:fmt(t.ag),sub:t.aguard>0?fmt(t.aguard)+\" aguardando registro\":\"Todas com resultado lançado\",tip:\"Reuniões de vendas marcadas para os dias do período (coluna Data = dia da reunião), incluindo as que ainda aguardam registro.\",d:delta(c&&c.ag,p&&p.ag,\"n\",true)},\n    {lb:\"Reuniões passadas\",v:fmt(t.pa),sub:t.rep==null?\"—\":fp(t.rep,0)+\" de repasse ao Closer\",tip:\"Agendamentos que entraram efetivamente na agenda dos Closers, sem overbooking. É a base das taxas. Repasse = Passadas ÷ agendadas com resultado já lançado.\",d:dr(delta(c&&c.pa,p&&p.pa,\"n\",null))},\n    {lb:\"Acontecidas\",v:fmt(t.ac),sub:t.pa===0?\"Sem resultado lançado\":(t.ss>0?fmt(t.ss)+\" passadas sem status\":\"Todas as passadas classificadas\"),tip:\"Reuniões em que o lead compareceu efetivamente com o Closer.\",d:dr(delta(c&&c.ac,p&&p.ac,\"n\",true))},\n    {lb:\"No-show\",v:fmt(t.ns),sub:\"reuniões sem comparecimento\",tip:\"Reuniões previstas que não aconteceram por ausência do lead.\",d:dr(delta(c&&c.ns,p&&p.ns,\"n\",false))},\n    {lb:\"Comparecimento\",v:fp(t.comp),rate:t.comp,color:C.ok,tip:\"Acontecidas ÷ Reuniões passadas. Só entram reuniões que chegaram à agenda do Closer; datas futuras e não passadas ficam fora.\",d:dr(delta(c&&c.comp,p&&p.comp,\"pp\",true))},\n    {lb:\"No-show %\",v:fp(t.nsp),rate:t.nsp,color:C.bad,tip:\"No-show ÷ Reuniões passadas. Não é calculado sobre as agendadas.\",d:dr(delta(c&&c.nsp,p&&p.nsp,\"pp\",false))}\n  ];\n  var one=S.start===S.end;\n  $(\"ovSub\").textContent = (S.preset===\"ontem\"&&ONTEM) ? \"Ontem: \"+DIAS[dow(ONTEM)]+\", \"+br(ONTEM)+\", último dia com lançamento na base.\"+(cr&&cr.prev?\" Comparado a \"+DIAS[dow(cr.prev[0])]+\", \"+br(cr.prev[0])+\".\":\"\")\n    : (one?DIAS[dow(S.start)]+\", \"+br(S.start)+\".\":\"Período de \"+br(S.start)+\" a \"+br(S.end)+\".\");\n  $(\"updNote\").textContent = (t.aguard>0&&t.pa+t.ac+t.ns===0&&one) ? \"Os resultados de \"+br(S.start)+\" ainda não foram \"subCons\"><\/span><\/div>\n    <div class=\"grid\">\n      <div class=\"card hero\"><div class=\"rot\">Investimento em mídia<\/div><div class=\"num\" id=\"kInv\"><\/div><div class=\"det\" id=\"kInvDet\"><\/div><\/div>\n      <div class=\"card\"><div class=\"rot\">ROAS<\/div><div class=\"num\" id=\"kRoas\"><\/div><div class=\"det\" id=\"kRoasDet\"><\/div><\/div>\n      <div class=\"card\"><div class=\"rot\">Contatos novos (GHL)<\/div><div class=\"num\" id=\"kCont\"><\/div><div class=\"det\" id=\"kContDet\"><\/div><\/div>\n      <div class=\"card\"><div class=\"rot\">Adicionados ao pipeline<\/div><div class=\"num\" id=\"kPipe\"><\/div><div class=\"det\" id=\"kPipeDet\"><\/div><\/div>\n      <div class=\"card\"><div class=\"rot\">Conversão para pipeline<\/div><div class=\"num\" id=\"kConv\"><\/div><div class=\"det\">adicionados ao pipeline ÷ contatos novos<\/div><\/div>\n      <div class=\"card\"><div class=\"rot\">Campanhas ativas<\/div><div class=\"num\" id=\"kCamp\"><\/div><div class=\"det\" id=\"kCampDet\"><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <section>\n    <div class=\"sec-head\"><h2>Investimento por campanha<\/h2><span class=\"sub\">período selecionado<\/span><\/div>\n    <div class=\"tbox\"><table id=\"tCamp\"><\/table><\/div>\n  <\/section>\n\n  <section>\n    <div class=\"sec-head\"><h2>Dados diários<\/h2><span class=\"sub\">escolha uma campanha, o consolidado ou todas lado a lado<\/span><\/div>\n    <div class=\"ctrl\"><label>Visão<select id=\"fCamp\"><\/select><\/label><\/div>\n    <div class=\"tbox\"><table id=\"tDia\"><\/table><\/div>\n    <p class=\"nota\" id=\"nota\"><\/p>\n  <\/section>\n<\/main>\n<script>\nconst MID = {\"meses\": [{\"label\": \"Outubro de 2026\", \"ano\": 2026, \"mes\": 10, \"camps\": [\"Direct/Whatsapp\", \"Plano 90D\", \"Rmkt Insta\", \"Seguidores Insta\", \"Typebot\", \"Rmkt YouTube\", \"Inscritos YouTube\", \"Live\"], \"dias\": {\"1\": {\"tot\": 566.15, \"c\": [117.53, 104.09, 219.81, 70.87, 0, 53.85, 0, 0], \"contatos\": 257, \"pipeline\": 141}, \"2\": {\"tot\": 516.7, \"c\": [91.25, 90.8, 216.03, 65.2, 0, 53.42, 0, 0], \"contatos\": 286, \"pipeline\": 147}, \"3\": {\"tot\": 470.26, \"c\": [75.06, 89.44, 208.15, 42.97, 0, 54.64, 0, 0], \"contatos\": 228, \"pipeline\": 109}, \"4\": {\"tot\": 572.03, \"c\": [64.7, 111.81, 256.64, 84.14, 0, 54.74, 0, 0], \"contatos\": 237, \"pipeline\": 85}, \"5\": {\"tot\": 603.5, \"c\": [105.64, 100.41, 225.59, 69.8, 45.55, 53.87, 2.64, 0], \"contatos\": 332, \"pipeline\": 138}, \"6\": {\"tot\": 907.03, \"c\": [341.15, 106.3, 264.31, 58.31, 94.8, 37.56, 4.6, 0], \"contatos\": 449, \"pipeline\": 178}, \"7\": {\"tot\": 847.54, \"c\": [379.32, 102.19, 201.45, 60.82, 48.94, 50.23, 4.59, 0], \"contatos\": 417, \"pipeline\": 173}, \"8\": {\"tot\": 784.1, \"c\": [283.2, 111.32, 216.48, 56.16, 60.24, 52.11, 4.59, 0], \"contatos\": 346, \"pipeline\": 105}, \"9\": {\"tot\": 902.07, \"c\": [422.02, 102.69, 182.79, 57.09, 81.33, 51.56, 4.59, 0], \"contatos\": 351, \"pipeline\": 96}, \"10\": {\"tot\": 924.16, \"c\": [419.75, 103.29, 216.75, 53.74, 75.95, 50.09, 4.59, 0], \"contatos\": 342, \"pipeline\": 116}, \"11\": {\"tot\": 786.95, \"c\": [255.91, 129.7, 247.8, 74.83, 23.57, 50.56, 4.58, 0], \"contatos\": 296, \"pipeline\": 132}, \"12\": {\"tot\": 966.15, \"c\": [454.97, 104.55, 253.89, 72.91, 24.73, 50.53, 4.57, 0], \"contatos\": 325, \"pipeline\": 150}, \"13\": {\"tot\": 1102.55, \"c\": [582.52, 104.23, 240.15, 54.29, 19.94, 52.3, 49.12, 0], \"contatos\": 548, \"pipeline\": 241}, \"14\": {\"tot\": 939.28, \"c\": [431.81, 110.03, 222.45, 61.24, 13.54, 51.1, 49.11, 0], \"contatos\": 538, \"pipeline\": 232}, \"15\": {\"tot\": 892.65, \"c\": [400.38, 97.87, 200.79, 76.86, 17.47, 50.2, 49.08, 0], \"contatos\": 444, \"pipeline\": 156}, \"16\": {\"tot\": 702.27, \"c\": [230.41, 93.84, 199.96, 59.32, 21.23, 48.45, 49.06, 0], \"contatos\": 321, \"pipeline\": 144}, \"17\": {\"tot\": 908.5, \"c\": [442.48, 98.47, 200.99, 51.75, 17.53, 48.24, 49.04, 0], \"contatos\" => n===null ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'x';\nconst $ = id => document.getElementById(id);\nconst DOW=['dom','seg','ter','qua','qui','sex','sáb'];\nconst st = { mes: MID.meses.length-1, de:null, ate:null, camp:'__cons' };\n\nconst M = () => MID.meses[st.mes];\nconst dd = (m,d) => String(d).padStart(2,'0')+'/'+String(m.mes).padStart(2,'0');\nconst dow = (m,d) => DOW[new Date(m.ano,m.mes-1,d).getDay()];\nconst diasDisp = m => Object.keys(m.dias).map(Number).sort((a,b)=>a-b);\n\nfunction filtros(){\n  const m=M(), ds=diasDisp(m);\n  if(st.de===null){ st.de=ds[0]; st.ate=ds[ds.length-1]; }\n  const opt = sel => ds.map(d=>`<option value=\"${d}\"${d===sel?' selected':''}>${dd(m,d)}<\/option>`).join('');\n  $('fMes').innerHTML = MID.meses.map((x,i)=>`<option value=\"${i}\"${i===st.mes?' selected':''}>${x.label}<\/option>`).join('');\n  $('fDe').innerHTML = opt(st.de); $('fAte').innerHTML = opt(st.ate);\n  $('fCamp').innerHTML = `<option value=\"__cons\"${st.camp==='__cons'?' selected':''}>Consolidado (todas somadas)<\/option>`+\n    `<option value=\"__todas\"${st.camp==='__todas'?' selected':''}>Todas as campanhas, lado a lado<\/option>`+\n    m.camps.map((c,i)=>`<option value=\"${i}\"${String(i)===st.camp?' selected':''}>${c}<\/option>`).join('');\n}\n\nfunction render(){\n  filtros();\n  const m=M(), de=Math.min(st.de,st.ate), ate=Math.max(st.de,st.ate);\n  const ds = diasDisp(m).filter(d=>d>=de && d<=ate);\n  const ultVenda = Math.max(0,...Object.keys(m.vendas).map(Number));\n  $('periodo').textContent = `${m.label} · ${dd(m,de)} a ${dd(m,ate)}`;\n  $('subCons').textContent = `${ds.length} dias`;\n\n  const tot = ds.reduce((s,d)=>s+m.dias[d].tot,0);\n  const cont = ds.reduce((s,d)=>s+m.dias[d].contatos,0);\n  const pipe = ds.reduce((s,d)=>s+m.dias[d].pipeline,0);\n  const dsR = ds.filter(d=>d<=ultVenda);\n  const invR = dsR.reduce((s,d)=>s+m.dias[d].tot,0), venR = dsR.reduce((s,d)=>s+(m.vendas[d]||0),0);\n  const porCamp = m.camps.map((c,i)=>ds.reduce((s,d)=>s+m.dias[d].c[i],0));\n  const ativas = porCamp.filter(v=>v>0).length;\n\n  $('kInv').textContent = fR(tot);\n  $('kInvDet').textContent = `média de ${fR(tot/(ds.length||1))} por dia`;\n  $('kRoas').textContent = fX(invR ? venR/invR : null);\n  $('kRoasDet').textContent = dsR.length ? `vendas ÷ investimento · ${fR(venR)} em vendas de ${dd(m,dsR[0])} a ${dd(m,dsR[dsR.length-1])}` : 'sem vendas lançadas no período';\n  $('kCont').textContent = fN(cont);\n  $('kContDet').textContent = `média de ${fN(Math.round(cont/(ds.length||1)))} por dia`;\n  $('kPipe').textContent = fN(pipe);\n  $('kPipeDet').textContent = `média de ${fN(Math.round(pipe/(ds.length||1)))} por dia`;\n  $('kConv').textContent = fP(cont ? pipe/cont*100 : null);\n  $('kCamp').textContent = `${ativas} de ${m.camps.length}`;\n  $('kCampDet').textContent = 'com investimento no período';\n\n  // Por campanha\n  $('tCamp').innerHTML = `<thead><tr><th>Campanha<\/th><th>Investimento<\/th><th>% do total<\/th><th>Média por dia<\/th><th>Dias com investimento<\/th><\/tr><\/thead><tbody>`+\n    m.camps.map((c,i)=>{ const v=porCamp[i], n=ds.filter(d=>m.dias[d].c[i]>0).length;\n      return `<tr class=\"${v?'':'zero'}\"><td>${c}<\/td><td>${fR(v)}<\/td><td>${fP(tot?v/tot*100:null)}<\/td><td>${fR(v/(ds.length||1))}<\/td><td>${n} de ${ds.length}<\/td><\/tr>`; }).join('')+\n    `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(tot)}<\/td><td>${fP(tot?100:null)}<\/td><td>${fR(tot/(ds.length||1))}<\/td><td><\/td><\/tr><\/tbody>`;\n\n  // Diário\n  const lbl = d => `${dd(m,d)}<span class=\"dow\">${dow(m,d)}<\/span>`;\n  let h='';\n  if(st.camp==='__cons'){\n    h = `<thead><tr><th>Dia<\/th><th>Investimento<\/th><th>Vendas<\/th><th>ROAS<\/th><th>Contatos<\/th><th>Pipeline<\/th><th>Conversão<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>{ const x=m.dias[d], temV=d<=ultVenda, v=m.vendas[d]||0;\n        return `<tr><td>${lbl(d)}<\/td><td>${fR(x.tot)}<\/td><td>${temV?fR(v):'<span class=\"sub\">—<\/span>'}<\/td><td>${temV&&x.tot?fX(v/x.tot):'<span class=\"sub\">—<\/span>'}<\/td><td>${fN(x.contatos)}<\/td><td>${fN(x.pipeline)}<\/td><td>${fP(x.contatos?x.pipeline/x.contatos*100:null)}<\/td><\/tr>`; }).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(tot)}<\/td><td>${fR(venR)}<\/td><td>${fX(invR?venR/invR:null)}<\/td><td>${fN(cont)}<\/td><td>${fN(pipe)}<\/td><td>${fP(cont?pipe/cont*100:null)}<\/td><\/tr><\/tbody>`;\n  } else if(st.camp==='__todas'){\n    h = `<thead><tr><th>Dia<\/th>${m.camps.map(c=>`<th>${c}<\/th>`).join('')}<th>Total<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>`<tr><td>${lbl(d)}<\/td>${m.dias[d].c.map(v=>`<td>${v?fR(v):'<span class=\"sub\">R$ 0,00<\/span>'}<\/td>`).join('')}<td><strong>${fR(m.dias[d].tot)}<\/strong><\/td><\/tr>`).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td>${porCamp.map(v=>`<td>${fR(v)}<\/td>`).join('')}<td>${fR(tot)}<\/td><\/tr><\/tbody>`;\n  } else {\n    const i=+st.camp, v=porCamp[i];\n    h = `<thead><tr><th>Dia<\/th><th>Investimento · ${m.camps[i]}<\/th><th>% do investimento do dia<\/th><th>Investimento total do dia<\/th><\/tr><\/thead><tbody>`+\n      ds.map(d=>{ const x=m.dias[d], c=x.c[i];\n        return `<tr class=\"${c?'':'zero'}\"><td>${lbl(d)}<\/td><td>${fR(c)}<\/td><td>${fP(x.tot?c/x.tot*100:null)}<\/td><td>${fR(x.tot)}<\/td><\/tr>`; }).join('')+\n      `<tr class=\"total\"><td>TOTAL<\/td><td>${fR(v)}<\/td><td>${fP(tot?v/tot*100:null)}<\/td><td>${fR(tot)}<\/td><\/tr><\/tbody>`;\n  }\n  $('tDia').innerHTML = h;\n  $('nota').textContent = `Investimento em mídia = soma das ${m.camps.length} campanhas. Vendas = total vendido do dia no Dashboard comercial, lançado até ${dd(m,ultVenda)}; o ROAS considera só os dias com vendas lançadas. Contatos e pipeline vêm do GHL.`;\n}\n$('fMes').addEventListener('change', e=>{ st.mes=+e.target.value; st.de=null; render(); });\n$('fDe').addEventListener('change', e=>{ st.de=+e.target.value; render(); });\n$('fAte').addEventListener('change', e=>{ st.ate=+e.target.value; render(); });\n$('fCamp').addEventListener('change', e=>{ st.camp=e.target.value; render(); });\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};
const NOMES = {big:'Big numbers', vendas:'Dashboard comercial', closers:'Performance closers', sdr:'Performance SDRs', midia:'Mídia e contatos'};
function mostrar(v){
  if(!DASH[v]) v='big';
  for(const k in DASH){
    const f=document.getElementById('f-'+k);
    if(k===v && !f.srcdoc) f.srcdoc = DASH[k];
    f.hidden = k!==v;
  }
  document.querySelectorAll('nav a').forEach(a=>{ if(a.dataset.v===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.getElementById('atual').textContent = NOMES[v];
  document.title = 'HOD · ' + NOMES[v];
  document.body.classList.remove('aberto');
}
window.addEventListener('hashchange', ()=>mostrar(location.hash.slice(1)));
mostrar(location.hash.slice(1) || 'big');
try{ if(localStorage.getItem('hod-menu-min')==='1') document.body.classList.add('min'); }catch(e){}
document.getElementById('recolher').addEventListener('click', ()=>{
  const min=document.body.classList.toggle('min');
  document.getElementById('recolher').setAttribute('aria-label', min?'Expandir menu':'Recolher menu');
  try{ localStorage.setItem('hod-menu-min', min?'1':'0'); }catch(e){}
});
document.getElementById('menu').addEventListener('click', ()=>document.body.classList.add('aberto'));
document.getElementById('veu').addEventListener('click', ()=>document.body.classList.remove('aberto'));
</script>
