<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOD · Painel Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1B2A17; --side-2:#22341D; --side-linha:rgba(245,246,242,.10);
  --side-txt:#C7D6C1; --side-txt-forte:#F5F6F2; --ativo:#4F7345;
  --fundo:#F5F6F2; --w:256px; --w-min:68px;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fundo:#141A12; } }
:root[data-theme="dark"]{ --fundo:#141A12; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fundo);display:flex;overflow:hidden}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

aside{width:var(--w);flex:0 0 var(--w);height:100%;background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;border-right:1px solid var(--side-linha);transition:width .2s ease,flex-basis .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.marca{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:20px 16px 18px 20px;border-bottom:1px solid var(--side-linha)}
.marca .logo{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--side-txt-forte);white-space:nowrap}
.marca .logo small{display:block;font-family:'Public Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-txt);opacity:.8;margin-top:2px}
.btn-ico{border:0;background:transparent;color:var(--side-txt);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:0 0 30px}
.btn-ico:hover{background:var(--side-2);color:var(--side-txt-forte)}
.btn-ico svg{width:18px;height:18px;transition:transform .2s}
nav{padding:14px 10px;display:grid;gap:4px}
.grupo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-txt);opacity:.6;padding:10px 12px 6px;white-space:nowrap}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-txt);text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden}
nav a svg{width:19px;height:19px;flex:0 0 19px}
nav a:hover{background:var(--side-2);color:var(--side-txt-forte)}
nav a[aria-current="page"]{background:var(--ativo);color:var(--side-txt-forte);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
nav a:focus-visible,.btn-ico:focus-visible{outline:2px solid #9AC98A;outline-offset:2px}
.rodape{margin-top:auto;padding:14px 20px 18px;border-top:1px solid var(--side-linha);font-size:12px;line-height:1.45;color:var(--side-txt);opacity:.75;white-space:nowrap;overflow:hidden}

/* recolhido */
body.min aside{width:var(--w-min);flex-basis:var(--w-min)}
body.min .marca{padding:20px 0 18px;justify-content:center}
body.min .marca .logo, body.min .grupo, body.min nav a span, body.min .rodape{display:none}
body.min nav a{justify-content:center;padding:10px 0}
body.min .btn-ico svg{transform:rotate(180deg)}

main{flex:1;min-width:0;height:100%;position:relative}
iframe{border:0;width:100%;height:100%;display:block;background:var(--fundo)}
iframe[hidden]{display:none}

/* mobile */
.topo{display:none}
@media (max-width:820px){
  body{flex-direction:column}
  .topo{display:flex;align-items:center;gap:10px;background:var(--side);color:var(--side-txt-forte);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));flex:0 0 auto}
  .topo .logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px}
  .topo .atual{font-size:13px;color:var(--side-txt);margin-left:auto}
  aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s ease;width:var(--w)!important;flex-basis:auto!important;box-shadow:8px 0 24px rgba(0,0,0,.25)}
  body.aberto aside{transform:none}
  body.min .marca .logo, body.min .grupo, body.min nav a span, body.min .rodape{display:block}
  body.min nav a{justify-content:flex-start;padding:10px 12px}
  #recolher{display:none}
  .veu{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
  body.aberto .veu{display:block}
  main{height:auto;flex:1}
}
</style>
</head>
<body>
<div class="topo">
  <button class="btn-ico" id="menu" aria-label="Abrir menu" style="color:#F5F6F2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span class="logo">HOD</span>
  <span class="atual" id="atual"></span>
</div>

<aside aria-label="Navegação">
  <div class="marca">
    <div class="logo">HOD<small>Painel Comercial</small></div>
    <button class="btn-ico" id="recolher" aria-label="Recolher menu" title="Recolher menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
  <nav>
    <div class="grupo">Dashboards</div>
    <a href="#big" data-v="big" title="Big numbers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span>Big numbers</span></a>
    <a href="#vendas" data-v="vendas" title="Dashboard comercial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/></svg><span>Dashboard comercial</span></a>
    <a href="#closers" data-v="closers" title="Performance closers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.4-.3 4.4 1.2 5 4.3"/></svg><span>Performance closers</span></a>
    <a href="#sdr" data-v="sdr" title="Performance SDRs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13v-1a7.5 7.5 0 0 1 15 0v1"/><rect x="3.5" y="13" width="4" height="6" rx="1.5"/><rect x="16.5" y="13" width="4" height="6" rx="1.5"/><path d="M18.5 19c0 1.4-1.6 2-4 2h-1.5"/></svg><span>Performance SDRs</span></a>
    <a href="#midia" data-v="midia" title="Mídia e contatos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></svg><span>Mídia e contatos</span></a>
    <a href="#leads" data-v="leads" title="Leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5h17l-6.5 7.5V19l-4 1.5v-8z"/></svg><span>Leads</span></a>
    <a href="#agenda" data-v="agenda" title="Agenda G4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 14.5h3"/></svg><span>Agenda G4</span></a>
  </nav>
  <div class="rodape">Home Office Digital</div>
</aside>
<main>
  <iframe id="f-big" title="Big numbers" hidden></iframe>
  <iframe id="f-vendas" title="Dashboard comercial" hidden></iframe>
  <iframe id="f-closers" title="Performance closers" hidden></iframe>
  <iframe id="f-sdr" title="Performance SDRs" hidden></iframe>
  <iframe id="f-midia" title="Mídia e contatos" hidden></iframe>
  <iframe id="f-leads" title="Leads" hidden></iframe>
  <iframe id="f-agenda" title="Agenda G4" hidden></iframe>
</main>
<script>
const DASH = {
"agenda": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>HOD · Agenda G4<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --verde:#263A21; --verde-3:#4F7345; --fundo:#F5F6F2; --card:#FFFFFF; --linha:#D7DECD; --mdf:#E7EEE3;\n  --tinta:#1C2419; --tinta-2:#5B6B54; --ouro:#B8862F; --tb:#3E5C37; --tb-bg:#EEF3EA;\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n  --fundo:#141A12; --card:#1C241A; --linha:#33412F; --mdf:#243021; --tinta:#E8EDE4; --tinta-2:#A3B39B; --ouro:#E0B46E; --tb:#9AC98A; --tb-bg:#1F2B1C; } }\n:root[data-theme=\"dark\"]{ --fundo:#141A12; --card:#1C241A; --linha:#33412F; --mdf:#243021; --tinta:#E8EDE4; --tinta-2:#A3B39B; --ouro:#E0B46E; --tb:#9AC98A; --tb-bg:#1F2B1C; }\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fundo);color:var(--tinta);font-size:15px;line-height:1.5}\nh2,.num{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;letter-spacing:-.01em}\nmain{max-width:1280px;margin:0 auto;padding:22px 24px 60px}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.destaques{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:22px}\n.dest{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:16px 20px;display:flex;gap:16px;align-items:center;text-align:left;width:100%}\n.dest.hoje{background:var(--verde);border-color:var(--verde);color:#F5F6F2}\n.dest .rot{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;opacity:.8}\n.dest .tit{font-size:17px;font-weight:600;line-height:1.3;margin-top:2px}\n.dest .quando{font-size:13.5px;opacity:.85;margin-top:2px}\n.dest.vazio{color:var(--tinta-2);cursor:default}\n.cal-dia{flex:none;width:52px;border:1px solid var(--linha);border-radius:10px;overflow:hidden;text-align:center;background:var(--card);color:var(--tinta)}\n.cal-dia b{display:block;font-size:11px;font-weight:600;text-transform:uppercase;background:var(--mdf);color:var(--tinta-2);padding:2px 0}\n.cal-dia span{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:600;padding:2px 0 4px}\n.barra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}\n.barra h2{font-size:22px;font-weight:600;min-width:200px}\n.barra .sub{font-size:13px;color:var(--tinta-2)}\n.nav{display:flex;gap:8px;margin-left:auto}\n.btn{border:1px solid var(--linha);background:var(--card);border-radius:10px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}\n.btn:hover{border-color:var(--verde-3)}\n.btn[aria-pressed=\"true\"]{background:var(--verde);border-color:var(--verde);color:#F5F6F2}\n.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:13px;color:var(--tinta-2)}\n.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}\n.mes{background:var(--card);border:1px solid var(--linha);border-radius:12px;overflow:hidden}\n.mes-cab,.mes-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}\n.mes-cab div{padding:10px;text-align:center;font-size:13px;color:var(--tinta-2);border-bottom:1px solid var(--linha)}\n.cel{min-height:118px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0}\n.cel:nth-child(7n){border-right:0}\n.cel.fora{background:var(--fundo)}\n.cel.fora .n{color:var(--tinta-2);opacity:.5}\n.cel .n{font-size:13px;font-weight:600;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%}\n.cel.hoje .n{background:var(--verde);color:#F5F6F2}\n.ev{display:flex;align-items:center;gap:6px;border:1px solid var(--linha);border-left:4px solid var(--c);border-radius:8px;background:var(--card);padding:4px 7px;font-size:12.5px;text-align:left;width:100%;min-width:0}\n.ev:hover{background:var(--tb-bg)}\n.ev .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}\n.ev .h{flex:none;color:var(--tinta-2)}\n.ev.passou{opacity:.55}\n.lista{display:flex;flex-direction:column;gap:18px}\n.dia-l h3{font-size:14px;font-weight:600;color:var(--tinta-2);margin-bottom:8px}\n.dia-l.hoje h3{color:var(--tb)}\n.item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--linha);border-left:5px solid var(--c);border-radius:10px;padding:12px 16px;width:100%;text-align:left;margin-bottom:8px}\n.item:hover{background:var(--tb-bg)}\n.item .hr{flex:none;width:96px;font-weight:600}\n.item .tx{flex:1;min-width:0}\n.item .tx b{display:block;font-weight:600}\n.item .tx span{font-size:13px;color:var(--tinta-2)}\n.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--tinta);white-space:nowrap}\n.vazio-l{background:var(--card);border:1px dashed var(--linha);border-radius:12px;padding:30px;text-align:center;color:var(--tinta-2)}\n.veu{position:fixed;inset:0;background:rgba(10,16,9,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}\n.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--linha);transform:translateX(100%);transition:transform .22s;z-index:21;display:flex;flex-direction:column}\nbody.det .veu{opacity:1;pointer-events:auto}\nbody.det .gaveta{transform:none}\n.gav-cab{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--linha);font-weight:600}\n.gav-corpo{padding:20px;overflow:auto;flex:1;display:flex h1><small>Eventos ao vivo do G4 para o time HOD<\/small><\/div>\n  <\/div>\n  <div class=\"hodtop-acts\"><\/div>\n<\/div><\/div>\n<main>\n  <div class=\"destaques\" id=\"destaques\"><\/div>\n  <div class=\"barra\">\n    <h2 id=\"titMes\"><\/h2>\n    <span class=\"sub\" id=\"contMes\"><\/span>\n    <div class=\"nav\">\n      <button class=\"btn\" id=\"vMes\" aria-pressed=\"true\">Mês<\/button>\n      <button class=\"btn\" id=\"vLista\" aria-pressed=\"false\">Lista<\/button>\n      <button class=\"btn\" id=\"ant\" aria-label=\"Mês anterior\">‹<\/button>\n      <button class=\"btn\" id=\"hojeB\">Hoje<\/button>\n      <button class=\"btn\" id=\"prox\" aria-label=\"Próximo mês\">›<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"legenda\" id=\"legenda\"><\/div>\n  <div id=\"vista\"><\/div>\n  <p class=\"nota\">Eventos ao vivo da plataforma G4 Business. O acesso é pelo login de cada um na plataforma; o link do evento costuma aparecer pouco antes do início. Fonte: planilha \"Agenda G4\", atualizada pelo time.<\/p>\n<\/main>\n<div class=\"veu\" id=\"veu\"><\/div>\n<aside class=\"gaveta\" id=\"gaveta\" aria-label=\"Detalhes do evento\">\n  <div class=\"gav-cab\">Detalhes do evento<button class=\"btn\" id=\"fechar\" aria-label=\"Fechar\">✕<\/button><\/div>\n  <div class=\"gav-corpo\" id=\"gavCorpo\"><\/div>\n  <div class=\"gav-pe\"><a class=\"acessar\" id=\"gavLink\" target=\"_blank\" rel=\"noopener\">Acessar evento<\/a><\/div>\n<\/aside>\n<script type=\"text/plain\" id=\"app-agenda\">\nconst EVENTOS = [{\"d\": \"2026-11-12\", \"i\": \"17:00\", \"t\": \"Hot Seat com Tallis Gomes\", \"tipo\": \"Hot Seat\", \"conv\": \"Tallis Gomes\"}, {\"d\": \"2026-11-12\", \"i\": \"19:00\", \"t\": \"Como destravar o caixa que sua empresa não vê\", \"tipo\": \"Monitoria\", \"conv\": \"Luccas Riedo\"}, {\"d\": \"2026-11-17\", \"i\": \"19:00\", \"t\": \"Como prever problemas antes que eles corroam sua margem\", \"tipo\": \"Monitoria\", \"conv\": \"Rogério Vargas\"}, {\"d\": \"2026-11-18\", \"i\": \"17:00\", \"t\": \"Como usar IA para reter e expandir a receita do seu negócio\", \"tipo\": \"Programa de Aceleração em IA\", \"conv\": \"Guilherme Barboza\"}, {\"d\": \"2026-11-19\", \"i\": \"17:00\", \"t\": \"Hot Seat com Bruno Nardon\", \"tipo\": \"Hot Seat\", \"conv\": \"Bruno Nardon\"}, {\"d\": \"2026-11-19\", \"i\": \"19:00\", \"t\": \"Aquisição de clientes com IA: por onde começar\", \"tipo\": \"Monitoria\", \"conv\": \"Antônio Santos\"}, {\"d\": \"2026-11-24\", \"i\": \"19:00\", \"t\": \"Como resolver o problema certo com método\", \"tipo\": \"Monitoria\", \"conv\": \"Eduardo Bacetti\"}, {\"d\": \"2026-11-25\", \"i\": \"16:30\", \"t\": \"Mentoria Coletiva com Theo Orosco\", \"tipo\": \"Mentoria\", \"conv\": \"Theo Orosco\"}, {\"d\": \"2026-11-25\", \"i\": \"17:00\", \"t\": \"Como automatizar sua operação com SOPs e IA\", \"tipo\": \"Programa de Aceleração em IA\", \"conv\": \"Christian Pedrosa\"}, {\"d\": \"2026-11-26\", \"i\": \"19:00\", \"t\": \"Como ter mais mais caixa: sem depender de vender mais\", \"tipo\": \"Monitoria\", \"conv\": \"André Amaral\"}];\nconst $ = id => document.getElementById(id);\nconst MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];\nconst SEM = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];\nconst SEM_L = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];\nconst PALETA = ['#B8862F','#3E7CB1','#4F7345','#8E5BA8','#C0623F','#2A9D8F','#7A6F45','#B04A6F'];\nconst esc = s => String(s==null?'':s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\nconst hoje = new Date(), HOJE = iso(hoje);\nconst ev = EVENTOS.filter(e => /^\\d{4}-\\d{2}-\\d{2}$/.test(e.d) && e.t)\n  .sort((a,b) => (a.d+(a.i||'')).localeCompare(b.d+(b.i||'')));\nconst tipos = [...new Set(ev.map(e => e.tipo || 'Outros'))];\nconst cor = t => PALETA[tipos.indexOf(t || 'Outros') % PALETA.length];\nconst horario = e => e.i ? (e.f ? e.i + ' – ' + e.f : e.i) : 'horário a definir';\nconst dataLonga = d => { const x = new Date(d+'T12:00:00'); return SEM_L[x.getDay()].charAt(0).toUpperCase() + SEM_L[x.getDay()].slice(1) + ', ' + x.getDate() + ' de ' + MESES[x.getMonth()]; };\nconst passou = e => e.d < HOJE || (e.d === HOJE && (e.f || e.i) && (e.f || e.i) < String(hoje.getHours()).padStart(2,'0')+':'+String(hoje.getMinutes()).padStart(2,'0'));\n\nlet ano = hoje.getFullYear(), mes = hoje.getMonth();\nlet modo = window.innerWidth < 720 ? 'lista' : 'mes';\ntry { const m = localStorage.getItem('hod-agenda-modo'); if (m) modo = m; } catch(e) {}\n\nfunction calDia(d){ const x = new Date(d+'T12:00:00'); return `<div class=\"cal-dia\"><b>${MESES[x.getMonth()].slice(0,3)}<\/b><span>${x.getDate()}<\/span><\/div>`; }\n\nfunction destaques(){\n  const deHoje = ev.filter(e => e.d === HOJE && !passou(e));\n  const prox = ev.filter(e => e.d > HOJE)[0];\n  const card = (e, rot, cls) => e\n    ? `<button class=\"dest ${cls}\" data-k=\"${ev.indexOf(e)}\">${calDia(e.d)}<div><div class=\"rot\">${rot}<\/div><div class=\"tit\">${esc(e.t)}<\/div><div class=\"quando\">${horario(e)}${e.tipo ? ' · ' + esc(e.tipo) : ''}<\/div><\/div><\/button>`\n    : `<div class=\"dest vazio ${cls==='hoje'?'':''}\"><div><div class=\"rot\">${rot}<\/div><div class=\"tit\">Nenhum evento<\/div><\/div><\/div>`;\n  $('destaques').innerHTML =\n    card(deHoje[0], deHoje.length > 1 ? `Hoje · ${deHoje.length} eventos` : 'Hoje', deHoje.length ? 'hoje' : '') +\n    card(prox, 'Próximo evento', '');\n}\n\nfunction legenda(){\n  $('legenda').innerHTML = tipos.map(t => `<span><i style=\"background:${cor(t)}\"><\/i>${esc(t)}<\/span>`).join('');\n}\n\nfunction vistaMes(){\n  const doMes = ev.filter(e => e.d.startsWith(ano+'-'+String(mes+1).padStart(2,'0')));\n  const ini = new Date(ano, mes, 1), dIni = ini.getDay(), nDias = new Date(ano, mes+1, 0).getDate();\n  const total = Math.ceil((dIni + nDias)/7)*7;\n  let h = '<div class=\"mes\"><div class=\"mes-cab\">' + SEM.map(s=>`<div>${s}<\/div>`).join('') + '<\/div><div class=\"mes-grade\">';\n  for (let k = 0; k < total; k++){\n    const d = new Date(ano, mes, 1 - dIni + k), di = iso(d), fora = d.getMonth() !== mes;\n    const es = ev.filter(e => e.d === di);\n    h += `<div class=\"cel${fora?' fora':''}${di===HOJE?' hoje':''}\"><div class=\"n\">${d.getDate()}<\/div>` +\n      es.map(e => `<button class=\"ev${passou(e)?' passou':''}\" style=\"--c:${cor(e.tipo)}\" data-k=\"${ev.indexOf(e)}\" title=\"${esc(e.t)}\"><span class=\"t\">${esc(e.t)}<\/span><span class=\"h\">${e.i||''}<\/span><\/button>`).join('') + '<\/div>';\n  }\n  $('vista').innerHTML = h + '<\/div><\/div>';\n  return doMes.length;\n}\n\nfunction vistaLista(){\n  const pref = ano+'-'+String(mes+1).padStart(2,'0');\n  const doMes = ev.filter(e => e.d.startsWith(pref));\n  if (!doMes.length){ $('vista').innerHTML = '<div class=\"vazio-l\">Nenhum evento cadastrado neste mês.<\/div>'; return 0; }\n  const dias = [...new Set(doMes.map(e => e.d))];\n  $('vista').innerHTML = '<div class=\"lista\">' + dias.map(d => `<div class=\"dia-l${d===HOJE?' hoje':''}\"><h3>${d===HOJE?'Hoje · ':''}${dataLonga(d)}<\/h3>` +\n    doMes.filter(e => e.d === d).map(e => `<button class=\"item${passou(e)?' passou':''}\" style=\"--c:${cor(e.tipo)}\" data-k=\"${ev.indexOf(e)}\"><span class=\"hr\">${horario(e)}<\/span><span class=\"tx\"><b>${esc(e.t)}<\/b><span>${[e.conv, e.formato].filter(Boolean).map(esc).join(' · ')}<\/span><\/span>${e.tipo?`<span class=\"tag\">${esc(e.tipo)}<\/span>`:''}<\/button>`).join('') + '<\/div>').join('') + '<\/div>';\n  return doMes.length;\n}\n\nfunction render(){\n  $('titMes').textContent = MESES[mes].charAt(0).toUpperCase() + MESES[mes].slice(1) + ', ' + ano;\n  $('vMes').setAttribute('aria-pressed', modo==='mes'); $('vLista').setAttribute('aria-pressed', modo==='lista');\n  const n =   <label>Até<input type=\"date\" id=\"f-ate\" min=\"2026-01-01\" max=\"2027-12-31\"><\/label>\n      <label>Fonte<select id=\"f-fonte\" data-source=\"leads\"><\/select><\/label>\n      <label>Tipo de tráfego (meio)<select id=\"f-meio\" data-source=\"leads\"><\/select><\/label>\n      <label class=\"lh-camp\">Campanha<select id=\"f-campanha\" data-source=\"leads\"><\/select><\/label>\n      <label>Classificação<select id=\"f-classificacao\" data-source=\"leads\"><\/select><\/label>\n      <label>Estado<select id=\"f-estado\" data-source=\"leads\"><\/select><\/label>\n      <button class=\"lh-btn\" id=\"f-limpar\" type=\"button\">Limpar filtros<\/button>\n    <\/div>\n  <\/section>\n\n  <nav class=\"lh-tabs\" role=\"tablist\" aria-label=\"Páginas\">\n    <button class=\"lh-tab\" role=\"tab\" data-tab=\"visao\">Visão geral<\/button>\n    <button class=\"lh-tab\" role=\"tab\" data-tab=\"perfil\">Perfil dos leads<\/button>\n    <button class=\"lh-tab\" role=\"tab\" data-tab=\"confronto\">Leads × Ganho<\/button>\n    <button class=\"lh-tab\" role=\"tab\" data-tab=\"converte\">O que mais converte?<\/button>\n    <button class=\"lh-tab\" role=\"tab\" data-tab=\"funis\">Funis de mídia<\/button>\n  <\/nav>\n\n  <section id=\"visao\" class=\"lh-page\" data-source=\"leads\">\n    <div class=\"lh-kpis\" id=\"kpis\"><\/div>\n    <div class=\"lh-grid\" style=\"margin-top:var(--cds-gap-md)\">\n      <div class=\"lh-card\"><h2 id=\"c-dia\">Registros por dia<\/h2><p class=\"lh-note\">Data de cadastro do lead (horário de Brasília)<\/p><div class=\"lh-chart\" id=\"ch-dia\"><\/div><\/div>\n      <div class=\"lh-card\"><h2 id=\"c-venda\">Ganhos por data da venda<\/h2><p class=\"lh-note\">Coluna data_venda (AJ), que define o ganho<\/p><div class=\"lh-chart\" id=\"ch-venda\"><\/div><\/div>\n    <\/div>\n    <h2 style=\"font-size:var(--cds-font-size-heading);font-weight:var(--cds-font-weight-medium);margin:var(--cds-gap-lg) 0 var(--cds-gap-sm)\">Origem e aquisição — todos os leads<\/h2>\n    <div class=\"lh-grid\" id=\"origem\"><\/div>\n  <\/section>\n\n  <section id=\"perfil\" class=\"lh-page\" data-source=\"leads\" hidden>\n    <p class=\"lh-note\" style=\"margin-top:0\">Distribuição das respostas de todos os registros filtrados. “(sem dados)” = campo em branco na planilha.<\/p>\n    <div class=\"lh-grid\" id=\"perfil-grid\"><\/div>\n  <\/section>\n\n  <section id=\"confronto\" class=\"lh-page\" data-source=\"leads\" hidden>\n    <div class=\"lh-kpis\" id=\"kpis-conf\"><\/div>\n    <p class=\"lh-note\" style=\"margin-top:var(--cds-gap-md)\">Em cada tabela, “% leads” é a participação da resposta entre todos os registros filtrados e “% ganhos”, entre os ganhos. Diferença = % ganhos − % leads, em pontos percentuais (p.p.): positiva quando a resposta pesa mais entre os ganhos do que na base; diferenças de 5 p.p. ou mais ficam em negrito.Ganhos sem formulário aparecem como “(sem dados)” e entram na base dos ganhos.<\/p>\n    <div class=\"lh-ctrl lh-filters\" style=\"margin:0\">\n      <label>Ordenar por<select id=\"c-sort\">\n        <option value=\"padrao\">Ordem padrão da resposta<\/option>\n        <option value=\"a\">Leads<\/option>\n        <option value=\"pa\">% leads<\/option>\n        <option value=\"b\">Ganhos<\/option>\n        <option value=\"pb\">% ganhos<\/option>\n        <option value=\"diff\">Diferença (p.p.)<\/option>\n      <\/select><\/label>\n      <label>Sentido<select id=\"c-dir\">\n        <option value=\"-1\">Maior → menor<\/option>\n        <option value=\"1\">Menor → maior<\/option>\n      <\/select><\/label>\n    <\/div>\n    <div class=\"lh-grid\" id=\"conf-grid\" style=\"margin-top:var(--cds-gap-md);grid-template-columns:repeat(auto-fit,minmax(min(100%,34rem),1fr))\"><\/div>\n  <\/section>\n\n  <section id=\"converte\" class=\"lh-page\" data-source=\"leads\" hidden>\n    <div class=\"lh-kpis\" id=\"kpis-ganho\"><\/div>\n    <div class=\"lh-card\" style=\"margin-top:var(--cds-gap-md)\">\n      <h2 id=\"c-converte\">O que mais converte?<\/h2>\n      <p class=\"lh-note\">Cruza as respostas do formulário com ganhos (data_venda preenchida) e score médio. Conversão = ganhos ÷ leads da resposta.<\/p>\n      <div class=\"lh-ctrl lh-filters\">\n        <label>Variável<select id=\"t-var\"><\/select><\/label>\n        <label>Mínimo de leads por resposta<select id=\"t-min\"><option value=\"1\">1<\/option><option value=\"30\">30<\/option><option value=\"100\">100<\/option><option value=\"250\">250<\/option><\/select><\/label>\n      <\/div>\n      <div class=\"lh-tablewrap\">\n        <table class=\"lh-table\" id=\"t-conv\">\n          <thead><tr>\n            <th><button data-sort=\"var\">Variável<\/button><\/th>\n            <th><button data-sort=\"resp\">Resposta<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"leads\">Leads<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"score\">Score médio<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"vendas\">Vendas<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"conv\">Conversão<\/button><\/th>\n          <\/tr><\/thead>\n          <tbody><\/tbody>\n        <\/table>\n      <\/div>\n      <p class=\"lh-note\" id=\"t-foot\" style=\"margin-bottom:0\"><\/p>\n    <\/div>\n    <div class=\"lh-card\" style=\"margin-top:var(--cds-gap-md)\">\n      <h2 id=\"c-plano\">Ganhos por plano<\/h2>\n      <p class=\"lh-note\">Coluna venda (plano) entre os ganhos<\/p>\n      <div class=\"lh-bars\" id=\"planos\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"funis\" class=\"lh-page\" data-source=\"leads\" hidden>\n    <div class=\"lh-kpis\" id=\"kpis-funis\"><\/div>\n    <div class=\"lh-card\" style=\"margin-top:var(--cds-gap-md)\">\n      <h2 id=\"c-funis\">Qual funil converte melhor?<\/h2>\n      <p class=\"lh-note\">Funil = combinação de fonte › meio › campanha › conteúdo. Conversão = ganhos ÷ leads do funil.<\/p>\n      <div class=\"lh-ctrl lh-filters\">\n        <label>Agrupar por<select id=\"fu-nivel\">\n          <option value=\"fonte|meio|campanha|conteudo\">Funil completo (fonte › meio › campanha › conteúdo)<\/option>\n          <option value=\"fonte|meio|campanha\">Fonte › meio › campanha<\/option>\n          <option value=\"fonte|meio\">Fonte › meio<\/option>\n          <option value=\"fonte\">Só fonte<\/option>\n          <option value=\"meio\">Só meio<\/option>\n          <option value=\"campanha\">Só campanha<\/option>\n          <option value=\"conteudo\">Só conteúdo<\/option>\n        <\/select><\/label>\n        <label>Mínimo de leads por funil<select id=\"fu-min\"><option value=\"1\">1<\/option><option value=\"30\">30<\/option><option value=\"100\">100<\/option><option value=\"250\">250<\/option><\/select><\/label>\n      <\/div>\n      <div class=\"lh-tablewrap\">\n        <table class=\"lh-table lh-funtable\" id=\"fu-table\">\n          <thead><tr>\n            <th><button data-sort=\"label\">Funil<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"leads\">Leads<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"ganhos\">Ganhos<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"conv\">Conversão<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"receita\">Receita<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"rpl\">Receita por lead<\/button><\/th>\n            <th class=\"lh-n\"><button data-sort=\"score\">Score médio<\/button><\/th>\n          <\/tr><\/thead>\n          <tbody><\/tbody>\n        <\/table>\n      <\/div>\n      <p class=\"lh-note\" id=\"fu-foot\" style=\"margin-bottom:0\"><\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"lh-card lh-method\" id=\"metodo\">\n    <h3 style=\"margin-bottom:var(--cds-gap-xs)\">Como ler<\/h3>\n    <p>Base: cada linha da exportação do Supabase é um registro (cadastros repetidos da mesma pessoa contam mais de uma vez). Ganho = registro com data_venda preenchida (coluna AJ), com ou sem valor. Receita e ticket médio usam só os ganhos que têm valor na coluna O. Nome, e-mail, telefone e dados de rastreamento foram removidos da base do painel.<\/p>\n    <p id=\"m-detalhe\" data-source=\"leads\"><\/p>\n    <p>Não há dados de investimento por campanha, então o painel não mede custo nem ROI.<\/p>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\n  const NF = new Intl.NumberFormat('pt-BR');\n  const PF = new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1});\n  const P0 = new Intl.NumberFormat('pt-BR',{style:'percent',maximumFractionDigits:0});\n  const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});\n  const D1 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});\n  const SD = '(sem dados)';\n  const FILTERS = ['fonte','meio','campanha','classificacao','estado'];\n  const ORIGEM = [{k:'fonte',n:'Fonte'},{k:'meio',n:'Meio (tipo de tráfego)'},{k:'campanha',n:'Campanha'},{k:'conteudo',n:'Conteúdo',top:12}];\n  const VARS = [\n    {k:'tempo_felipe',n:'Tempo acompanhando',order:['Conheci hoje','Menos de 1 semana','Menos de 1 mês','De 1 a 3 meses','Mais de 3 meses']},\n    {k:'experiencia',n:'Experiência'},\n    {k:'renda',n:'Renda',order:['Não tenho renda','Até R$ 1.500','De R$ 1.500 a R$ 2.500','De R$ 2.500 a R$ 4.000','De R$ 4.000 a R$ 6.000','Acima de R$ 6.000']},\n    {k:'situacao_profissional',n:'Situação profissional'},\n    {k:'tempo_disponivel',n:'Tempo disponível',order:['Menos de 2 horas','De 2 a 4 horas','De 4 a 6 horas','Mais de 6 horas']},\n    {k:'formacao',n:'Formação',order:['Ensino fundamental','Ensino médio','Curso técnico','Ensino superior cursando','Ensino superior completo ou pós-graduação']},\n    {k:'genero',n:'Gênero'},\n    {k:'faixa',n:'Faixa etária',order:['Até 24','25 a 34','35 a 44','45 a 54','55 ou mais']},\n    {k:'computador',n:'Computador'},\n    {k:'capacidade_financeira',n:'Capacidade financeira'},\n    {k:'classificacao',n:'Classificação (score)',order:['frio','morno','quente']},\n    {k:'estado',n:'Estado',top:12}\n  ];\n  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };\n  const val = (v) => (v == null || String(v).trim() === '' ? SD : String(v).trim());\n  const faixa = (i) => i == null ? SD : i < 25 ? 'Até 24' : i < 35 ? '25 a 34' : i < 45 ? '35 a 44' : i < 55 ? '45 a 54' : '55 ou mais';\n\n  let cache = null, cacheSrc = null;\n  function prep(data){\n    if (cacheSrc === data) return cache;\n    cache = data.map((r) => {\n      const idade = r.idade === '' || r.idade == null ? null : Number(r.idade);\n      const score = r.score === '' || r.score == null ? null : Number(r.score);\n      const o = {data: String(r.data || '').slice(0,10), idade, score, valor: Number(r.valor) || 0, ganho: String(r.ganho) === '1', plano: val(r.plano), data_venda: r.data_venda ? String(r.data_venda).slice(0,10) : ''};\n      for (const v of ORIGEM) o[v.k] = val(r[v.k]);\n      for (const v of VARS) if (v.k !== 'faixa') o[v.k] = val(r[v.k]);\n      o.faixa = faixa(idade);\n      return o;\n    });\n    cacheSrc = data; return cache;\n  }\n\n  function applyFilters(rows){\n    const p = dash.params();\n    return rows.filter((r) => {\n      if (p.de && r.data < p.de) return false;\n      if (p.ate && r.data > p.ate) return false;\n      for (const f of FILTERS) if (p[f] && r[f] !== p[f]) return false;\n      return true;\n    });\n  }\n\n  function counts(rows, key, order, top){\n    const m = d3.rollup(rows, (g) => g.length, (r) => r[key]);\n    let items = Array.from(m, ([label, n]) => ({label, n}));\n    if (order) {\n      items.sort((a,b) => { const ia = order.indexOf(a.label), ib = order.indexOf(b.label); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || b.n - a.n; });\n    } else items.sort((a,b) => (a.label === SD) - (b.label === SD) || b.n - a.n);\n    if (top && items.length > top) {\n      const keep = items.filter((d) => d.label !== SD).slice(0, top);\n      const rest = items.filter((d) => !keep.includes(d));\n      const n = d3.sum(rest, (d) => d.n);\n      items = keep.concat(n ? [{label: `Demais (${rest.length})`, n, other: true}] : []);\n    }\n    return items;\n  }\n\n  function barList(box, items, total, color){\n    box.replaceChildren();\n    const max = d3.max(items, (d) => d.n) || 1;\n    for (const d of items) {\n      const row = el('div','lh-row');\n      row.append(el('div','lh-lab' + (d.label === SD || d.other ? ' lh-empty' : ''), d.label));\n      const tr = el('div','lh-track'); const b = el('div','lh-bar');\n      b.style.width = (d.n / max * 100) + '%'; b.style.background = (d.label === SD || d.other) ? 'var(--cds-chart-muted)' : color;\n      tr.append(b); row.append(tr);\n      const v = el('div','lh-val'); v.append(el('b',null,NF.format(d.n)), document.createTextNode(' · ' + P0.format(total ? d.n / total : 0)));\n      row.append(v); box.append(row);\n    }\n  }\n\n  function card(parent, title, note){\n    const c = el('div','lh-card'); c.append(el('h3',null,title));\n    if (note) c.append(el('p','lh-note',note)); else c.lastChild.style.marginBottom = 'var(--cds-gap-md)';\n    const b = el('div','lh-bars'); c.append(b); parent.append(c); return b;\n  }\n\n  function kpis(box, list){\n    box.replaceChildren();\n    for (const k of list) {\n      const c = el('div','lh-card lh-kpi'); c.append(el('div','lh-k',k[0]), el('div','lh-v',k[1]));\n      if (k[2]) c.append(el('div','lh-s',k[2])); box.append(c);\n    }\n  }\n\n  function dayChart(box, rows, key, color, label){\n    box.replaceChildren();\n    const w = Math.max(280, box.clientWidth || 600), h = 220, m = {t:10,r:8,b:26,l:36};\n    const byDay = d3.rollup(rows.filter((r) => r[key]), (g) => g.length, (r) => r[key]);\n    const days = Array.from(byDay, ([d,n]) => ({d, n, date: new Date(d + 'T00:00:00Z')})).sort((a,b) => a.date - b.date);\n    if (!days.length) { box.append(el('p','lh-note','Sem registros no filtro atual.')); return; }\n    const all = d3.utcDay.range(days[0].date, d3.utcDay.offset(days[days.length-1].date, 1));\n    const map = new Map(days.map((d) => [d.d, d.n]));\n    const pts = all.map((dt) => { const k = d3.utcFormat('%Y-%m-%d')(dt); return {date: dt, n: map.get(k) || 0}; });\n    const x = d3.scaleBand(pts.map((d) => +d.date), [m.l, w - m.r]).padding(0.2);\n    const y = d3.scaleLinear([0, d3.max(pts, (d) => d.n) || 1], [h - m.b, m.t]).nice();\n    const svg = d3.select(box).append('svg').attr('width','100%').attr('viewBox',`0 0 ${w} ${h}`);\n    svg.append('g').selectAll('line').data(y.ticks(4)).join('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y).attr('y2',y).attr('stroke','var(--cds-chart-grid)');\n    svg.append('g').selectAll('text').data(y.ticks(4)).join('text').attr('x',m.l-6).attr('y',(d) => y(d)+4).attr('text-anchor','end').attr('fill','var(--color-fg-muted)').attr('font-size',11).text((d) => NF.format(d));\n    const tip = el('div','lh-tip'); tip.hidden = true; box.append(tip);\n    svg.append('g').selectAll('rect').data(pts).join('rect')\n      .attr('x',(d) => x(+d.date)).attr('width',x.bandwidth()).attr('y',(d) => y(d.n)).attr('height',(d) => y(0) - y(d.n)).attr('rx',2).attr('fill',color)\n      .on('mousemove',(ev,d) => { tip.hidden = false; tip.replaceChildren(el('div','lh-tipd',d3.utcFormat('%d/%m/%Y')(d.date)), el('div',null,NF.format(d.n) + ' ' + label)); const [px,py] = d3.pointer(ev, box); tip.style.left = Math.min(px + 10, box.clientWidth - 140) + 'px'; tip.style.top = Math.max(0, py - 40) + 'px'; })\n      .on('mouseleave',() => { tip.hidden = true; });\n    const ticks = x.domain().filter((d,i,a) => i % Math.ceil(a.length / Math.max(2, Math.floor(w / 70))) === 0);\n    svg.append('g').selectAll('text').data(ticks).join('text').attr('x',(d) => x(d) + x.bandwidth()/2).attr('y',h-8).attr('text-anchor','middle').attr('fill','var(--color-fg-muted)').attr('font-size',11).text((d) => d3.utcFormat('%d/%m')(new Date(d)));\n  }\n\n  // ---- filtros\n  const fEls = Object.fromEntries(FILTERS.map((f) => [f, document.getElementById('f-' + f)]));\n  const allLabel = {fonte:'Todas as fontes', meio:'Todo tipo de tráfego', campanha:'Todas as campanhas', classificacao:'Todas as classificações', estado:'Todos os estados'};\n  for (const f of FILTERS) fEls[f].addEventListener('change', () => dash.setParams({[f]: fEls[f].value || null}));\n  const de = document.getElementById('f-de'), ate = document.getElementById('f-ate');\n  for (const [inp, name] of [[de,'de'],[ate,'ate']]) {\n    inp.addEventListener('change', () => { if (!inp.value) dash.setParams({[name]: null}); else if (inp.validity.valid) dash.setParams({[name]: inp.value}); });\n    inp.addEventListener('blur', () => { inp.value = dash.params()[name] || ''; });\n  }\n  document.getElementById('f-limpar').addEventListener('click', () => dash.resetParams());\n\n  // ---- abas\n  const tabs = Array.from(document.querySelectorAll('.lh-tab'));\n  const pages = Array.from(document.querySelectorAll('.lh-page'));\n  let current = 'visao';\n  function show(id, link){\n    current = id;\n    for (const t of tabs) t.setAttribute('aria-selected', String(t.dataset.tab === id));\n    for (const p of pages) p.hidden = p.id !== id;\n    if (link) dash.setLink(id);\n    draw();\n  }\n  for (const t of tabs) t.addEventListener('click', () => show(t.dataset.tab, true));\n\n  // ---- ordenação Leads × Ganho\n  const cSort = document.getElementById('c-sort'), cDir = document.getElementById('c-dir');\n  cSort.addEventListener('change', draw); cDir.addEventListener('change', draw);\n\n  // ---- funis\n  const fuNivel = document.getElementById('fu-nivel'), fuMin = document.getElementById('fu-min');\n  fuMin.value = '30';\n  let fuKey = 'conv', fuDir = -1;\n  fuNivel.addEventListener('change', draw); fuMin.addEventListener('change', draw);\n  document.querySelectorAll('#fu-table th button').forEach((b) => b.addEventListener('click', () => {\n    const k = b.dataset.sort; if (fuKey === k) fuDir = -fuDir; else { fuKey = k; fuDir = k === 'label' ? 1 : -1; } draw();\n  }));\n  const wilson = (k, n) => { if (!n) return [0, 0]; const z = 1.96, p = k / n, den = 1 + z * z / n, c = (p + z * z / (2 * n)) / den, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / den; return [Math.max(0, c - h), Math.min(1, c + h)]; };\n  const semOrigem = (r) => r.fonte === SD && r.meio === SD && r.campanha === SD && r.conteudo === SD;\n\n  // ---- tabela\n  const tVar = document.getElementById('t-var'), tMin = document.getElementById('t-min');\n  tVar.replaceChildren(new Option('Todas as variáveis',''), ...VARS.map((v) => new Option(v.n, v.k)));\n  tMin.value = '30';\n  let sortKey = 'conv', sortDir = -1;\n  tVar.addEventListener('change', draw); tMin.addEventListener('change', draw);\n  document.querySelectorAll('#t-conv th button').forEach((b) => b.addEventListener('click', () => {\n    const k = b.dataset.sort; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = (k === 'var' || k === 'resp') ? 1 : -1; } draw();\n  }));\n\n  function draw(){\n    const s = dash.data('leads');\n    const take = document.getElementById('lh-take');\n    if (s.status !== 'ok') {\n      take.textContent = s.status === 'error' ? 'Falha ao carregar a base.' : '—';\n      return;\n    }\n    take.classList.remove('dash-skeleton');\n    const base = prep(s.data);\n    const rows = applyFilters(base);\n    const p = dash.params();\n\n    // filtros (opções a partir da base inteira)\n    for (const f of FILTERS) {\n      const opts = counts(base, f).map((d) => d.label);\n      const sel = fEls[f];\n      sel.replaceChildren(new Option(allLabel[f], ''), ...opts.map((o) => new Option(o, o)));\n      sel.value = p[f] || '';\n    }\n    if (document.activeElement !== de) de.value = p.de || '';\n    if (document.activeElement !== ate) ate.value = p.ate || '';\n\n    const g = rows.filter((r) => r.ganho);\n    cons BN.meses.map((m,i)=>`<option value=\"${i}\">${m.label}<\/option>`).join('');\nsel.value = BN.meses.length-1;\nsel.addEventListener('change', ()=>render(+sel.value));\nrender(BN.meses.length-1);\n<\/script>\n<script>\n/* ═══ HOD · Big numbers ao vivo a partir de novembro/26 ═══\n   Faturamento (planilha de vendas), investimento em mídia (windsor.ai) e reuniões\n   (planilha Acompanhamento SDRs) — as mesmas fontes das outras abas do painel. */\n(function(){\n  var URL_VENDAS = 'https://script.google.com/macros/s/AKfycbw-CAcp-Xba_09kHjGeu2a67L-TfMxQq6AAjQ2LWGpSzbVXkD6ebCB_nCVQGtT6IGf0jw/exec';\n  var VIVO_DE = '2026-11';\n  // Meta do mês (mesma do Dashboard comercial). Mês sem meta aqui usa a da planilha de vendas.\n  var METAS = { '2026-11': 500000 };\n  var BOTS = ['BOT', 'TYPEBOT', 'TYPE BOT'];\n  var MESES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];\n  var app = document.getElementById('app-big'), codigo = app.textContent;\n  var ini = codigo.indexOf('const BN = '), fim = codigo.indexOf('\\n', ini);\n  var base = JSON.parse(codigo.slice(ini + 11, fim).trim().replace(/;$/, ''));\n  var api = '';\n  try { api = window.__HOD_API_TESTE || (window.parent && window.parent.HOD_API_URL) || ''; } catch(e) {}\n\n  function iniciar(BN, st){\n    window.__BN_HOD = BN;\n    var s = document.createElement('script');\n    s.textContent = codigo.slice(0, ini) + 'const BN = window.__BN_HOD;' + codigo.slice(fim);\n    document.body.appendChild(s);\n    var el = document.createElement('div');\n    el.textContent = st.ok ? '● Ao vivo · ' + st.hora : '● ' + st.texto;\n    el.title = st.det || '';\n    el.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:9999;font:600 12px/1 system-ui,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15);' +\n      (st.ok ? 'background:#e8f7ee;color:#167a3e' : 'background:#fff4e5;color:#9a5b00');\n    document.body.appendChild(el);\n  }\n  function getJSON(u){\n    var c = new AbortController(), t = setTimeout(function(){ c.abort(); }, 20000);\n    return fetch(u, { signal: c.signal, cache: 'no-store' }).then(function(r){ clearTimeout(t); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })\n      .then(function(j){ if (j && j.erro) throw new Error(j.erro); return j; })\n      .catch(function(){ return null; });\n  }\n  var r2 = function(n){ return Math.round(n * 100) / 100; };\n  var semAc = function(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase(); };\n\n  function montar(vendas, midia, sdr, closers){\n    var BN = JSON.parse(JSON.stringify(base));\n    var hoje = new Date(), mesHoje = hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0');\n    var V = {};   // por mês: fat, fatBot, meta\n    ((vendas && vendas.meses) || []).forEach(function(m){\n      var p = m.label.split('/'), mk = '20' + p[1] + '-' + String(MESES_NOME.indexOf(p[0]) + 1).padStart(2,'0');\n      var x = V[mk] = { fat:{}, fatBot:{}, meta:m.meta, tkr:{ soma:0, n:0 } };\n      m.transacoes.forEach(function(t){\n        if (!t.v) return;\n        // ticket médio real — mesma regra do Dashboard comercial: só vendas à vista,\n        // sem Low Ticket (closer ou plano), Recuperação Diego e reembolsos\n        if (t.pg === 'AVISTA' && t.v > 0 && t.c !== 'LOW TICKET' && t.c !== 'DIEGO' && t.o !== 'REEMBOLSO' && String(t.p||'').toLowerCase() !== 'low ticket') { x.tkr.soma += t.v; x.tkr.n++; }\n        x.fat[t.d] = r2((x.fat[t.d]||0) + t.v);\n        if (BOTS.indexOf(semAc(t.s)) >= 0) x.fatBot[t.d] = r2((x.fatBot[t.d]||0) + t.v);\n      });\n    });\n    var Mi = {};  // por mês: midia, midiaTypebot\n    ((midia && midia.linhas) || []).forEach(function(l){\n      var mk = l[0].slice(0,7), d = +l[0].slice(8,10), x = Mi[mk] = Mi[mk] || { midia:{}, midiaTypebot:{} };\n      x.midia[d] = r2((x.midia[d]||0) + l[4]);\n      if (/TYPEBOT/i.test(l[3])) x.midiaTypebot[d] = r2((x.midiaTypebot[d]||0) + l[4]);\n    });\n    var VC = {};  // por mês: vendas preenchidas pelos closers no site, por dia\n    ((closers && closers.linhas) || []).forEach(function(l){\n      var mk = String(l[0]).slice(0,7), d = +String(l[0]).slice(8,10), o = VC[mk] = VC[mk] || {};\n      o[d] = (o[d] || 0) + (+l[6] || 0);\n    });\n    var Re = {};  // por mês: reuniões [data, 'tb'|'hum', ag, passadas, acontecidas, no-show]\n    ((sdr && sdr.linhas) || []).forEach(function(r){\n      var mk = String(r[0]).slice(0,7);\n      (Re[mk] = Re[mk] || []).push([String(r[0]).slice(0,10), semAc(r[1]).replace(/\\s/g,'') === 'TYPEBOT' ? 'tb' : 'hum', +r[2]||0, +r[3]||0, +r[4]||0, +r[5]||0]);\n    });\n    for (var mk = VIVO_DE; mk <= mesHoje; ) {\n      var y = +mk.slice(0,4), mm = +mk.slice(5,7), lbl = MESES_NOME[mm-1] + ' de ' + y;\n      var v = V[mk] || {}, mi = Mi[mk] || {}, re = Re[mk] || [];\n      if (v.fat || mi.midia || re.length) {\n        var anterior = BN.meses.filter(function(x){ return x.label === lbl; })[0] || {};\n        BN.meses = BN.meses.filter(function(x){ return x.label !== lbl; });\n        BN.meses.push({ label: lbl, ano: y, mes: mm,\n          meta: METAS[mk] != null ? METAS[mk] : (v.meta || anterior.meta || 0),\n          fat: v.fat || anterior.fat || {}, fatBot: v.fatBot || anterior.fatBot || {},\n          midia: mi.midia || anterior.midia || {}, midiaTypebot: mi.midiaTypebot || anterior.midiaTypebot || {},\n          reun: re.length ? re : (anterior.reun || []),\n          vc: VC[mk] || {}, tkr: v.tkr || null });\n      }\n      mm++; if (mm > 12) { mm = 1; y++; } mk = y + '-' + String(mm).padStart(2,'0');\n    }\n    return BN;\n  }\n\n  if (!/^(https|blob|data):/.test(api)) { iniciar(base, { ok:false, texto:'Versão salva (até outubro)' }); return; }\n  var q = function(f){ return api + (api.indexOf('?') < 0 ? '?' : '&') + 'fonte=' + f; };\n  Promise.all([ getJSON(URL_VENDAS), getJSON(q('midia')), getJSON(q('sdr')), getJSON(q('closers')) ]).then(function(r){\n    var falta = [];\n    if (!r[0]) falta.push('faturamento'); if (!r[1]) falta.push('mídia'); if (!r[2]) falta.push('reuniões');\n    if (falta.length === 3) { iniciar(base, { ok:false, texto:'Versão salva (até outubro)' }); return; }\n    var h = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });\n    iniciar(montar(r[0], r[1], r[2], r[3]), falta.length\n      ? { ok:false, texto:'Ao vivo parcial · sem ' + falta.join(', '), det:'Fontes indisponíveis agora: ' + falta.join(', ') }\n      : { ok:true, hora:h });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n", "closers": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Performance Comercial — Closers HOD · Maio a Outubro/26<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --verde:#263A21; --verde-2:#3E5C37; --verde-3:#4F7345;\n  --fundo:#F5F6F2; --mdf:#E7EEE3; --linha:#D7DECD;\n  --tinta:#1C2419; --tinta-2:#5B6B54; --card:#FFFFFF;\n  --acima:#3E5C37; --acima-bg:#E3EEDD;\n  --perto:#6F7768; --perto-bg:#ECEEE8;\n  --abaixo:#9A6B2F; --abaixo-bg:#F5EADB;\n  --barra:#4F7345; --barra-bg:#EEF2EA;\n  --alerta-bg:#FBF6EA; --alerta-borda:#E6D3A6;\n  --raio:10px;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --fundo:#141A12; --card:#1C241A; --mdf:#243021; --linha:#33412F;\n    --tinta:#E8EDE4; --tinta-2:#A3B39B;\n    --acima:#9AC98A; --acima-bg:#25381F; --perto:#B5BCAE; --perto-bg:#2A3127;\n    --abaixo:#E0B46E; --abaixo-bg:#3A2F1C; --barra:#7FA571; --barra-bg:#243021;\n    --alerta-bg:#2A2617; --alerta-borda:#4E4428;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --fundo:#141A12; --card:#1C241A; --mdf:#243021; --linha:#33412F;\n  --tinta:#E8EDE4; --tinta-2:#A3B39B;\n  --acima:#9AC98A; --acima-bg:#25381F; --perto:#B5BCAE; --perto-bg:#2A3127;\n  --abaixo:#E0B46E; --abaixo-bg:#3A2F1C; --barra:#7FA571; --barra-bg:#243021;\n  --alerta-bg:#2A2617; --alerta-borda:#4E4428;\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fundo);color:var(--tinta);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}\n@media (prefers-reduced-motion: reduce){*{transition:none!important}}\nh1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;letter-spacing:-.01em}\n\nheader{background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,0) 40%),#263A21;color:#F5F6F2;border-bottom:4px solid #4F7345;padding:24px 20px 22px}\n.wrap{max-width:1240px;margin:0 auto}\nheader .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}\nh1{font-size:clamp(22px,3.2vw,32px);font-weight:700;line-height:1.1}\n.periodo{font-size:15px;color:#C7D6C1;margin-top:4px}\n.fonte{font-size:12.5px;color:#B9CBB1;text-align:right;max-width:420px}\n\nmain{max-width:1240px;margin:0 auto;padding:20px 20px 64px}\nsection{margin-top:34px}\n.sec-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin-bottom:14px}\nh2{font-size:20px;font-weight:600}\n.sub{font-size:13px;color:var(--tinta-2)}\n\n/* Pontos de atenção */\n.atencao{background:var(--alerta-bg);border:1px solid var(--alerta-borda);border-radius:var(--raio);padding:14px 18px}\n.atencao summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;gap:10px;align-items:center}\n.atencao summary::-webkit-details-marker{display:none}\n.atencao summary::before{content:\"▸\";transition:transform .15s}\n.atencao[open] summary::before{transform:rotate(90deg)}\n.atencao ul{margin:12px 0 4px 20px;font-size:13.5px;display:grid;gap:7px;max-width:95ch}\n.atencao li strong{font-weight:600}\n.leitura{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--alerta-borda);font-size:13.5px}\n.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--card)}\n.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--tinta);padding:7px 12px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--linha)}\n.seg button[aria-pressed=\"true\"]{background:var(--verde);color:#F5F6F2}\n.seg button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px}\n\n/* KPIs */\n.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px 18px 14px}\n.kpi .rot{font-size:13px;color:var(--tinta-2);font-weight:500}\n.kpi .val{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:clamp(24px,2.6vw,32px);font-weight:600;line-height:1.15;margin-top:4px}\n.kpi .det{font-size:12.5px;color:var(--tinta-2);margin-top:4px}\n.kpi.dest{background:var(--verde);border-color:var(--verde)}\n.kpi.dest .rot,.kpi.dest .det{color:#C7D6C1}\n.kpi.dest .val{color:#F5F6F2}\n@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}\n\n/* Tabela */\n.tabela-box{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);overflow-x:auto}\ntable{width:100%;border-collapse:collapse;min-width:1000px;font-size:13.5px}\nth,td{padding:9px 8px;text-align:right;white-space:nowrap}\nth:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--card)}\nthead th:first-child{background:var(--mdf)}\ntr.media td:first-child{background:var(--mdf)}\nthead th{font-size:12.5px;font-weight:600;color:var(--tinta-2);background:var(--mdf);border-bottom:1px solid var(--linha);vertical-align:bottom}\ntbody td{border-bottom:1px solid var(--linha)}\ntbody tr:hover td{background:color-mix(in srgb,var(--mdf) 55%,transparent)}\ntd .n{font-weight:500}\ntd .chip{margin-left:5px}\ntr.media td{background:var(--mdf);font-weight:600;border-top:2px solid var(--verde-3)}\ntr.total td{font-weight:600;color:var(--tinta-2)}\ntr.total td:first-child,tr.media td:first-child{font-size:12.5px;letter-spacing:.02em}\n.nota{font-size:12.5px;color:var(--tinta-2);margin-top:10px;max-width:110ch}\n\n.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;min-width:40px;text-align:center}\n.chip.acima{color:var(--acima);background:var(--acima-bg)}\n.chip.perto{color:var(--perto);background:var(--perto-bg)}\n.chip.abaixo{color:var(--abaixo);background:var(--abaixo-bg)}\n.chip.na{color:var(--tinta-2);background:transparent}\n.legenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--tinta-2);margin-top:10px;align-items:center}\n\n/* Comparação com a média */\n.painel{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:18px 20px}\n.painel-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:16px}\n.ref{font-size:13.5px;color:var(--tinta-2)}\n.ref strong{color:var(--tinta)}\n.barras{display:grid;gap:9px}\n.linha-b{display:grid;grid-template-columns:140px 1fr 210px;gap:14px;align-items:center;font-size:14px}\n.trilho{position:relative;height:20px;background:var(--barra-bg);border-radius:4px}\n.trilho .b{position:absolute;left:0;top:0;bottom:0;background:var(--barra);border-radius:4px;transition:width .35s ease}\n.trilho .m{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--tinta);opacity:.7}\n.linha-b .v{display:flex;justify-content:flex-end;gap:8px;align-items:center}\n.eixo-m{display:grid;grid-template-columns:140px 1fr 210px;gap:14px;font-size:12px;color:var(--tinta-2)}\n.eixo-m .t{position:relative;height:16px}\n.eixo-m .t span{position:absolute;transform:translateX(-50%);white-space:nowrap}\n@media (max-width:640px){\n  .linha-b,.eixo-m{grid-template-columns:86px 1fr;}\n  .linha-b .v{grid-column:2;justify-content:flex-start;margin-top:-4px}\n  .eixo-m>div:last-child{display:none}\n}\n\n/* Individual */\n.ind-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}\nselect{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--card);color:var(--tinta);min-width:220px}\n.ind-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n@media (max-width:860px){.ind-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.tile{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px}\n.tile .rot{font-size:13px;color:var(--tinta-2);font-weight:500}\n.tile .val{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:26px;font-weight:600;line-height:1.2;margin-top:2px}\n.tile .cmp{font-size:12.5px;color:var(--tinta-2);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.mini{margin-top:10px;display:grid;gap:4px}\n.mini div{height:6px;border-radius:3px}\n.mini .c{background:var(--barra)}\n.mini .md{background:var(--tinta-2);opacity:.45}\n.compl{margin-top:12px;font-size:13.5px;color:var(--tinta-2)}\n.compl strong{color:var(--tinta)}\nfooter{max-width:1180px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--tinta-2)}\n\n.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-top:26px;flex-wrap:wrap}\n.abas button{font:inherit;font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:17px;font-weight:600;border:0;background:transparent;color:var(--tinta-2);padding:10px 16px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}\n.abas button[aria-selected=\"true\"]{color:var(--tinta);border-bottom-color:var(--verde-3)}\n.abas button:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px}\n.aviso-sec{font-size:13px;color:var(--tinta-2);background:var(--card);border:1px solid var(--linha);border-left:3px solid var(--alerta-borda);border-radius:6px;padding:10px 14px;margin-top:22px;max-width:110ch}\n.aviso-sec strong{color:var(--tinta)}\n[hidden]{display:none!important}\n\n.filtros-dia{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}\n.filtros-dia label{display:grid;gap:4px;font-size:12.5px;color:var(--tinta-2)}\n.filtros-dia select{min-width:0;font-size:14px;padding:7px 10px}\ntable.tab-dia{min-width:880px}\ntable.tab-dia button.ord{font:inherit;font-weight:600;color:inherit;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}\ntable.tab-dia button.ord:hover{color:var(--tinta)}\ntable.tab-dia th[aria-sort] button.ord{color:var(--tinta)}\ntable.tab-dia button.ord:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px;border-radius:3px}\ntable.tab-dia tbody tr.zero td{color:var(--tinta-2)}\ntable.tab-dia .dow{font-size:12px;color:var(--tinta-2);margin-left:6px}\n\n/* ── Cabeçalho HOD (mesmo padrão do Performance SDRs) ── */\n.hodtop{background:#253A20;color:#fff}\n.hodtop-in{max-width:1360px;margin:0 auto;padding:18px 28px 14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-sizing:border-box}\n.hodtop-mark{display:flex;align-items:center;gap:22px;min-width:0}\n.hodtop-mark img{height:48px;width:auto;display:block}\n.hodtop-ttl{border-left:1px solid rgba(255,255,255,.25);padding-left:22px;min-width:0}\n.hodtop h1{margin:0;font:600 20px/1.2 'Sora','Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.01em;color:#fff}\n.hodtop-ttl small{display:block;color:rgba(255,255,255,.68);font:400 13px/1.4 'IBM Plex Sans',system-ui,sans-serif;margin-top:2px}\n.hodtop-acts{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:rgba(255,255,255,.78);font:400 12.5px/1.4 'IBM Plex Sans',system-ui,sans-serif;text-align:right}\n.hodtop-acts strong{color:#fff}\n.hodtop-acts label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.7);text-align:left}\n.hodtop-acts select{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff}\n.hodtop-acts select option{color:#1C2419}\n@media(max-width:560px){.hodtop-in{padding:14px 16px}.hodtop-mark{gap:14px}.hodtop-ttl{padding-left:14px}.hodtop-mark img{height:38px}.hodtop-acts{margin-left:0;text-align:left}}\n<\/style>\n<\/head>\n<body>\n<div class=\"hodtop\"><div class=\"hodtop-in\">\n  <div class=\"hodtop-mark\">\n    <img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQ4AAABgCAYAAADsOJw7AAAyT0lEQVR42u1dZ7hcVdV+18zcXBIgCQGkKx0BCyIiWADBgqBUaYqCNEWEgGLDz4KIn9ion4AoNSBdpCkoiqKAUkQRQ4kIUgIhIQRCyr0z834/9lrMys45Z845M3NLyHme88zNZM4+u6z97tWXYBRcJKsAKCLNjN8IgAqApogQS6+hWptC865riaXrNLovGQVEKQYYJF8D4I0A1gGwHIAFAJ4E8E8Recw9V8kCmVG8SasANgTQr18tBPCwiDSKzquIkOQKANYG0ABQA/CsiDxVBDD8u0muAmA9XZ8VAPQBmA9gBoBpAKaJyLwy66Rjf732UwA8AmAeAoGwi/TWB2BjAzed34Up87cygDV1/sruJQKoApir87MUTDtcxIr7+90kLyE5g8nXHJK/IXkgyf7oZFtSTnWQXIHkf0jW9X6E5CT/mwKbECT3J9kgOY9kk+SP4rnPsTaTSB5K8lcZ60OSgyQfInkWyXcntdVm7CuSfFbbaZA8Nc/zRemN5Jf1HYNKVxskjNnm72jtywL9/UCJe4G2cQfJvqJrufRKJuwVldDqERHWdaHqSvD+uoXkZksSeLjNM4nkk26sj3UIHAe4Tc08m9FtsBrJw0k+HM1/I2FNmvq9v24kuaX1Pa3/buwrkXzePT/fPV/pEmisT/I59455JDfMAI7Pu/GVvezZu0YTcFRGImiISIPk6wH8BsCnlJVrKFtnrF1NP0W/a+i9PYCbSe6u7VSXMFxtunnoVBzz7djfmRtMRJok1wLwSwA/BrABgMGIphrKer8I4GVdI6O1ur7vgwD+QPKLIkJl/SXn2OsAlgFwIslaJ5steu4bAFbS9vPMbzx/nagLRhWd
