querySelectorAll('.chip-mes').forEach(c=>c.classList.add('ativo'));\n  atualizaLimitesDias();\n  render();\n});\n\n// ── Filtro de dias: recolhido por padrão, só aparece quando a pessoa clica em\n// \"Filtrar por dia\". Usa inputs de calendário nativos, limitados ao mês de\n// referência (o primeiro mês marcado no filtro de período). ──\nfunction boundsMesReferenciaSelecionado(){\n  const idx = [...st.meses].sort((a,b)=>a-b)[0];\n  const {ano, mes} = parseMesLabel(DADOS.meses[idx]);\n  return { ano, mes, diasNoMes: ultimoDiaDoMes(ano, mes) };\n}\nfunction isoDate(ano,mes,dia){ return `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`; }\n\nfunction montaFiltroDias(){\n  const inputIni = $('diaIniCal'), inputFim = $('diaFimCal');\n  const botaoToggle = $('toggleFiltroDias'), painel = $('painelDias'), botaoLimpar = $('limparDias');\n\n  function atualizaLimites(){\n    const { ano, mes, diasNoMes } = boundsMesReferenciaSelecionado();\n    const min = isoDate(ano,mes,1), max = isoDate(ano,mes,diasNoMes);\n    inputIni.min = min; inputIni.max = max;\n    inputFim.min = min; inputFim.max = max;\n    inputIni.value = isoDate(ano, mes, Math.min(st.diaIni, diasNoMes));\n    inputFim.value = isoDate(ano, mes, Math.min(st.diaFim, diasNoMes));\n  }\n  atualizaLimitesDias = atualizaLimites; // exposto para montaToggles/limpar atualizarem o calendário\n\n  function atualizaRotuloToggle(){\n    const filtrado = !(st.diaIni===1 && st.diaFim===31);\n    botaoToggle.classList.toggle('ativo', filtrado);\n    botaoToggle.textContent = filtrado ? `📅 Dias ${st.diaIni}–${st.diaFim}` : '📅 Filtrar por dia';\n  }\n  atualizaRotuloToggleFn = atualizaRotuloToggle;\n\n  botaoToggle.addEventListener('click', ()=>{\n    const abrindo = painel.hidden;\n    painel.hidden = !painel.hidden;\n    if(abrindo) atualizaLimites();\n  });\n\n  inputIni.addEventListener('change', ()=>{\n    if(!inputIni.value) return;\n    st.diaIni = new Date(inputIni.value+'T00:00:00').getDate();\n    if(st.diaIni>st.diaFim){ st.diaFim = st.diaIni; }\n    atualizaLimites();\n    atualizaRotuloToggle();\n    render();\n  });\n  inputFim.addEventListener('change', ()=>{\n    if(!inputFim.value) return;\n    st.diaFim = new Date(inputFim.value+'T00:00:00').getDate();\n    if(st.diaFim<st.diaIni){ st.diaIni = st.diaFim; }\n    atualizaLimites();\n    atualizaRotuloToggle();\n    render();\n  });\n  botaoLimpar.addEventListener('click', ()=>{\n    st.diaIni = 1; st.diaFim = 31;\n    atualizaLimites();\n    atualizaRotuloToggle();\n    render();\n  });\n\n  atualizaLimites();\n  atualizaRotuloToggle();\n}\nlet atualizaLimitesDias = ()=>{};\nlet atualizaRotuloToggleFn = ()=>{};\n\n// ── Soma o valor de uma pessoa dentro do recorte atual (meses + dias) ──\nfunction totalPessoa(nome, mapaDiario){\n  const porMes = mapaDiario[nome];\n  if(!porMes) return 0;\n  let t=0;\n  st.meses.forEach(idx=>{\n    const dias = porMes[idx];\n    if(!dias) return;\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim) t += dias[diaStr];\n    }\n  });\n  return t;\n}\n\n// ── Soma o valor de uma equipe inteira dentro do recorte atual ──\nfunction totalEquipe(lista, mapaDiario){\n  return lista.reduce((s,nome)=> s + totalPessoa(nome, mapaDiario), 0);\n}\n\n// ── Vendas \"low ticket\": produto sem closer/SDR atribuído. Soma ao total vendido,\n// mas é rastreado à parte (valor + quantidade) para o card secundário de Low Ticket. ──\nfunction totalLowTicketFiltrado(){\n  let valor=0, qtd=0;\n  st.meses.forEach(idx=>{\n    const dias = (DADOS.diarioLowTicket||[])[idx] || {};\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim){\n        valor += dias[diaStr].v;\n        qtd += dias[diaStr].n;\n      }\n    }\n  });\n  return { valor, qtd };\n}\nfunction totalLowTicketAteDia(idx, diaFim){\n  const dias = (DADOS.diarioLowTicket||[])[idx] || {};\n  let v=0;\n  for(const diaStr in dias){ if(+diaStr>=1 && +diaStr<=diaFim) v += dias[diaStr].v; }\n  return v;\n}\n\n// ── Recuperação de cobranças (Diego): contabiliza no valor geral, mas não entra\n// no somatório de closers/SDRs. Rastreado à parte (valor + quantidade), como o Low Ticket. ──\nfunction totalRecDiegoFiltrado(){\n  let valor=0, qtd=0;\n  st.meses.forEach(idx=>{\n    const dias = (DADOS.diarioRecuperacaoDiego||[])[idx] || {};\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim){\n        valor += dias[diaStr].v;\n        qtd += dias[diaStr].n;\n      }\n    }\n  });\n  return { valor, qtd };\n}\nfunction totalRecDiegoAteDia(idx, diaFim){\n  const dias = (DADOS.diarioRecuperacaoDiego||[])[idx] || {};\n  let v=0;\n  for(const diaStr in dias){ if(+diaStr>=1 && +diaStr<=diaFim) v += dias[diaStr].v; }\n  return v;\n}\n\n// ── Meta do período: sempre o mês inteiro, não é afetada pelo filtro de dias ──\nfunction metaPeriodo(){\n  let t=0;\n  st.meses.forEach(i=> t += DADOS.metas[i]);\n  return t;\n}\n\n// ── Estrutura de times — existem duas \"eras\": Setembro/26 (estrutura original) e\n// Outubro/26 em diante (Túlio/Misael/Rafael/Leandro saem dos times; SDRs ganham o\n// time \"Sprinters\" para Michelly/Gustavo, rastreado por no-show em vez de meta em R$).\n// Chaves batem com DADOS.closers / DADOS.sdrs; \"apelido\" é o nome usado nas conversas do time.\n// Quem não está em nenhum PESSOAS_*/TIMES_* da era vigente simplesmente não aparece nos\n// cards de \"Desempenho por Time\" nem em \"Atingimento Individual\" — mas seus resultados\n// continuam contando normalmente no Ranking de Closers/SDRs e no somatório total.\nconst ERA_SETEMBRO = {\n  pessoasCloser: {\n    'LEANDRO PT': { apelido:'Portuga', time:'A', categoria:'senior', meta:85000, lider:true },\n    'PAULO':      { apelido:'Paulo',   time:'A', categoria:'junior', meta:50000 },\n    'TÚLIO':      { apelido:'Túlio',   time:'A', categoria:'pleno',  meta:65000 },\n    'LUIGI':      { apelido:'Luigi',   time:'A', categoria:'junior', meta:50000 },\n    'EDUARDO':    { apelido:'Edu',     time:'B', categoria:'senior', meta:85000, lider:true },\n    'LARISSA':    { apelido:'Larissa', time:'B', categoria:'pleno',  meta:65000 },\n    'RODRIGO':    { apelido:'Rodrigo', time:'B', categoria:'junior', meta:50000 },\n    'MISAEL':     { apelido:'Misael',  time:'B', categoria:'junior', meta:50000 },\n  },\n  pessoasSdr: {\n    'RAFAEL':      { apelido:'Rafael',   time:'1', categoria:'senior', meta:85000, lider:true },\n    'BEATRIZ':     { apelido:'Beatriz',  time:'1', categoria:'pleno',  meta:65000 },\n    'VITOR':       { apelido:'Vitor',    time:'1', categoria:'junior', meta:50000 },\n    'CARIOCA':     { apelido:'Carioca',  time:'1', categoria:'junior', meta:50000 },\n    'ALVARO':      { apelido:'Alvaro',   time:'1' },\n    'MICHELLY':    { apelido:'Michelly', time:'2', categoria:'senior', meta:85000, lider:true },\n    'LEANDRO B.':  { apelido:'Leandro',  time:'2', categoria:'pleno',  meta:65000 },\n    'GUSTAVO':     { apelido:'Gustavo',  time:'2', categoria:'junior', meta:50000 },\n    'IASMIN':      { apelido:'Iasmin',   time:'2', categoria:'junior', meta:50000 },\n  },\n  timesCloser: {\n    A: { nome:'Galáticos', sigla:'TIME A', badge:'tA', icone:'brasao', membros:['LEANDRO PT','PAULO','TÚLIO','LUIGI'] },\n    B: { nome:'Time B', sigla:'TIME B', badge:'tB', membros:['EDUARDO','LARISSA','RODRIGO','MISAEL'] },\n  },\n  timesSdr: {\n    '1': { nome:'Fantásticos Leads', sigla:'TIME 1', badge:'t1', icone:'badge4', membros:['RAFAEL','BEATRIZ','VITOR','CARIOCA','ALVARO'] },\n    '2': { nome:'Clube das Winx', sigla:'TIME 2', badge:'t2', icone:'fada', membros:['MICHELLY','LEANDRO B.','GUSTAVO','IASMIN'] },\n  },\n  sprinters: null,\n};\nconst ERA_OUTUBRO = {\n  pessoasCloser: {\n    // TÚLIO e MISAEL saíram dos times a partir de outubro/26 (resultados seguem no ranking/total)\n    'LEANDRO PT': { apelido:'Portuga', time:'A', categoria:'senior', meta:85000, lider:true },\n    'PAULO':      { apelido:'Paulo',   time:'A', categoria:'junior', meta:50000 },\n    'LUIGI':      { apelido:'Luigi',   time:'A', categoria:'junior', meta:50000 },\n    'EDUARDO':    { apelido:'Edu',     time:'B', categoria:'senior', meta:85000, lider:true },\n    'LARISSA':    { apelido:'Larissa', time:'B', categoria:'pleno',  meta:65000 },\n    'RODRIGO':    { apelido:'Rodrigo', time:'B', categoria:'junior', meta:50000 },\n    // Alvaro passou a integrar o Time B de closers (júnior).\n    'ALVARO':     { apelido:'Alvaro',  time:'B', categoria:'junior', meta:50000 },\n  },\n  pessoasSdr: {\n    // RAFAEL e LEANDRO B. saíram dos times (resultados seguem no ranking/total).\n    // VITOR migrou para o Time 2 (Clube das Winx). MICHELLY/GUSTAVO viraram o time \"Sprinters\".\n    'CARIOCA':     { apelido:'Carioca',  time:'1', categoria:'junior', meta:50000 },\n    'BEATRIZ':     { apelido:'Beatriz',  time:'1', categoria:'pleno',  meta:65000 },\n    // ALVARO saiu do Time 1 (Fantásticos Leads) — agora é closer do Time B; vendas em que\n    // aparece como SDR seguem no Ranking de SDRs e no somatório geral, fora da soma por time.\n    'IASMIN':      { apelido:'Iasmin',   time:'2', categoria:'junior', meta:50000 },\n    'VITOR':       { apelido:'Vitor',    time:'2', categoria:'junior', meta:50000 },\n    'BOT':         { apelido:'Bot',      time:'2', categoria:'senior', meta:85000 },\n    // Sprinters não é um time de vendas, é uma categoria de trabalho à parte — por isso não\n    // têm categoria/meta (não entram em \"Atingimento Individual\") nem aparecem nos cards de\n    // \"Desempenho por Time\" (são exibidos em seção própria, com o indicador de no-show).\n    'MICHELLY':    { apelido:'Michelly' },\n    'GUSTAVO':     { apelido:'Gustavo' },\n  },\n  timesCloser: {\n    A: { nome:'Galáticos', sigla:'TIME A', badge:'tA', icone:'brasao', membros:['LEANDRO PT','PAULO','LUIGI'] },\n    B: { nome:'Time B', sigla:'TIME B', badge:'tB', membros:['EDUARDO','LARISSA','RODRIGO','ALVARO'] },\n  },\n  timesSdr: {\n    '1': { nome:'Fantásticos Leads', sigla:'TIME 1', badge:'t1', icone:'badge4', membros:['CARIOCA','BEATRIZ'] },\n    '2': { nome:'Clube das Winx', sigla:'TIME 2', badge:'t2', icone:'fada', membros:['IASMIN','VITOR','BOT'] },\n  },\n  // Sprinters NÃO é um time de vendas — é uma categoria de trabalho à parte, por isso fica\n  // fora de timesSdr/\"Desempenho por Time\" e ganha seção própria, com o indicador de no-show.\n  // As vendas de Michelly/Gustavo continuam valendo no Ranking de SDRs e no total geral.\n  sprinters: { membros:['MICHELLY','GUSTAVO'] },\n};\n// ── Reuniões/no-show dos Sprinters, diarizado (DADOS.sprintersReunioes[idxMes][dia] = {ag, ac}) ──\n// Segue o mesmo recorte de meses/dias do restante do dashboard (st.meses, st.diaIni/diaFim).\nfunction sprintersDiasFiltrado(){\n  const linhas = [];\n  st.meses.forEach(idx=>{\n    const dias = (DADOS.sprintersReunioes||[])[idx] || {};\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim){\n        const { ag, ac } = dias[diaStr];\n        linhas.push({ idx, dia, ag, ac });\n      }\n    }\n  });\n  linhas.sort((a,b)=> a.idx-b.idx || a.dia-b.dia);\n  return linhas;\n}\nfunction sprintersLabelDia(idx, dia){\n  const { mes } = parseMesLabel(DADOS.meses[idx]);\n  return `${String(dia).padStart(2,'0')}/${String(mes).padStart(2,'0')}`;\n}\nconst DIAS_SEMANA_ABREV = ['dom','seg','ter','qua','qui','sex','sáb'];\nfunction sprintersDiaSemana(idx, dia){\n  const { ano, mes } = parseMesLabel(DADOS.meses[idx]);\n  return DIAS_SEMANA_ABREV[new Date(ano, mes-1, dia).getDay()];\n}\n// Escala de cor relativa ao próprio período exibido (reaproveitada por no-show, ROAS e\n// conversão GHL). maiorEhMelhor=false → menor valor fica verde (ex.: no-show). true → maior\n// valor fica verde (ex.: ROAS, taxa de conversão). min/max calculados só entre dias com dado.\nfunction escalaCor(valor, min, max, maiorEhMelhor){\n  if(max<=min) return { bg:'var(--mdf)', fg:'var(--tinta-2)' };\n  let t = Math.min(1, Math.max(0, (valor-min)/(max-min)));\n  if(!maiorEhMelhor) t = 1-t;\n  const hue = 12 + t*88; // 12=vermelho(pior) → 100=verde(melhor)\n  return { bg:`hsl(${hue.toFixed(0)},55%,88%)`, fg:`hsl(${hue.toFixed(0)},50%,26%)` };\n}\n\nfunction idxOutubro(){ return DADOS.meses.indexOf('Outubro/26'); }\n// ── Retorna a estrutura de times vigente para um índice de mês (ou para o mês em foco atual) ──\nfunction estruturaParaIdx(idx){\n  const io = idxOutubro();\n  return (io>=0 && idx>=io) ? ERA_OUTUBRO : ERA_SETEMBRO;\n}\nfunction estruturaAtual(){\n  const idx = mesFocoAtual();\n  return estruturaParaIdx(idx>=0 ? idx : (DADOS.meses.length-1));\n}\n\nconst CATEGORIA_LABEL = { senior:'Sênior', pleno:'Pleno', junior:'Júnior' };\nconst CATEGORIA_ORDEM = ['senior','pleno','junior'];\n\n// ── Soma o total de vendas (lado closer) de um mês específico, do dia 1 até um dia-limite ──\n// Usado para comparar a evolução \"mês corrente até hoje\" vs \"mês anterior até o mesmo dia\".\nfunction totalClosersAteDia(idx, diaFim){\n  if(idx < 0 || !DADOS.meses[idx]) return 0;\n  const totClosers = DADOS.closers.reduce((s,n)=>{\n    const dias = (DADOS.diarioCloser[n]||[])[idx] || {};\n    let sub=0;\n    for(const d in dias){ if(+d>=1 && +d<=diaFim) sub+=dias[d]; }\n    return s+sub;\n  },0);\n  return totClosers + totalLowTicketAteDia(idx, diaFim) + totalRecDiegoAteDia(idx, diaFim);\n}\n\n// ── Quantidade de dias \"decorridos\" (já ocorridos) dentro de um mês, considerando\n// a data de atualização para o mês corrente e o mês completo para meses já fechados ──\nfunction diasElapsedNoMes(idx){\n  const {ano, mes} = parseMesLabel(DADOS.meses[idx]);\n  const diasNoMes = ultimoDiaDoMes(ano, mes);\n  const inputVal = $('dataAtualizacao').value;\n  if(inputVal){\n    const [aY, aM, aD] = inputVal.split('-').map(Number);\n    if(ano===aY && mes===aM) return Math.min(Math.max(aD,1), diasNoMes); // mês corrente: só até hoje\n    if(ano>aY || (ano===aY && mes>aM)) return 0; // mês ainda no futuro\n  }\n  return diasNoMes; // mês já fechado (passado): conta inteiro\n}\n\n// ── Quantidade de dias efetivamente contados no filtro atual (para a média diária) —\n// conta dias corridos (mesmo sem venda), nunca dias futuros que ainda não aconteceram.\n// A partir de outubro/26, domingos saem da contagem (mas uma venda registrada num domingo\n// continua somada normalmente no totGeral — só o DIVISOR da média muda) ──\nfunction diasNoFiltro(){\n  let n=0;\n  const io = idxOutubro();\n  st.meses.forEach(idx=>{\n    const elapsed = diasElapsedNoMes(idx);\n    const ini = Math.max(st.diaIni, 1);\n    const fim = Math.min(st.diaFim, elapsed);\n    if(fim>=ini){\n      if(io>=0 && idx>=io){\n        const { ano, mes } = parseMesLabel(DADOS.meses[idx]);\n        n += diasUteisNoIntervalo(ano, mes, ini, fim);\n      } else {\n        n += (fim-ini+1);\n      }\n    }\n  });\n  return n;\n}\n\nfunction rankingEquipe(lista, mapaDiario){\n  return lista.map(nome=>[nome, totalPessoa(nome, mapaDiario)]).sort((a,b)=>b[1]-a[1]);\n}\n\n// ── Ritmo do mês em foco (dias restantes / necessário por dia) ──\n// O \"mês em foco\" é o mais recente entre os marcados no filtro de período —\n// ex.: se só Julho está marcado, o ritmo é calculado sobre Julho (mês fechado).\n// A \"data de atualização\" continua sendo só a referência do que é \"hoje\".\nfunction mesFocoAtual(){\n  if(!st.meses.size) return -1;\n  return [...st.meses].sort((a,b)=>b-a)[0];\n}\nfunction hojeInfo(){\n  const inputVal = $('dataAtualizacao').value;\n  if(!inputVal) return null;\n  const [ano, mes, dia] = inputVal.split('-').map(Number);\n  return { ano, mes, dia };\n}\nfunction compararMes(anoA,mesA, anoB,mesB){\n  if(anoA!==anoB) return anoA-anoB;\n  return mesA-mesB;\n}\n\n// Conta os dias de um intervalo (inclusive) que NÃO são domingo — usado em \"dias restantes\n// para a meta\" e \"necessário por dia\", já que domingo não entra no ritmo de vendas.\nfunction diasUteisNoIntervalo(ano, mes, diaIni, diaFim){\n  let n = 0;\n  for(let d=diaIni; d<=diaFim; d++){\n    if(new Date(ano, mes-1, d).getDay() !== 0) n++;\n  }\n  return n;\n}\n\nfunction calcRitmo(){\n  const hoje = hojeInfo();\n  if(!hoje) return null;\n  const idx = mesFocoAtual();\n  if(idx === -1) return null;\n\n  const { ano, mes } = parseMesLabel(DADOS.meses[idx]);\n  const diasNoMes = ultimoDiaDoMes(ano, mes);\n  const cmp = compararMes(ano, mes, hoje.ano, hoje.mes);\n\n  const totalMes = Object.values(DADOS.diarioTotal[idx] || {}).reduce((a,b)=>a+b,0);\n  const metaMes = DADOS.metas[idx];\n  const faltaMes = metaMes - totalMes;\n\n  if(cmp === 0){\n    // mês corrente: ainda em andamento\n    const diasDecorridos = Math.min(Math.max(hoje.dia,1), diasNoMes);\n    const diasRestantes = diasUteisNoIntervalo(ano, mes, diasDecorridos, diasNoMes); // inclusive hoje, sem domingos\n    const necessarioPorDia = faltaMes > 0.01 ? faltaMes/diasRestantes : 0;\n    // Para projeção de fechamento: dias úteis (sem domingo) decorridos/no mês, a partir de\n    // outubro/26 — meses anteriores continuam com a contagem corrida de sempre.\n    const io = idxOutubro();\n    const diasUteisDecorridos = (io>=0 && idx>=io) ? diasUteisNoIntervalo(ano, mes, 1, diasDecorridos) : diasDecorridos;\n    const diasUteisNoMes = (io>=0 && idx>=io) ? diasUteisNoIntervalo(ano, mes, 1, diasNoMes) : diasNoMes;\n    return { status:'corrente', idx, mesLabel:DADOS.meses[idx], diasNoMes, diasDecorridos, diasRestantes, diasUteisDecorridos, diasUteisNoMes, totalMes, metaMes, faltaMes, necessarioPorDia };\n  }\n  if(cmp < 0){\n    // mês fechado: já passou por completo\n    return { status:'fechado', idx, mesLabel:DADOS.meses[idx], diasNoMes, totalMes, metaMes, faltaMes };\n  }\n  // mês futuro (fora dos dados ainda)\n  return { status:'futuro', idx, mesLabel:DADOS.meses[idx], diasNoMes, totalMes, metaMes, faltaMes };\n}\n\n// ── Quanto fizemos ontem (mês corrente) / Último dia registrado (mês fechado) ──\nfunction calcOntem(){\n  const r = calcRitmo();\n  if(!r) return null;\n\n  if(r.status === 'corrente'){\n    const hoje = hojeInfo();\n    const dataRef = new Date(hoje.ano, hoje.mes-1, hoje.dia);\n    const ontem = new Date(dataRef);\n    ontem.setDate(ontem.getDate()-1);\n    const anoOntem = ontem.getFullYear(), mesOntem = ontem.getMonth()+1, diaOntem = ontem.getDate();\n\n    const idx = DADOS.meses.findIndex(label=>{\n      const p = parseMesLabel(label);\n      return p.ano===anoOntem && p.mes===mesOntem;\n    });\n    if(idx === -1) return { semReferencia:true, status:'corrente' };\n\n    const valor = DADOS.diarioTotal[idx] ? DADOS.diarioTotal[idx][String(diaOntem)] : undefined;\n    if(valor === undefined) return { semDado:true, dia:diaOntem, mesLabel: DADOS.meses[idx], status:'corrente' };\n\n    return { idx, mesLabel: DADOS.meses[idx], dia: diaOntem, valor, status:'corrente' };\n  }\n\n  if(r.status === 'fechado'){\n    // Mês já fechado: mostra o último dia com venda registrada nele, não \"ontem\"\n    const dias = Object.keys(DADOS.diarioTotal[r.idx] || {}).map(Number);\n    if(!dias.length) return { semDado:true, mesLabel:r.mesLabel, status:'fechado' };\n    const ultimoDia = Math.max(...dias);\n    const valor = DADOS.diarioTotal[r.idx][String(ultimoDia)];\n    return { idx:r.idx, mesLabel:r.mesLabel, dia:ultimoDia, valor, status:'fechado' };\n  }\n\n  return { semReferencia:true, status:r.status };\n}\n\n// ── Slats (barras de ranking com posição) — cada linha guarda o nome em\n// minúsculo em data-nome para permitir filtrar por busca sem recalcular posições ──\nfunction slats(el, pares, formatador){\n  el.innerHTML='';\n  formatador = formatador || fmtMoeda;\n  if(!pares.length || pares.every(p=>p[1]===0)){ el.innerHTML='<div class=\"vazio\">Sem dados para o período selecionado.<\/div>'; return; }\n  const max = pares[0][1] || 1;\n  pares.forEach(([nome,v],i)=>{\n    const row=document.createElement('div');\n    row.className='slat-row'+(i<3?' top'+(i+1):'');\n    row.dataset.nome = normaliza(nome);\n    row.innerHTML = `<div class=\"slat-nome\" title=\"${nome}\"><span class=\"rank-pos\">${i+1}º<\/span> ${nome}<\/div>\n      <div class=\"slat-trilho\"><div class=\"slat-barra\" style=\"width:${(v/max*100).toFixed(1)}%\"><\/div><\/div>\n      <div class=\"slat-num\">${formatador(v)}<\/div>`;\n    el.appendChild(row);\n  });\n}\n\n// Ícone decorativo (brasão de futebol genérico com \"HOD\") — ilustração própria inspirada na\n// ideia de escudo de clube, sem uso de marcas, cores oficiais ou brasões de terceiros.\nconst ICONE_BRASAO = `<svg class=\"fairy-icon\" viewBox=\"0 0 44 44\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n  <defs>\n    <path id=\"curvaBrasaoTopo\" d=\"M 5 15 A 17 17 0 0 1 39 15\"/>\n  <\/defs>\n  <path d=\"M 22 2.5 L 37 7.5 L 37 20 C 37 30.5 30.5 38.5 22 41.5 C 13.5 38.5 7 30.5 7 20 L 7 7.5 Z\"\n        fill=\"#3E5C37\" stroke=\"#1C2419\" stroke-width=\"1.3\"/>\n  <path d=\"M 22 6 L 33.3 9.7 L 33.3 20 C 33.3 28.8 28.2 35.3 22 37.9 C 15.8 35.3 10.7 28.8 10.7 20 L 10.7 9.7 Z\"\n        fill=\"#4F7345\"/>\n  <path d=\"M 22 6 L 33.3 9.7 L 33.3 20 C 33.3 28.8 28.2 35.3 22 37.9 Z\" fill=\"#446A3C\" opacity=\"0.55\"/>\n  <text font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"6.4\" fill=\"#F5F6F2\" letter-spacing=\"1.6\">\n    <textPath href=\"#curvaBrasaoTopo\" startOffset=\"50%\" text-anchor=\"middle\">GALÁTICOS<\/textPath>\n  <\/text>\n  <path d=\"M 22 12 L 24.1 17.6 L 30 17.9 L 25.4 21.6 L 27 27.3 L 22 24 L 17 27.3 L 18.6 21.6 L 14 17.9 L 19.9 17.6 Z\"\n        fill=\"#D9A441\" stroke=\"#B4794A\" stroke-width=\"0.4\" opacity=\"0.9\"/>\n  <text x=\"22\" y=\"26.5\" font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"8.5\" fill=\"#F5F6F2\" text-anchor=\"middle\" stroke=\"#1C2419\" stroke-width=\"0.35\">HOD<\/text>\n<\/svg>`;\n\n// Ícone decorativo (emblema circular \"4\") — ilustração própria inspirada na ideia de \"time dos quatro\",\n// sem uso de marcas, nomes ou tipografia de terceiros.\nconst ICONE_BADGE4 = `<svg class=\"fairy-icon\" viewBox=\"0 0 44 44\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n  <defs>\n    <path id=\"curvaTopo\" d=\"M 6 22 A 16 16 0 0 1 38 22\"/>\n    <path id=\"curvaBase\" d=\"M 8 26 A 14 14 0 0 0 36 26\"/>\n  <\/defs>\n  <circle cx=\"22\" cy=\"22\" r=\"21\" fill=\"#F4EEDD\" stroke=\"#C9BF9E\" stroke-width=\"1.2\"/>\n  <circle cx=\"22\" cy=\"22\" r=\"16.5\" fill=\"#1C63B7\" stroke=\"#0E3E7A\" stroke-width=\"1.4\"/>\n  <circle cx=\"22\" cy=\"22\" r=\"13.6\" fill=\"none\" stroke=\"#F4EEDD\" stroke-width=\"1\"/>\n  <text font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"7.8\" fill=\"#F4EEDD\" letter-spacing=\"1.4\">\n    <textPath href=\"#curvaTopo\" startOffset=\"50%\" text-anchor=\"middle\">LEADS<\/textPath>\n  <\/text>\n  <text font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"6.6\" fill=\"#F4EEDD\" letter-spacing=\"1.2\">\n    <textPath href=\"#curvaBase\" startOffset=\"50%\" text-anchor=\"middle\">TIME 1<\/textPath>\n  <\/text>\n  <text x=\"22\" y=\"27.5\" font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"17\" fill=\"#F4EEDD\" text-anchor=\"middle\">4<\/text>\n<\/svg>`;\n\n// Ícone decorativo (fadinha genérica) — ilustração própria, sem referência a marcas registradas.\nconst ICONE_FADA = `<svg class=\"fairy-icon\" viewBox=\"0 0 44 44\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n  <g transform=\"translate(22,23)\">\n    <path d=\"M -1 -3 C -13 -14 -20 -6 -14 2 C -9 8 -3 3 -1 -3 Z\" fill=\"#E85FA8\" stroke=\"#B23A80\" stroke-width=\"0.8\"/>\n    <path d=\"M 1 -3 C 13 -14 20 -6 14 2 C 9 8 3 3 1 -3 Z\" fill=\"#3E9CDC\" stroke=\"#2670A6\" stroke-width=\"0.8\"/>\n    <path d=\"M -1 3 C -9 12 -14 8 -10 3 C -7 -1 -3 0 -1 3 Z\" fill=\"#E85FA8\" stroke=\"#B23A80\" stroke-width=\"0.6\" opacity=\"0.95\"/>\n    <path d=\"M 1 3 C 9 12 14 8 10 3 C 7 -1 3 0 1 3 Z\" fill=\"#3E9CDC\" stroke=\"#2670A6\" stroke-width=\"0.6\" opacity=\"0.95\"/>\n    <circle cx=\"0\" cy=\"1\" r=\"4.6\" fill=\"#FFDDA8\" stroke=\"#B8791E\" stroke-width=\"0.6\"/>\n    <circle cx=\"-1.6\" cy=\"-0.4\" r=\"1\" fill=\"#2B1A0A\"/>\n    <circle cx=\"1.6\" cy=\"-0.4\" r=\"1\" fill=\"#2B1A0A\"/>\n    <path d=\"M -1.4 2.4 Q 0 3.8 1.4 2.4\" stroke=\"#B8492C\" stroke-width=\"0.9\" fill=\"none\" stroke-linecap=\"round\"/>\n    <path d=\"M 0 -3.6 Q -2.2 -6.6 -0.6 -8.2 Q 1 -6.6 0 -3.6 Z\" fill=\"#1FA85C\" stroke=\"#0F7A3F\" stroke-width=\"0.6\"/>\n    <path d=\"M 8 -10.5 L 9 -8.5 L 11 -8 L 9 -7.2 L 8 -5.2 L 7 -7.2 L 5 -8 L 7 -8.5 Z\" fill=\"#FFC72C\"/>\n    <path d=\"M -10 -7.4 L -9.4 -6.2 L -8.2 -5.8 L -9.4 -5.3 L -10 -4.1 L -10.5 -5.3 L -11.8 -5.8 L -10.5 -6.2 Z\" fill=\"#FFC72C\"/>\n    <circle cx=\"10.5\" cy=\"4\" r=\"0.9\" fill=\"#FFC72C\"/>\n  <\/g>\n<\/svg>`;\n\n// ── Desempenho por Time (Closers: A/B · SDRs: 1/2) ──\n// Meta de cada time = metade da meta do período selecionado (mesma lógica da meta geral,\n// que já soma os meses marcados no filtro). Sprinters NÃO passa por aqui — tem seção própria.\nfunction renderTimeCard(container, timeKey, timeInfo, mapaDiario, metaTime, pessoas){\n  const membros = timeInfo.membros;\n  const iconeHtml = timeInfo.icone==='badge4' ? ICONE_BADGE4 : (timeInfo.icone==='fada' ? ICONE_FADA : (timeInfo.icone==='brasao' ? ICONE_BRASAO : ''));\n  const div = document.createElement('div');\n  div.className = 'team-card';\n\n  const total = totalEquipe(membros, mapaDiario);\n  const pct = metaTime>0 ? (total/metaTime*100) : 0;\n  const falta = metaTime - total;\n\n  const linhaMembros = membros\n    .map(chave => {\n      const info = pessoas[chave];\n      const v = totalPessoa(chave, mapaDiario);\n      return { info, v };\n    })\n    .sort((a,b)=>b.v-a.v)\n    .map(({info,v}) => `<div class=\"team-card-membro\">\n        <span class=\"m-nome\">${info.apelido}${info.lider?' <span class=\"lider-tag\">★ líder<\/span>':''}${info.categoria ? ` <span class=\"cat-badge ${info.categoria}\">${CATEGORIA_LABEL[info.categoria]}<\/span>` : ''}<\/span>\n        <span class=\"m-valor\">${fmtMoeda(v)}<\/span>\n      <\/div>`).join('');\n\n  div.innerHTML = `\n    <div class=\"team-card-header\">\n      <span class=\"team-card-nome\">${iconeHtml}${timeInfo.nome} <span class=\"time-badge ${timeInfo.badge}\">${timeInfo.sigla}<\/span><\/span>\n    <\/div>\n    <div class=\"team-card-nums\">\n      <span class=\"team-card-total\">${fmtMoeda(total)}<\/span>\n      <span class=\"team-card-meta\">de ${fmtMoeda(metaTime)}<\/span>\n    <\/div>\n    <div class=\"team-card-trilho\"><div class=\"team-card-barra\" style=\"width:${Math.min(pct,100).toFixed(1)}%;${pct>=100?'background:var(--verde-2)':''}\"><\/div><\/div>\n    <div class=\"team-card-pct\">${pct.toFixed(1)}% da meta ${falta>0.01 ? '· faltam '+fmtMoeda(falta) : '· superada em '+fmtMoeda(-falta)}<\/div>\n    <div class=\"team-card-membros\">${linhaMembros}<\/div>\n  `;\n  container.appendChild(div);\n}\n\nfunction renderTimes(){\n  const meta = metaPeriodo();\n  const metaTime = meta / 2;\n  $('timesSub').textContent = `meta de cada time = metade da meta do período selecionado (${fmtMoeda(metaTime)})`;\n  const estrutura = estruturaAtual();\n\n  const contCloser = $('gTimesCloser'); contCloser.innerHTML = '';\n  Object.entries(estrutura.timesCloser).forEach(([k,info]) => renderTimeCard(contCloser, k, info, DADOS.diarioCloser, metaTime, estrutura.pessoasCloser));\n\n  const contSdr = $('gTimesSdr'); contSdr.innerHTML = '';\n  Object.entries(estrutura.timesSdr).forEach(([k,info]) => renderTimeCard(contSdr, k, info, DADOS.diarioSDR, metaTime, estrutura.pessoasSdr));\n}\n\n// ── Sprinters: NÃO é um time de vendas, é uma categoria de trabalho (por isso fica fora de\n// \"Desempenho por Time\", com visual próprio). Hoje rastreada pelo no-show de reuniões;\n// as vendas de quem está aqui continuam contando no Ranking de SDRs e no total geral. ──\n// ── Composição das Vendas (plano, forma de pagamento, ticket médio, observações) ──\n// DADOS.transacoes[idxMes] = lista de vendas individuais do mês, com forma/closer/sdr/valor/obs/plano.\n// Disponível a partir de outubro/26 — meses anteriores não têm granularidade de linha a linha.\nfunction transacoesFiltrado(){\n  const linhas = [];\n  st.meses.forEach(idx=>{\n    const lista = (DADOS.transacoes||[])[idx] || [];\n    lista.forEach(t=>{ if(t.d>=st.diaIni && t.d<=st.diaFim) linhas.push(t); });\n  });\n  return linhas;\n}\n// Lista só com números (sem barra) — nome, valor/qtd e % que representa do total do grupo\nfunction slatsComposicao(el, mapa){\n  el.innerHTML = '';\n  const pares = Object.entries(mapa).sort((a,b)=>b[1].soma-a[1].soma);\n  if(!pares.length){ el.innerHTML = '<div class=\"vazio\">Sem dados para o período selecionado.<\/div>'; return; }\n  const total = pares.reduce((s,[,{soma}])=>s+soma,0) || 1;\n  pares.forEach(([nome,{soma,qtd}],i)=>{\n    const pct = soma/total*100;\n    const row = document.createElement('div');\n    row.className = 'slat-row slat-row-sem-barra' + (i<3?' top'+(i+1):'');\n    row.innerHTML = `<div class=\"slat-nome\"><span class=\"rank-pos\">${i+1}º<\/span> ${nome}<\/div>\n      <div class=\"slat-num\">${fmtMoeda(soma)} · ${qtd} venda${qtd>1?'s':''} · ${pct.toFixed(1)}%<\/div>`;\n    el.appendChild(row);\n  });\n}\nfunction renderComposicao(){\n  const secao = $('secComposicao');\n  const linhas = transacoesFiltrado();\n  if(!linhas.length){ secao.style.display = 'none'; return; }\n  secao.style.display = '';\n\n  // Vendas \"normais\": exclui Low Ticket (por closer OU por plano — já tem seção própria) e\n  // Recuperação Diego (já rastreados à parte) e estornos\n  const vendas = linhas.filter(t => t.c!=='LOW TICKET' && t.c!=='DIEGO' && t.o!=='REEMBOLSO' && t.v>0 && (t.p||'').toLowerCase()!=='low ticket');\n  const tagsDe = t => (t.o||'').split('|');\n  const semRecorrencia = vendas.filter(t => !tagsDe(t).includes('RECORRENCIA'));\n\n  const ticketNominal = vendas.length ? vendas.reduce((s,t)=>s+t.v,0)/vendas.length : 0;\n  const ticketReal = semRecorrencia.length ? semRecorrencia.reduce((s,t)=>s+t.v,0)/semRecorrencia.length : 0;\n  $('kTicketReal').textContent = fmtMoeda(ticketReal);\n  $('kTicketNominal').textContent = fmtMoeda(ticketNominal);\n\n  const contarObs = (tag) => {\n    const itens = vendas.filter(t=>tagsDe(t).includes(tag));\n    return { qtd: itens.length, soma: itens.reduce((s,t)=>s+t.v,0) };\n  };\n  const mapObs = { RECORRENCIA:['kObsRecorrencia','kObsRecorrenciaDet'], SEMESTRAL:['kObsSemestral','kObsSemestralDet'], INDICACAO:['kObsIndicacao','kObsIndicacaoDet'], RENOVACAO:['kObsRenovacao','kObsRenovacaoDet'] };\n  for(const tag in mapObs){\n    const { qtd, soma } = contarObs(tag);\n    const [elQtd, elDet] = mapObs[tag];\n    $(elQtd).textContent = qtd;\n    $(elDet).textContent = qtd ? `${fmtMoeda(soma)} no período` : 'nenhuma no período';\n  }\n\n  // Por plano (vendas normais, sem low ticket/diego/estorno)\n  const porPlano = {};\n  vendas.forEach(t=>{\n    const k = t.p || 'Sem plano';\n    if(!porPlano[k]) porPlano[k] = { soma:0, qtd:0 };\n    porPlano[k].soma += t.v; porPlano[k].qtd += 1;\n  });\n  slatsComposicao($('gPlano'), porPlano);\n\n  // Por forma de pagamento (tudo com valor>0 e sem estorno, incluindo Low Ticket/Diego)\n  const comValor = linhas.filter(t => t.v>0 && t.o!=='REEMBOLSO');\n  const porForma = {};\n  comValor.forEach(t=>{\n    const k = t.f || 'Não informado';\n    if(!porForma[k]) porForma[k] = { soma:0, qtd:0 };\n    porForma[k].soma += t.v; porForma[k].qtd += 1;\n  });\n  slatsComposicao($('gForma'), porForma);\n}\n\n\nfunction renderSprinters(){\n  const estrutura = estruturaAtual();\n  const secao = $('secSprinters');\n  const linhas = sprintersDiasFiltrado();\n  if(!estrutura.sprinters || !linhas.length){ secao.style.display = 'none'; return; }\n  secao.style.display = '';\n\n  const { membros } = estrutura.sprinters;\n  const nomes = membros.map(chave => estrutura.pessoasSdr[chave].apelido).join(' e ');\n  $('sprintersNomes').textContent = nomes;\n\n  // Média do período = agregado (soma de todos os dias), não média simples dos % diários —\n  // assim um dia com poucas reuniões não pesa igual a um dia cheio.\n  const agendadas = linhas.reduce((s,l)=>s+l.ag,0);\n  const aconteceram = linhas.reduce((s,l)=>s+l.ac,0);\n  const pctComp = agendadas>0 ? (aconteceram/agendadas*100) : 0;\n  const pctNoShow = 100 - pctComp;\n  $('sprintersAgendadas').textContent = agendadas;\n  $('sprintersAconteceram').textContent = aconteceram;\n  $('sprintersPctNoShow').textContent = pctNoShow.toFixed(1) + '%';\n  $('sprintersPctNoShow').style.color = '#B05C4A';\n  $('sprintersPctComp').textContent = pctComp.toFixed(1) + '% de comparecimento';\n  const rotuloPeriodo = linhas.length>1 ? `média de ${sprintersLabelDia(linhas[0].idx,linhas[0].dia)} a ${sprintersLabelDia(linhas[linhas.length-1].idx,linhas[linhas.length-1].dia)}` : `dia ${sprintersLabelDia(linhas[0].idx,linhas[0].dia)}`;\n  $('sprintersPeriodoLabel').textContent = rotuloPeriodo;\n  $('sprintersBarra').style.width = Math.min(pctComp,100).toFixed(1) + '%';\n\n  // Médias por dia (sobre todos os dias do período, incluindo dias sem reunião agendada)\n  const nDias = linhas.length;\n  $('sprintersMediaAgendadas').innerHTML = `<strong>${(agendadas/nDias).toFixed(1)}<\/strong> agendadas/dia`;\n  $('sprintersMediaAconteceram').innerHTML = `<strong>${(aconteceram/nDias).toFixed(1)}<\/strong> realizadas/dia`;\n\n  // Melhor/pior dia (usado só para destacar as linhas na tabela diária) — só entre dias com\n  // reunião agendada (ag>0), senão um dia \"zerado\" ganharia como melhor dia por padrão.\n  const comDados = linhas.filter(l=>l.ag>0).map(l=>({ ...l, pctNoShow: (l.ag-l.ac)/l.ag*100 }));\n\n  // Tabela diária (Dia / Agendadas / Realizadas / No-show), mais recente primeiro, com escala\n  // de cor sobre o % de no-show relativa ao próprio período exibido.\n  const melhorDia = comDados.length ? comDados.reduce((a,b)=> b.pctNoShow<a.pctNoShow ? b : a) : null;\n  const piorDia = comDados.length ? comDados.reduce((a,b)=> b.pctNoShow>a.pctNoShow ? b : a) : null;\n  const minPct = comDados.length ? Math.min(...comDados.map(l=>l.pctNoShow)) : 0;\n  const maxPct = comDados.length ? Math.max(...comDados.map(l=>l.pctNoShow)) : 0;\n  const contDias = $('sprintersDias');\n  contDias.innerHTML = `<div class=\"metrica-table-head\"><span>Dia<\/span><span>Agendadas<\/span><span>Realizadas<\/span><span>No-show<\/span><\/div>`;\n  linhas.forEach(l=>{ // ordem cronológica (mais antigo primeiro)\n    const semReuniao = l.ag===0;\n    const pct = semReuniao ? null : (l.ag-l.ac)/l.ag*100;\n    const ehMelhor = melhorDia && l.idx===melhorDia.idx && l.dia===melhorDia.dia;\n    const ehPior = piorDia && l.idx===piorDia.idx && l.dia===piorDia.dia;\n    const row = document.createElement('div');\n    row.className = 'metrica-table-row' + (semReuniao ? ' sem-reuniao' : '');\n    const pillHtml = semReuniao\n      ? `<span class=\"metrica-pill\" style=\"background:var(--mdf);color:var(--tinta-2)\">–<\/span>`\n      : (()=>{ const {bg,fg} = escalaCor(pct, minPct, maxPct, false); return `<span class=\"metrica-pill\" style=\"background:${bg};color:${fg}\">${pct.toFixed(1)}%<\/span>`; })();\n    row.innerHTML = `\n      <span class=\"dia-nome\">${sprintersLabelDia(l.idx,l.dia)} <span class=\"metrica-dia-semana\">(${sprintersDiaSemana(l.idx,l.dia)})<\/span>${ehMelhor?' <span class=\"destaque-tag melhor\">melhor<\/span>':''}${ehPior?' <span class=\"destaque-tag pior\">pior<\/span>':''}<\/span>\n      <span>${semReuniao ? '–' : l.ag}<\/span>\n      <span>${semReuniao ? '–' : l.ac}<\/span>\n      ${pillHtml}\n    `;\n    contDias.appendChild(row);\n  });\n}\n\n// ── Toggle \"ver no-show por dia\" — tabela diária vem minimizada por padrão ──\n$('sprintersToggle').addEventListener('click', () => {\n  const tabela = $('sprintersDias');\n  const botao = $('sprintersToggle');\n  const expandido = tabela.style.display !== 'none';\n  tabela.style.display = expandido ? 'none' : '';\n  botao.setAttribute('aria-expanded', String(!expandido));\n  $('sprintersToggleLabel').textContent = expandido ? 'Ver no-show por dia' : 'Minimizar no-show por dia';\n  $('sprintersToggleSeta').textContent = expandido ? '▸' : '▾';\n});\n\n// ── Atingimento individual (meta mensal por categoria × nº de meses selecionados) ──\nfunction renderIndividualBloco(container, pessoas, mapaDiario, timesCloser, timesSdr){\n  container.innerHTML = '';\n  const nMeses = Math.max(st.meses.size, 1);\n\n  CATEGORIA_ORDEM.forEach(cat => {\n    const doCat = Object.entries(pessoas).filter(([,info]) => info.categoria === cat);\n    if(!doCat.length) return;\n\n    const heading = document.createElement('div');\n    heading.className = 'categoria-heading';\n    heading.innerHTML = `<span class=\"legenda-dot ${cat}\"><\/span>${CATEGORIA_LABEL[cat]} — meta ${fmtMoeda(doCat[0][1].meta)}/mês`;\n    container.appendChild(heading);\n\n    const lista = document.createElement('div');\n    lista.className = 'individual-list';\n\n    doCat\n      .map(([chave, info]) => ({ chave, info, valor: totalPessoa(chave, mapaDiario) }))\n      .sort((a,b)=>b.valor-a.valor)\n      .forEach(({chave, info, valor}) => {\n        const metaIndiv = info.meta * nMeses;\n        const pct = metaIndiv>0 ? (valor/metaIndiv*100) : 0;\n        const bateu = pct >= 100;\n        const row = document.createElement('div');\n        row.className = 'individual-row';\n        row.innerHTML = `\n          <div class=\"individual-row-topo\">\n            <span class=\"individual-nome\">${info.apelido}${info.lider?' <span class=\"lider-tag\">★<\/span>':''}${(() => { const t = info.time && (timesCloser[info.time]||timesSdr[info.time]); return t ? ` <span class=\"time-badge ${t.badge}\">${t.sigla}<\/span>` : ''; })()}<\/span>\n            <span class=\"individual-num\"><strong>${fmtMoeda(valor)}<\/strong> / ${fmtMoeda(metaIndiv)} · ${pct.toFixed(1)}%<\/span>\n          <\/div>\n          <div class=\"individual-bar-trilho\"><div class=\"individual-bar ${bateu?'bateu':cat}\" style=\"width:${Math.min(pct,100).toFixed(1)}%\"><\/div><\/div>\n        `;\n        lista.appendChild(row);\n      });\n\n    container.appendChild(lista);\n  });\n}\n\nfunction renderIndividual(){\n  const nMeses = Math.max(st.meses.size, 1);\n  $('individualSub').textContent = `meta mensal por categoria × ${nMeses} mês${nMeses>1?'es':''} selecionado${nMeses>1?'s':''}`;\n  const estrutura = estruturaAtual();\n  renderIndividualBloco($('gIndividualCloser'), estrutura.pessoasCloser, DADOS.diarioCloser, estrutura.timesCloser, estrutura.timesSdr);\n  renderIndividualBloco($('gIndividualSdr'), estrutura.pessoasSdr, DADOS.diarioSDR, estrutura.timesCloser, estrutura.timesSdr);\n}\n\n// ── Busca por nome dentro de um ranking (filtra sem recalcular posição) ──\nfunction ligaBusca(inputId, limparId, elId, infoId){\n  const input = $(inputId), botaoLimpar = $(limparId), el = $(elId), info = $(infoId);\n  let totalPessoas = 0;\n  function aplica(){\n    const termo = normaliza(input.value.trim());\n    botaoLimpar.classList.toggle('visivel', termo.length>0);\n    let visiveis = 0;\n    el.querySelectorAll('.slat-row').forEach(row=>{\n      const bate = !termo || row.dataset.nome.includes(termo);\n      row.style.display = bate ? '' : 'none';\n      if(bate) visiveis++;\n    });\n    info.textContent = termo ? `Mostrando ${visiveis} de ${totalPessoas}` : '';\n  }\n  input.addEventListener('input', aplica);\n  botaoLimpar.addEventListener('click', ()=>{ input.value=''; aplica(); input.focus(); });\n  return { aplica, setTotal(n){ totalPessoas = n; } };\n}\nconst buscaCloser = ligaBusca('buscaCloser','limpaBuscaCloser','gCloser','infoCloser');\nconst buscaSdr = ligaBusca('buscaSdr','limpaBuscaSdr','gSdr','infoSdr');\n\n// ── Divergência Closer x SDR por mês, dentro do recorte de dias atual ──\nfunction calcDivergencias(){\n  const divergentes = [];\n  [...st.meses].sort().forEach(i=>{\n    const totC = DADOS.closers.reduce((s,n)=>{\n      const dias = (DADOS.diarioCloser[n]||[])[i] || {};\n      let sub=0;\n      for(const d in dias){ if(+d>=st.diaIni && +d<=st.diaFim) sub+=dias[d]; }\n      return s+sub;\n    },0);\n    const totS = DADOS.sdrs.reduce((s,n)=>{\n      const dias = (DADOS.diarioSDR[n]||[])[i] || {};\n      let sub=0;\n      for(const d in dias){ if(+d>=st.diaIni && +d<=st.diaFim) sub+=dias[d]; }\n      return s+sub;\n    },0);\n    const diff = totC - totS;\n    if(Math.abs(diff) > 0.01) divergentes.push({ mes: DADOS.meses[i], totC, totS, diff });\n  });\n  return divergentes;\n}\n\n// ── Render geral ──\nfunction render(){\n  const nMeses = st.meses.size;\n  const filtroDiasTexto = (st.diaIni===1 && st.diaFim===31) ? '' : ` · dias ${st.diaIni}–${st.diaFim}`;\n  $('contagem').innerHTML = `<strong>${nMeses}<\/strong> mês${nMeses>1?'es':''} selecionado${nMeses>1?'s':''} · ${[...st.meses].sort().map(i=>DADOS.meses[i]).join(', ')}${filtroDiasTexto}`;\n\n  const rankCloser = rankingEquipe(DADOS.closers, DADOS.diarioCloser).filter(([,v])=>v>0);\n  const rankSdr = rankingEquipe(DADOS.sdrs, DADOS.diarioSDR).filter(([,v])=>v>0);\n  const totCloser = rankCloser.reduce((s,[,v])=>s+v,0);\n  const lowTicket = totalLowTicketFiltrado();\n  const recDiego = totalRecDiegoFiltrado();\n  const totGeral = totCloser + lowTicket.valor + recDiego.valor;\n  const meta = metaPeriodo();\n  const falta = meta - totGeral;\n\n  $('kMeta').textContent = fmtMoeda(meta);\n  $('kMetaDet').textContent = falta > 0.01 ? `faltam ${fmtMoeda(falta)}` : `meta superada em ${fmtMoeda(-falta)}`;\n  $('kTotal').textContent = fmtMoeda(totGeral);\n  $('kTotalDet').textContent = (meta ? `${(totGeral/meta*100).toFixed(1)}% da meta` : '—') + filtroDiasTexto;\n\n  // ── Projeção de fechamento: com base no ritmo até o dia em questão, em qual valor\n  // fecharíamos o mês? Só faz sentido para um único mês em andamento (o corrente) —\n  // mês já fechado mostra o resultado final real; sem mês corrente no recorte, fica vazio. ──\n  {\n    const r = calcRitmo();\n    const elProj = $('kProjecao'), elProjDet = $('kProjecaoDet');\n    if(r && r.status==='corrente' && st.meses.size===1 && st.meses.has(r.idx)){\n      const projecao = r.diasUteisDecorridos>0 ? (r.totalMes / r.diasUteisDecorridos) * r.diasUteisNoMes : 0;\n      const diffMeta = projecao - r.metaMes;\n      const notaDomingo = r.diasUteisNoMes!==r.diasNoMes ? ' (sem domingos)' : '';\n      elProj.textContent = fmtMoeda(projecao);\n      elProjDet.textContent = `ritmo até o dia ${r.diasDecorridos} de ${r.diasNoMes}${notaDomingo} · ${diffMeta>=0 ? 'bateria a meta em '+fmtMoeda(diffMeta) : 'ficaria '+fmtMoeda(-diffMeta)+' abaixo da meta'}`;\n    } else if(r && r.status==='fechado' && st.meses.size===1 && st.meses.has(r.idx)){\n      elProj.textContent = fmtMoeda(r.totalMes);\n      elProjDet.textContent = 'mês encerrado · resultado final';\n    } else {\n      elProj.textContent = '—';\n      elProjDet.textContent = 'selecione um único mês para ver a projeção';\n    }\n  }\n  $('kLowTicketValor').textContent = fmtMoeda(lowTicket.valor);\n  $('kLowTicketValorDet').textContent = `já somado ao Total Vendido${filtroDiasTexto}`;\n  $('kLowTicketQtd').textContent = lowTicket.qtd;\n  $('kLowTicketQtdDet').textContent = lowTicket.qtd===1 ? 'venda no período' : 'vendas no período';\n  $('kRecDiegoValor').textContent = fmtMoeda(recDiego.valor);\n  $('kRecDiegoValorDet').textContent = `já somado ao Total Vendido${filtroDiasTexto}`;\n  $('kRecDiegoQtd').textContent = recDiego.qtd;\n  $('kRecDiegoQtdDet').textContent = recDiego.qtd===1 ? 'recuperação no período' : 'recuperações no período';\n  $('secRecDiego').style.display = '';\n  // Evolução vs. mês anterior — compara o mês em foco com o mês imediatamente anterior.\n  // Se o mês em foco ainda está em andamento (mês corrente), a comparação usa o mesmo\n  // corte de dia nos dois meses (dia 1 até \"hoje\"), para ser uma comparação justa no meio do mês.\n  // Se o mês em foco já está fechado (passado por completo), compara o total INTEIRO de cada\n  // mês, mesmo que tenham quantidades de dias diferentes (ex.: Setembro=30 vs Agosto=31) —\n  // não faz sentido cortar Agosto no dia 30 só porque Setembro tem 30 dias.\n  {\n    const idxFoco = mesFocoAtual();\n    const idxAnterior = idxFoco - 1;\n    const diaCorteAtual = idxFoco>=0 ? diasElapsedNoMes(idxFoco) : 0;\n    const hoje = hojeInfo();\n    let mesEmAndamento = false;\n    if(idxFoco>=0 && hoje){\n      const {ano,mes} = parseMesLabel(DADOS.meses[idxFoco]);\n      mesEmAndamento = (ano===hoje.ano && mes===hoje.mes);\n    }\n    const diaCorteAnterior = idxAnterior<0 ? 0 : (mesEmAndamento ? diaCorteAtual : diasElapsedNoMes(idxAnterior));\n    const elEvo = $('kEvo'), elDet = $('kEvoDet'), elRot = $('kEvoRotulo');\n    elEvo.classList.remove('positivo','negativo');\n    if(idxFoco<0 || idxAnterior<0 || diaCorteAtual<=0){\n      elRot.textContent = 'Evolução vs. mês anterior';\n      elEvo.textContent = '—';\n      elDet.textContent = idxAnterior<0 ? 'sem mês anterior na base' : 'sem dias decorridos no mês em foco';\n    } else {\n      const totAtual = totalClosersAteDia(idxFoco, diaCorteAtual);\n      const totAnterior = totalClosersAteDia(idxAnterior, diaCorteAnterior);\n      elRot.textContent = mesEmAndamento\n        ? `Evolução vs. mês anterior (dias 1–${diaCorteAtual})`\n        : 'Evolução vs. mês anterior (mês completo)';\n      if(totAnterior > 0){\n        const variacao = (totAtual - totAnterior) / totAnterior * 100;\n        elEvo.textContent = (variacao>=0?'+':'') + variacao.toFixed(1) + '%';\n        elEvo.classList.add(variacao>=0 ? 'positivo' : 'negativo');\n      } else {\n        elEvo.textContent = totAtual>0 ? '+100%' : '—';\n        if(totAtual>0) elEvo.classList.add('positivo');\n      }\n      elDet.textContent = `${DADOS.meses[idxFoco]}: ${fmtMoeda(totAtual)} vs ${DADOS.meses[idxAnterior]}: ${fmtMoeda(totAnterior)}`;\n    }\n  }\n\n  const nDias = diasNoFiltro();\n  $('kMediaFiltro').textContent = nDias ? fmtMoeda(totGeral/nDias) + '/dia' : '—';\n  $('kMediaFiltroDet').textContent = nDias ? `${nDias} dia${nDias>1?'s':''} no recorte atual (domingos não contam a partir de out/26)` : 'sem dias no recorte atual';\n\n  slats($('gCloser'), rankCloser);\n  slats($('gSdr'), rankSdr);\n  buscaCloser.setTotal(rankCloser.length);\n  buscaSdr.setTotal(rankSdr.length);\n  buscaCloser.aplica();\n  buscaSdr.aplica();\n\n  // ── Reembolsos, respeitando o mesmo recorte de meses + dias ──\n  const rankReembCloser = rankingEquipe(DADOS.closers, DADOS.reembolsoCloser).filter(([,v])=>v>0);\n  const rankReembSdr = rankingEquipe(DADOS.sdrs, DADOS.reembolsoSDR).filter(([,v])=>v>0);\n  const totReembolsos = rankReembCloser.reduce((s,[,v])=>s+v,0);\n  const fmtContagem = v => `${v} pedido${v!==1?'s':''}`;\n  $('reembolsosSub').textContent = `${totReembolsos} pedido${totReembolsos!==1?'s':''} pago${totReembolsos!==1?'s':''} e cancelado${totReembolsos!==1?'s':''} em até 7 dias, no período selecionado — não entram no total vendido`;\n  slats($('gReembolsoCloser'), rankReembCloser, fmtContagem);\n  slats($('gReembolsoSdr'), rankReembSdr, fmtContagem);\n\n  // Alerta de divergência entre total de Closers e total de SDRs por mês\n  const divergentes = calcDivergencias();\n  const alerta = $('alertaDivergencia');\n  if(divergentes.length){\n    alerta.style.display = 'block';\n    alerta.innerHTML = '⚠️ <strong>Divergência entre Closers e SDRs detectada:<\/strong><br>' +\n      divergentes.map(d=>`${d.mes}: Closers ${fmtMoeda(d.totC)} × SDRs ${fmtMoeda(d.totS)} (diferença de ${fmtMoeda(Math.abs(d.diff))})`).join('<br>');\n  } else {\n    alerta.style.display = 'none';\n    alerta.innerHTML = '';\n  }\n\n  renderTimes();\n  renderComposicao();\n  renderSprinters();\n  renderIndividual();\n  renderRitmo();\n}\n\n// ── Renderiza os cartões de ritmo (dias restantes / necessário por dia / quanto ontem) ──\nfunction renderRitmo(){\n  const bloco = $('blocoRitmo');\n  const r = calcRitmo();\n  const rotuloDias = document.querySelector('#blocoRitmo .k-dias .rotulo');\n  const rotuloNecessario = document.querySelector('#blocoRitmo .k-necessario .rotulo');\n  const rotuloOntem = document.querySelector('#blocoRitmo .k-ontem .rotulo');\n\n  if(!r){\n    bloco.style.display = 'none';\n  } else if(r.status === 'futuro'){\n    bloco.style.display = 'grid';\n    rotuloDias.textContent = 'Dias restantes para a meta';\n    $('kDias').textContent = '—';\n    $('kDiasDet').textContent = `${r.mesLabel} ainda não começou`;\n    rotuloNecessario.textContent = 'Necessário por dia';\n    $('kNecessario').textContent = '—';\n    $('kNecessarioDet').textContent = '';\n  } else if(r.status === 'fechado'){\n    bloco.style.display = 'grid';\n    rotuloDias.textContent = 'Dias restantes para a meta';\n    $('kDias').textContent = 'Mês encerrado';\n    $('kDiasDet').textContent = `${r.mesLabel} já fechou (${r.diasNoMes} dias corridos)`;\n\n    rotuloNecessario.textContent = 'Resultado da meta';\n    if(r.faltaMes > 0.01){\n      $('kNecessario').textContent = 'Meta não batida';\n      $('kNecessarioDet').textContent = `faltaram ${fmtMoeda(r.faltaMes)} em ${r.mesLabel}`;\n    } else {\n      $('kNecessario').textContent = 'Meta batida';\n      $('kNecessarioDet').textContent = `superada em ${fmtMoeda(-r.faltaMes)} em ${r.mesLabel}`;\n    }\n  } else {\n    // mês corrente\n    bloco.style.display = 'grid';\n    rotuloDias.textContent = 'Dias restantes para a meta';\n    $('kDias').textContent = `${r.diasRestantes} dia${r.diasRestantes!==1?'s':''}`;\n    $('kDiasDet').textContent = `${r.mesLabel}, sem contar domingos (dia ${r.diasDecorridos} de ${r.diasNoMes}, hoje incluso)`;\n\n    rotuloNecessario.textContent = 'Necessário por dia';\n    if(r.faltaMes > 0.01){\n      $('kNecessario').textContent = fmtMoeda(r.necessarioPorDia) + '/dia';\n      $('kNecessarioDet').textContent = `para bater a meta de ${r.mesLabel} nos dias restantes`;\n    } else {\n      $('kNecessario').textContent = 'Meta batida';\n      $('kNecessarioDet').textContent = `superada em ${fmtMoeda(-r.faltaMes)}`;\n    }\n  }\n\n  // ── Quanto fizemos ontem (mês corrente) / Último dia registrado (mês fechado) ──\n  const o = calcOntem();\n  if(!o || o.semReferencia){\n    rotuloOntem.textContent = 'Quanto fizemos ontem';\n    $('kOntem').textContent = '—';\n    $('kOntemDet').textContent = o ? 'fora dos meses disponíveis' : '';\n  } else if(o.status === 'fechado'){\n    rotuloOntem.textContent = 'Último dia registrado';\n    if(o.semDado){\n      $('kOntem').textContent = '—';\n      $('kOntemDet').textContent = `${o.mesLabel} · sem registro`;\n    } else {\n      $('kOntem').textContent = fmtMoeda(o.valor);\n      $('kOntemDet').textContent = `dia ${o.dia} · ${o.mesLabel} (fechamento do mês)`;\n    }\n  } else if(o.semDado){\n    rotuloOntem.textContent = 'Quanto fizemos ontem';\n    $('kOntem').textContent = fmtMoeda(0);\n    $('kOntemDet').textContent = `dia ${o.dia||''} · ${o.mesLabel||''} · sem registro`.trim();\n  } else {\n    rotuloOntem.textContent = 'Quanto fizemos ontem';\n    $('kOntem').textContent = fmtMoeda(o.valor);\n    $('kOntemDet').textContent = `dia ${o.dia} · ${o.mesLabel}`;\n  }\n\n  renderGraficoLinha();\n}\n\n// ── Gráfico de linha: variação diária do mês de referência (data de atualização) ──\n// Calcula um passo \"redondo\" para o eixo (1/2/2,5/5/10 × potência de 10) a partir do valor\n// máximo e do nº de divisões desejado — mesmo algoritmo usado por bibliotecas de gráfico\n// para evitar marcações \"picadas\" como 6.434, 12.869, 19.303.\nfunction passoNiceEixo(valorMax, divisoesAlvo){\n  if(valorMax<=0) return 1;\n  const passoBruto = valorMax/divisoesAlvo;\n  const magnitude = Math.pow(10, Math.floor(Math.log10(passoBruto)));\n  const normalizado = passoBruto/magnitude;\n  let niceNormalizado;\n  if(normalizado<=1) niceNormalizado=1;\n  else if(normalizado<=2) niceNormalizado=2;\n  else if(normalizado<=2.5) niceNormalizado=2.5;\n  else if(normalizado<=5) niceNormalizado=5;\n  else niceNormalizado=10;\n  return niceNormalizado*magnitude;\n}\n\nfunction renderGraficoLinha(){\n  const svg = $('graficoLinha');\n  const r = calcRitmo();\n  svg.innerHTML = '';\n\n  if(!r || r.status === 'futuro'){\n    $('graficoLinhaSub').textContent = 'sem mês de referência para o período informado';\n    svg.innerHTML = '<text x=\"460\" y=\"130\" text-anchor=\"middle\" fill=\"var(--tinta-2)\" font-size=\"15\" font-family=\"Public Sans\">Informe uma data dentro dos meses disponíveis.<\/text>';\n    return;\n  }\n\n  const dadosBrutos = DADOS.diarioTotal[r.idx] || {};\n  const diasComVenda = Object.keys(dadosBrutos).map(Number);\n  const ultimoDiaComDado = diasComVenda.length ? Math.max(...diasComVenda) : (r.diasDecorridos || r.diasNoMes);\n  $('graficoLinhaSub').textContent = `evolução dia a dia — ${r.mesLabel} (até o dia ${ultimoDiaComDado})`;\n\n  if(!diasComVenda.length){\n    svg.innerHTML = '<text x=\"460\" y=\"130\" text-anchor=\"middle\" fill=\"var(--tinta-2)\" font-size=\"15\" font-family=\"Public Sans\">Sem dados diários para este mês.<\/text>';\n    return;\n  }\n\n  // Preenche TODOS os dias de 1 até o último dia com dado (dias sem venda = 0),\n  // para que o eixo X reflita corretamente o calendário e não pule dias.\n  const dias = [];\n  const dados = {};\n  for(let d=1; d<=ultimoDiaComDado; d++){\n    dias.push(d);\n    dados[d] = dadosBrutos[d] ?? 0;\n  }\n\n  const W=920,H=260,mL=70,mR=18,mT=18,mB=34;\n  const iw=W-mL-mR, ih=H-mT-mB;\n  const valores = dias.map(d=>dados[d]);\n  const maxYRaw = Math.max(...valores, 1);\n  // Eixo Y com números redondos (10.000 / 20.000 / 30.000...) em vez de dividir o pico em\n  // partes iguais (o que gerava números \"picados\" tipo 6.434, 12.869, 19.303).\n  const niceStep = passoNiceEixo(maxYRaw, 4);\n  const maxY = Math.ceil(maxYRaw/niceStep)*niceStep || niceStep;\n  const x = i => mL + (dias.length===1 ? iw/2 : iw*i/(dias.length-1));\n  const y = v => mT + ih - (v/maxY)*ih;\n\n  let g='';\n  const passos = Math.round(maxY/niceStep);\n  for(let i=0;i<=passos;i++){\n    const v=niceStep*i, yy=y(v);\n    g+=`<line x1=\"${mL}\" y1=\"${yy.toFixed(1)}\" x2=\"${W-mR}\" y2=\"${yy.toFixed(1)}\" stroke=\"#D7DECD\" stroke-width=\"1\"/>`;\n    g+=`<text x=\"${mL-10}\" y=\"${(yy+4).toFixed(1)}\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#5B6B54\" font-family=\"Public Sans\">${fmtNum(v)}<\/text>`;\n  }\n\n  const pontos = dias.map((d,i)=>`${x(i).toFixed(1)},${y(dados[d]).toFixed(1)}`).join(' ');\n  const areaPontos = `${x(0).toFixed(1)},${y(0).toFixed(1)} ${pontos} ${x(dias.length-1).toFixed(1)},${y(0).toFixed(1)}`;\n  g += `<polygon points=\"${areaPontos}\" fill=\"#3E5C37\" opacity=\"0.10\"/>`;\n  g += `<polyline points=\"${pontos}\" fill=\"none\" stroke=\"#3E5C37\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>`;\n\n  const passoLabel = Math.max(1, Math.ceil(dias.length/10));\n  dias.forEach((d,i)=>{\n    g += `<circle cx=\"${x(i).toFixed(1)}\" cy=\"${y(dados[d]).toFixed(1)}\" r=\"3.2\" fill=\"#3E5C37\" data-i=\"${i}\" class=\"ptoLinha\"/>`;\n    if(i % passoLabel === 0 || i===dias.length-1){\n      g += `<text x=\"${x(i).toFixed(1)}\" y=\"${H-10}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1C2419\" font-family=\"Public Sans\">${d}<\/text>`;\n    }\n  });\n\n  svg.innerHTML = g;\n\n  const tip = $('tipGraficoLinha');\n  svg.querySelectorAll('.ptoLinha').forEach(pt=>{\n    pt.addEventListener('mousemove', ()=>{\n      const i = +pt.dataset.i;\n      const d = dias[i];\n      const rectSvg = svg.getBoundingClientRect();\n      const bbox = pt.getBoundingClientRect();\n      tip.innerHTML = `<strong>Dia ${d}<\/strong> · ${fmtMoeda(dados[d])}`;\n      tip.style.left = (bbox.left - rectSvg.left + bbox.width/2) + 'px';\n      tip.style.top = (bbox.top - rectSvg.top) + 'px';\n      tip.style.opacity = 1;\n    });\n    pt.addEventListener('mouseleave', ()=>{ tip.style.opacity=0; });\n  });\n}\n\n// ── Data de atualização: apenas informativa (não filtra nada), default = hoje.\n// Serve de referência para os cartões de ritmo e também define, na carga inicial,\n// qual mês fica marcado sozinho no filtro de período. ──\nfunction mesCorrentePorData(inputVal){\n  if(!inputVal) return -1;\n  const [anoStr, mesStr] = inputVal.split('-');\n  const ano = parseInt(anoStr,10), mes = parseInt(mesStr,10);\n  return DADOS.meses.findIndex(label=>{\n    const p = parseMesLabel(label);\n    return p.ano===ano && p.mes===mes;\n  });\n}\n\n(function initDataAtualizacao(){\n  const input = $('dataAtualizacao');\n  const hoje = new Date();\n  const iso = hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0') + '-' + String(hoje.getDate()).padStart(2,'0');\n  input.value = iso;\n  $('hdrDataAtualizacao').textContent = input.value.split('-').reverse().join('/');\n  input.addEventListener('change', ()=>{\n    $('hdrDataAtualizacao').textContent = input.value ? input.value.split('-').reverse().join('/') : '–';\n    renderRitmo();\n  });\n\n  // Visualização padrão: apenas o mês corrente marcado no filtro de período\n  const idxCorrente = mesCorrentePorData(iso);\n  if(idxCorrente !== -1){\n    st.meses = new Set([idxCorrente]);\n  }\n})();\n\nmontaToggles();\nmontaFiltroDias();\nrender();\n\n<\/script>\n<\/body>\n<\/html>\n", "closers": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Performance Comercial — Closers HOD · Maio a Outubro/26<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --verde:
